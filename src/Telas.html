<script>
'use strict';
/* ═══════════════════════ VistAR · telas complementares ═══════════════════════
   Login, primeiro acesso, configurações, programação, painel de escolas,
   detalhe de escola e de vistoria, pendências de retorno, galeria de fotos,
   visualizador de fotos e assinatura em tela cheia. */

const ST_ESC = {
  concluida: ['Concluídas', 'var(--c-ok)'], andamento: ['Em andamento', 'var(--c-and)'], agendada: ['Agendadas', 'var(--c-ag)'],
  retorno: ['Retorno pendente', 'var(--c-ret)'], nao_iniciada: ['Não iniciadas', 'var(--c-ni)']
};
const SITUACAO = {
  retorno_solicitado: ['Retorno solicitado', 'var(--amber)', 'b-amber'], nao_concluida: ['Não concluída no dia', 'var(--teal)', 'b-teal'],
  sem_acesso: ['Sem acesso', '#8A9AB0', 'b-gray'], recusa: ['Recusa da direção', 'var(--red)', 'b-red'],
  aguardando_autorizacao: ['Aguardando autorização', 'var(--c-and)', 'b-blue'], area_interditada: ['Área interditada', 'var(--amber)', 'b-amber'],
  pendencias: ['Pendências da vistoria', 'var(--amber)', 'b-amber'], outro: ['Retorno', '#8A9AB0', 'b-gray']
};
const pct = (x, c) => fmt((x || 0) * 100, c || 0) + '%';
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const dISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dDe = iso => new Date(iso + 'T12:00:00');
const somaD = (iso, n) => { const d = dDe(iso); d.setDate(d.getDate() + n); return dISO(d); };
const minutos = h => { const m = String(h || '').match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : null; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const durTxt = m => Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');

/** Busca no servidor com cache (memória + aparelho): mostra o que tem e atualiza. */
const Dados = {
  mem: {},
  obter(chave, acao, payload, render, opts) {
    const c = this.mem[chave] || (opts && opts.semLS ? null : LS.get('c:' + chave));
    if (c) render(c, true);
    return Api.run(acao, payload).then(d => {
      this.mem[chave] = d;
      if (!(opts && opts.semLS)) LS.set('c:' + chave, d);
      render(d, false);
      return d;
    }).catch(e => { if (e.code === 'AUTH') return App.authLost(); if (!c) render(null, false, e); });
  },
  limpar(prefixo) { Object.keys(this.mem).forEach(k => { if (k.indexOf(prefixo) === 0) delete this.mem[k]; }); }
};
function encher(sel, html) { const el = $(sel); if (el) { el.innerHTML = html; Thumbs.hydrate(); MapaReal.ligar(); } return el; }

/* ───── Mapa real (Leaflet + OpenStreetMap, sem chave de API) ───── */
const COR_ST = { concluida: '#1E9E55', andamento: '#2F7BD6', agendada: '#E08A00', retorno: '#D93C3C', nao_iniciada: '#94A3B8', em_campo: '#2F7BD6', em_transito: '#E08A00', disponivel: '#1E9E55', pausa: '#94A3B8' };
const MapaReal = {
  fila: {},
  carregar() {
    if (window.L) return Promise.resolve(window.L);
    if (navigator.onLine === false) return Promise.reject(new Error('offline'));
    return this._p = this._p || new Promise((res, rej) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(css);
      const js = document.createElement('script');
      js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      js.onload = () => window.L ? res(window.L) : rej(new Error('Leaflet'));
      js.onerror = () => { this._p = null; rej(new Error('Leaflet')); };
      document.head.appendChild(js);
    });
  },
  /** Liga os mapas que acabaram de entrar na tela. */
  ligar() {
    const ids = Object.keys(this.fila);
    if (!ids.length) return;
    this.carregar().then(L => ids.forEach(id => {
      const el = document.getElementById(id), cfg = this.fila[id];
      delete this.fila[id];
      if (!el || !cfg) return;
      // Troca as classes do desenho ilustrativo (que estilizam svg e botões) pelas do mapa real.
      el.innerHTML = ''; el.className = 'mapa-leaflet';
      const m = L.map(el, { zoomControl: true, attributionControl: true, scrollWheelZoom: false, tap: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      const b = [];
      (cfg.pontos || []).forEach(p => {
        b.push([p.lat, p.lng]);
        const mk = L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 2, fillColor: COR_ST[p.st] || p.cor || '#94A3B8', fillOpacity: 1 }).addTo(m);
        if (p.nome) mk.bindPopup('<b>' + esc(p.nome) + '</b>' + (p.id ? '<br><button class="link" data-act="' + (p.act || 'escolaAbrir') + '" data-id="' + esc(p.id) + '">Abrir</button>' : ''));
      });
      if (cfg.linha && cfg.linha.length) { L.polyline(cfg.linha, { color: '#1F8F86', weight: 5, opacity: .85 }).addTo(m); cfg.linha.forEach(x => b.push(x)); }
      if (b.length === 1) m.setView(b[0], 15); else m.fitBounds(b, { padding: [24, 24], maxZoom: 16 });
      setTimeout(() => m.invalidateSize(), 150);
    })).catch(() => {
      ids.forEach(id => { delete this.fila[id]; const el = document.getElementById(id); const l = el && el.querySelector('.lbl-m'); if (l) l.textContent = 'Mapa ilustrativo · sem internet'; });
    });
  },
  /** Decodifica a linha da rota do Google (encoded polyline). */
  decodificar(str) {
    const out = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      for (const k of [0, 1]) {
        let b, sh = 0, r = 0;
        do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
        const d = r & 1 ? ~(r >> 1) : r >> 1;
        if (k === 0) lat += d; else lng += d;
      }
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
};
function erroBox(e) { return '<div class="empty">' + I('cloud', 36) + '<div><b>Sem dados por enquanto</b></div><div class="small">' + esc(e ? e.message : 'Conecte-se à internet para carregar.') + '</div><button class="btn btn-out btn-sm mt" data-act="rerender">' + I('refresh', 16) + ' Tentar de novo</button></div>'; }
const SKEL = '<div class="skel" style="height:180px;margin-bottom:14px"></div><div class="skel" style="height:120px;margin-bottom:14px"></div><div class="skel" style="height:120px"></div>';

/* ═════════════ Biometria (trava local do aparelho via WebAuthn) e lembretes ═════════════ */
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Bio = {
  async disponivel() {
    try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
  },
  async ativar() {
    const u = (App.data || {}).usuario || {};
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'VistAR' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: u.email || u.matricula || 'vistar', displayName: u.nome || 'VistAR' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    LS.set('bioId', b64(cred.rawId));
  },
  async desbloquear() {
    const id = LS.get('bioId');
    if (!id) return true;
    try {
      await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: 'public-key', id: deB64(id) }], userVerification: 'required', timeout: 60000 } });
      return true;
    } catch (e) { return false; }
  }
};

const Lembretes = {
  timers: [],
  agendar() {
    this.timers.forEach(clearTimeout); this.timers = [];
    if (!Prefs.get('lembrete') || !window.Notification || Notification.permission !== 'granted') return;
    const D = App.data || {};
    const hoje = hojeISO();
    (D.roteiro || []).filter(r => r.data === hoje && r.status === 'agendada' && r.hora).forEach(r => {
      const quando = dDe(hoje); const m = minutos(r.hora);
      quando.setHours(Math.floor(m / 60), m % 60 - 30, 0, 0);
      const ms = quando - Date.now();
      if (ms > 0 && ms < 18 * 3600e3) this.timers.push(setTimeout(() => {
        try { new Notification('Visita em 30 min', { body: ((App.escola(r.escolaId) || {}).nome || '') + ' às ' + r.hora }); } catch (e) { toast('Visita em 30 min · ' + ((App.escola(r.escolaId) || {}).nome || '')); }
      }, ms));
    });
  }
};

      '<button type="button" class="link" data-act="esqueci">Esqueci a senha</button></div>' +
      '<button class="btn btn-teal btn-lg mt" type="submit">Entrar</button>' +
      '<button type="button" class="btn btn-out btn-lg mt" data-act="primeiroAcesso">Primeiro acesso</button></form>' +
      '<p style="margin-top:auto;text-align:center;color:#9FB6D2;font-size:14.5px;padding-top:30px">VistAR · versão ' + esc(cfg.versao || '') + '<br>Precisa de ajuda? Fale com o administrador do sistema</p></div>',
    after() {
      const f = $('#fLogin');
      f.onsubmit = async ev => {
        ev.preventDefault();

      };
    }
  };
};

Views.primeiro = () => {

    corpo = '<section class="card"><h2 style="margin:0 0 4px">Bem-vindo!</h2><p class="muted" style="margin:0 0 14px">Informe seu e-mail ou matrícula e o código de 6 dígitos que o administrador enviou.</p>' +
      '<span class="lbl">E-mail ou matrícula</span><div class="in-ic">' + I('user', 20) + '<input class="inp" data-k="@login" value="' + esc(f.login) + '" autocomplete="username"></div>' +
      '<span class="lbl">Código de ativação</span><input class="inp" data-k="@codigo" value="' + esc(f.codigo) + '" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:8px;font-size:22px;font-weight:800;text-align:center"></section>' +
      '<button class="btn btn-teal btn-lg" data-act="paCodigo">Validar código</button>';
  } else if (f.passo === 2) {

    const forca = regras.filter(r => r[0]).length;

      '<span class="lbl">Nova senha</span><div class="in-ic">' + I('lock', 20) + '<input class="inp" type="password" id="paSenha" value="' + esc(s) + '" autocomplete="new-password"><button type="button" class="eye" data-act="olho">' + I('eye', 20) + '</button></div>' +

      '<span class="lbl">Confirmar nova senha</span><div class="in-ic">' + I('lock', 20) + '<input class="inp" type="password" id="paRep" value="' + esc(f.rep) + '" placeholder="Repita a senha" autocomplete="new-password"></div>' +

  }

    header: Views.hdrNavy('Primeiro acesso', 'Ative sua conta', '', f.passo === 3 ? 'paFim' : 'paVoltar'),
    body: topo + corpo + '<p class="muted small" style="text-align:center;margin-top:14px">Seus dados de perfil e equipe são definidos pelo administrador do sistema.</p>',
    after() {
      const s = $('#paSenha'), r = $('#paRep');
      if (s) s.oninput = () => { f.senha = s.value; const p = s.selectionStart; App.rerender(); const n = $('#paSenha'); n.focus(); n.setSelectionRange(p, p); };
      if (r) r.oninput = () => { f.rep = r.value; };
      if (f.passo === 3) Views.atualizarPermissoes();
    }

};

Views.permissoes = () => [['geolocation', 'Localização', 'Check-in, check-out e rota', 'pin'], ['camera', 'Câmera', 'Fotos das vistorias', 'camera'], ['notifications', 'Notificações', 'Lembretes e alertas', 'alert']]

Views.atualizarPermissoes = async () => {
  for (const el of $$('[data-perm]')) {
    let st = 'prompt';
    try {
      if (el.dataset.perm === 'notifications' && window.Notification) st = Notification.permission === 'default' ? 'prompt' : Notification.permission;
      else if (navigator.permissions) st = (await navigator.permissions.query({ name: el.dataset.perm })).state;
    } catch (e) { st = 'prompt'; }
    const m = { granted: ['b-green', 'Permitida'], denied: ['b-red', 'Bloqueada'], prompt: ['b-amber', 'Permitir'] }[st] || ['b-amber', 'Permitir'];
    el.className = 'badge ' + m[0]; el.textContent = m[1];
  }
};

/* ═════════════ Programação: dia, semana e mês ═════════════ */
Views.programacao = p => {
  const modo = p.modo || 'dia', ref = p.ref || hojeISO();
  const sup = App.supervisor();
  const eqId = p.equipeId !== undefined ? p.equipeId : (sup ? '' : ((App.data || {}).equipe || {}).id);
  let ini = ref, fim = ref, titulo = '';
  const d = dDe(ref);
  if (modo === 'semana') {
    const dow = (d.getDay() + 6) % 7; ini = somaD(ref, -dow); fim = somaD(ini, 6);
    titulo = 'Semana ' + dataBR(ini) + ' a ' + dataBR(fim);
  } else if (modo === 'mes') {
    const p1 = dISO(new Date(d.getFullYear(), d.getMonth(), 1));
    const u1 = dISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    ini = somaD(p1, -((dDe(p1).getDay() + 6) % 7)); fim = somaD(u1, 6 - ((dDe(u1).getDay() + 6) % 7));
    titulo = MESES[d.getMonth()][0].toUpperCase() + MESES[d.getMonth()].slice(1) + ' de ' + d.getFullYear();
  } else {
    titulo = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'][d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  }
  const eqNome = eqId ? ((((App._equipesLista || []).find(e => e.id === eqId)) || {}).nome || ((App.data || {}).equipe || {}).nome) : 'Todas as equipes';
  const pj = o => esc(JSON.stringify(Object.assign({ modo: modo, ref: ref, equipeId: eqId }, o)));
  const nav = { dia: 1, semana: 7 }[modo];
  const ant = modo === 'mes' ? dISO(new Date(d.getFullYear(), d.getMonth() - 1, 1)) : somaD(ref, -nav);
  const prx = modo === 'mes' ? dISO(new Date(d.getFullYear(), d.getMonth() + 1, 1)) : somaD(ref, nav);
  const rotuloNav = modo === 'dia' ? (ref === hojeISO() ? 'Hoje · ' : '') + dataBR(ref) : modo === 'semana' ? dataBR(ini) + ' – ' + dataBR(fim) : titulo.replace(' de ', ' ');
  return {
    header: '<header class="whdr"><div class="whdr-row"><button class="back" data-act="back" aria-label="Voltar">' + I('left') + '</button><span style="flex:1;min-width:0"><div class="kicker">Programação</div><div class="ttl">' + esc(titulo) + '</div></span>' +
      '<button class="badge" style="background:var(--navy-2);color:#fff;font-size:15.5px;padding:7px 14px" data-act="progEquipe" data-p="' + pj({}) + '">' + esc(eqNome) + '</button></div>' +
      '<div class="tabs3">' + [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']].map(t => '<button class="' + (modo === t[0] ? 'on' : '') + '" data-act="progIr" data-p="' + pj({ modo: t[0] }) + '">' + t[1] + '</button>').join('') + '</div></header>',
    body: '<div class="navper"><button class="back" data-act="progIr" data-p="' + pj({ ref: ant }) + '" aria-label="Anterior">' + I('left') + '</button><h3>' + esc(rotuloNav) + '</h3><button class="back" data-act="progIr" data-p="' + pj({ ref: prx }) + '" aria-label="Próximo">' + I('right') + '</button></div>' +
      '<div id="progBox">' + SKEL + '</div>',
    fab: sup ? '<button class="fab" data-act="visitaNova" data-p="' + pj({}) + '">' + I('plus', 22) + ' Nova visita</button>' : '',
    after() {
      Dados.obter('prog:' + ini + ':' + fim + ':' + eqId, 'programacao', { inicio: ini, fim: fim, equipeId: eqId }, (r, cache, e) => {
        if (!r) return encher('#progBox', erroBox(e));
        if (r.equipes) App._equipesLista = r.equipes;

};
Views.corItem = it => it.status === 'concluida' ? 'var(--green)' : it.status === 'retorno' || it.status === 'cancelada' ? 'var(--red)' : it.tipo === 'escritorio' ? 'var(--muted-2)' : 'var(--amber)';
Views.clsItem = it => it.status === 'concluida' ? 'ok' : it.status === 'retorno' ? 'ret' : it.status === 'em_andamento' ? 'and' : '';
Views.prog_mes = (itens, o) => {
  const ref = dDe(o.ref), mes = ref.getMonth();
  const doMes = itens.filter(i => dDe(i.data).getMonth() === mes);
  const visitas = doMes.filter(i => i.tipo !== 'escritorio');
  const porDia = {};
  itens.forEach(i => { (porDia[i.data] = porDia[i.data] || []).push(i); });

      '<span class="dots">' + cores.map(c => '<i style="background:' + c + '"></i>').join('') + '</span></button>';
  }

      '<div><small>Dias de campo</small><b>' + new Set(visitas.map(i => i.data)).size + '</b></div></div>' +
    '<div class="cal"><div class="cal-h">' + ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'].map(s => '<span>' + s + '</span>').join('') + '</div><div class="cal-g">' + cel + '</div></div>' +
    '<div class="leg"><span><i style="background:var(--green)"></i>Concluída</span><span><i style="background:var(--amber)"></i>Agendada ou parcial</span><span><i style="background:var(--red)"></i>Sem acesso ou recusa</span></div>' +
    '<h3 style="margin:16px 4px 10px;font-size:19px">Próximos compromissos</h3>' +
    (prox.length ? '<div class="tl">' + prox.map(i => '<div class="tl-row"><span class="h">' + dataBR(i.data) + '</span><i class="d" style="background:' + Views.corItem(i) + '"></i>' + Views.cartaoProg(i, true) + '</div>').join('') + '</div>'
      : '<div class="empty">Nenhum compromisso futuro neste período.</div>');
};
Views.cartaoProg = (i, comHora) => {

  if (i.tipo === 'escritorio') return '<div class="tl-card leve"><b>Dia de escritório</b><small>' + sub + '</small></div>';

};
Views.prog_semana = (itens, o) => {
  const visitas = itens.filter(i => i.tipo !== 'escritorio');
  let h = '<div class="kpi3"><div><small>Visitas</small><b>' + visitas.length + '</b></div><div><small>Concluídas</small><b class="c-green">' + visitas.filter(i => i.status === 'concluida').length + '</b></div>' +
    '<div><small>Parciais</small><b class="c-amber">' + visitas.filter(i => i.status === 'retorno').length + '</b></div></div>';

    const l = itens.filter(i => i.data === x);
    h += '<div class="wk-row"><button class="wk-day' + (x === hojeISO() ? ' hoje' : '') + '" data-act="progIr" data-p="' + o.pj({ modo: 'dia', ref: x }) + '"><small>' + SEMANA[dDe(x).getDay()] + '</small><b>' + dDe(x).getDate() + '</b></button><div class="wk-list">' +
      (l.length ? l.map(i => Views.cartaoProg(i)).join('') : '<div class="tl-card leve"><b>Sem programação</b></div>') + '</div></div>';
  }

};
Views.prog_dia = (itens, o) => {
  const l = itens.filter(i => i.data === o.ref).sort((a, b) => String(a.hora).localeCompare(b.hora));
  const visitas = l.filter(i => i.tipo !== 'escritorio');
  let campo = 0, previsto = 0;
  visitas.forEach(i => {
    const v = i.vistoria;
    if (v && v.checkin) campo += Math.round(((v.checkout ? new Date(v.checkout) : new Date()) - new Date(v.checkin)) / 60000);
    const a = minutos(i.hora), b = minutos(i.horaFim);
    previsto += a !== null && b !== null && b > a ? b - a : 180;
  });
  const linhas = [];
  let ultimoFim = null;
  visitas.forEach((i, k) => {
    const ini = minutos(i.vistoria && i.vistoria.checkin ? hora(i.vistoria.checkin) : i.hora);
    const fim = minutos(i.horaFim) || (ini !== null ? ini + 180 : null);
    if (k && ultimoFim !== null) {
      linhas.push({ h: hm(ultimoFim + 2), s: '', cor: '#6B7A90', html: '<div class="tl-card leve"><b>Deslocamento</b><small>Até ' + esc(semPrefixo(i.escola)) + '. Status da equipe: em trânsito</small></div>' });
      if (ultimoFim < 720 && ini !== null && ini > 780) linhas.push({ h: '12:00', s: '1h', cor: '#6B7A90', html: '<div class="tl-card leve"><b>Intervalo</b><small>Almoço da equipe</small></div>' });
    }
    const dur = i.vistoria && i.vistoria.checkout ? Math.round((new Date(i.vistoria.checkout) - new Date(i.vistoria.checkin)) / 60000) : (fim && ini !== null ? fim - ini : 180);
    const tag = i.status === 'concluida' ? '<span class="tag b-green mt">Concluída · ' + durTxt(dur) + '</span>' : i.status === 'em_andamento' ? '<span class="tag b-blue mt">Em andamento</span>'
      : i.status === 'retorno' ? '<span class="tag b-red mt">Retorno</span>' : '<span class="tag b-amber mt">Agendada · ' + durTxt(dur) + '</span>';
    const r = i.vistoria && i.vistoria.resumo;
    const det = ['DRE ' + (i.dre || ''), i.endereco, i.status === 'concluida' && r ? 'vistoria completa, ' + (r.ambientes || 0) + ' ambientes, ' + (r.fotos || 0) + ' fotos' : (i.ambientes ? i.ambientes + ' ambientes previstos' : ''),
      i.responsavel ? 'responsável: ' + i.responsavel + (i.confirmado ? ' (confirmou presença)' : '') : ''].filter(Boolean).join(' · ');
    linhas.push({ h: i.vistoria && i.vistoria.checkin ? hora(i.vistoria.checkin) : i.hora, s: fim ? 'até ' + hm(fim) : '', cor: Views.corItem(i),
      html: '<button class="tl-card ' + Views.clsItem(i) + '" data-act="escolaAbrir" data-id="' + i.escolaId + '"><b>' + esc(i.escola) + '</b><small>' + esc(det) + '</small><br>' + tag + '</button>' });
    ultimoFim = fim;
  });
  l.filter(i => i.tipo === 'escritorio').forEach(i => linhas.push({ h: i.hora || '08:00', s: '', cor: '#6B7A90', html: Views.cartaoProg(i) }));
  if (visitas.length) linhas.push({ h: hm(Math.max(ultimoFim || 960, 960) + 15), s: '30 min', cor: 'var(--teal)', html: '<div class="tl-card leve"><b>Fechamento do dia</b><small>Sincronizar fotos, conferir pendências e enviar relatórios</small></div>' });
  return '<div class="kpi3"><div><small>Escolas</small><b>' + visitas.length + '</b></div><div><small>Em campo</small><b>' + durTxt(campo) + '</b></div><div><small>Previsto</small><b>' + durTxt(previsto) + '</b></div></div>' +
    (linhas.length ? '<div class="tl">' + linhas.map(x => '<div class="tl-row"><span class="h">' + esc(x.h || '') + (x.s ? '<small>' + esc(x.s) + '</small>' : '') + '</span><i class="d" style="background:' + x.cor + '"></i>' + x.html + '</div>').join('') + '</div>'
      : '<div class="empty">' + I('calendar', 36) + '<div>Nada programado para este dia.</div></div>');
};

/* ═════════════ Painel de escolas (aba Escolas e supervisão) ═════════════ */
const Graf = {
  donut(cont, total) {
    const ordem = ['concluida', 'andamento', 'agendada', 'retorno', 'nao_iniciada'];
    const R = 52, C = 2 * Math.PI * R, gap = 3;
    let off = 0;
    const arcos = ordem.filter(k => cont[k]).map(k => {
      const len = cont[k] / (total || 1) * C;
      const a = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + ST_ESC[k][1] + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - gap) + ' ' + (C - Math.max(0, len - gap)) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"><title>' + ST_ESC[k][0] + ': ' + cont[k] + '</title></circle>';
      off += len; return a;
    }).join('');
    return '<svg viewBox="0 0 140 140" role="img" aria-label="Situação das escolas">' + arcos + '<text x="70" y="70" text-anchor="middle" fill="#fff" font-size="27" font-weight="800" font-family="Inter,Arial">' + pct((cont.concluida || 0) / (total || 1)) + '</text>' +
      '<text x="70" y="90" text-anchor="middle" fill="#C9D6E6" font-size="11" font-family="Inter,Arial">concluído</text></svg>';
  },
  /** Acumulado (%) x meta: uma escala só; barras diárias ficam num gráfico separado abaixo. */
  evolucao(serie) {
    if (!serie.length) return '';
    const W = 340, H = 130, padL = 30, padB = 18, w = W - padL - 6, h = H - padB - 8;
    const x = i => padL + (serie.length === 1 ? w / 2 : i * w / (serie.length - 1));
    const y = v => 8 + h - v * h;
    const max = Math.max(0.25, Math.ceil(Math.max.apply(null, serie.map(s => Math.max(s.pct, s.meta || 0))) * 4) / 4);
    const yy = v => y(v / max);
    const linha = serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yy(s.pct).toFixed(1)).join(' ');
    const meta = serie[0].meta !== null ? serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yy(s.meta).toFixed(1)).join(' ') : '';
    const grid = [0, 0.5, 1].map(f => '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="' + yy(max * f) + '" y2="' + yy(max * f) + '" stroke="var(--line)"/><text x="' + (padL - 6) + '" y="' + (yy(max * f) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + Math.round(max * f * 100) + '%</text>').join('');
    const ticks = serie.map((s, i) => i % Math.ceil(serie.length / 7) === 0 || i === serie.length - 1 ? '<text x="' + x(i) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + Number(s.d.slice(8)) + '</text>' : '').join('');
    const last = serie[serie.length - 1];
    const barW = Math.max(3, w / serie.length - 4), mx = Math.max(1, Math.max.apply(null, serie.map(s => s.n)));
    const bars = serie.map((s, i) => s.n ? '<rect x="' + (x(i) - barW / 2) + '" y="' + (44 - s.n / mx * 36) + '" width="' + barW + '" height="' + (s.n / mx * 36) + '" rx="3" fill="var(--teal)"/>' : '').join('');
    const hits = serie.map((s, i) => '<rect class="hit" data-i="' + i + '" x="' + (x(i) - w / serie.length / 2) + '" y="0" width="' + (w / serie.length) + '" height="' + H + '" fill="transparent"/>').join('');
    return '<div class="chart" data-serie="' + esc(JSON.stringify(serie)) + '"><svg viewBox="0 0 ' + W + ' ' + H + '">' + grid + ticks +
        (meta ? '<path d="' + meta + '" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>' : '') +
        '<path d="' + linha + '" fill="none" stroke="var(--navy)" stroke-width="2.4" style="stroke:var(--ink)"/>' +
        '<circle cx="' + x(serie.length - 1) + '" cy="' + yy(last.pct) + '" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>' +
        '<text x="' + (x(serie.length - 1) - 8) + '" y="' + (yy(last.pct) - 10) + '" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">' + pct(last.pct) + '</text>' + hits + '</svg>' +
      '<div class="small muted" style="margin:10px 0 2px;font-weight:600">Concluídas por dia</div><svg viewBox="0 0 ' + W + ' 48">' + bars + '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="44" y2="44" stroke="var(--line)"/></svg><div class="tip"></div></div>';
  },
  ligar() {
    $$('.chart[data-serie]').forEach(ch => {
      const serie = JSON.parse(ch.dataset.serie);
      const tip = $('.tip', ch);
      $$('.hit', ch).forEach(r => {
        const mostra = () => {
          const s = serie[r.dataset.i];
          const b = r.getBoundingClientRect(), c = ch.getBoundingClientRect();
          tip.innerHTML = '<b>' + dataBR(s.d) + '</b> · ' + s.n + ' concluída(s)<br>Acumulado ' + pct(s.pct) + (s.meta !== null ? ' · meta ' + pct(s.meta) : '');
          tip.style.left = (b.left - c.left + b.width / 2) + 'px'; tip.style.top = '30px'; tip.style.display = 'block';
        };
        r.addEventListener('pointerenter', mostra); r.addEventListener('pointerdown', mostra);
        r.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
      });
    });
  },
  /** Mapa real e interativo (OpenStreetMap). Sem internet, fica o desenho ilustrativo com os pontos. */
  mapa(pontos, alt) {
    if (!pontos.length) return '<div class="empty small">Escolas sem coordenadas. Use o menu VistAR › Geocodificar escolas na planilha.</div>';
    const la = pontos.map(p => p.lat), ln = pontos.map(p => p.lng);
    const mnA = Math.min.apply(null, la), mxA = Math.max.apply(null, la), mnL = Math.min.apply(null, ln), mxL = Math.max.apply(null, ln);
    const px = p => 6 + (mxL === mnL ? 0.5 : (p.lng - mnL) / (mxL - mnL)) * 88, py = p => 8 + (mxA === mnA ? 0.5 : (mxA - p.lat) / (mxA - mnA)) * 80;
    const id = 'mp' + Math.random().toString(36).slice(2, 8);
    (MapaReal.fila = MapaReal.fila || {})[id] = { pontos: pontos };
    return '<div class="mapdots mapa-real" id="' + id + '"' + (alt ? ' style="aspect-ratio:auto;height:' + alt + 'px"' : '') + '>' + Views.mapaIlustrativo().replace(/<path d="M112[^>]*\/>|<circle[^>]*\/>|<path d="M478[^>]*\/>|<text[^>]*>[^<]*<\/text>/g, '') +
      pontos.map(p => '<button style="left:' + px(p) + '%;top:' + py(p) + '%;background:' + (ST_ESC[p.st] || ST_ESC.nao_iniciada)[1] + '" data-act="' + (p.act || 'escolaAbrir') + '" data-id="' + p.id + '" title="' + esc(p.nome) + '" aria-label="' + esc(p.nome) + '"></button>').join('') +
      '<span class="lbl-m" style="position:absolute;right:8px;bottom:8px;background:var(--card);font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px">Carregando mapa…</span></div>';
  },
  legenda(ks) { return '<div class="leg">' + (ks || Object.keys(ST_ESC)).map(k => '<span><i style="background:' + ST_ESC[k][1] + '"></i>' + ST_ESC[k][0].replace(/s$/, '').replace('Concluída', 'Concluída') + '</span>').join('') + '</div>'; }
};

const Painel = {
  html(d) {
    const c = d.cont, t = d.total || 1;

    const corDre = x => x >= 0.5 ? 'var(--green)' : x >= 0.35 ? 'var(--teal)' : x >= 0.2 ? 'var(--amber)' : 'var(--red)';
    const v = (n, s) => n === null || n === undefined ? '' : '<small class="' + (n >= 0 ? 'up' : 'down') + '">' + (n >= 0 ? '▲ ' : '▼ ') + Math.abs(n) + '% ' + s + '</small>';
    const per = { hoje: 'hoje', semana: 'sem.', mes: '14 dias', contrato: 'contrato' }[d.periodo];

        '<div style="color:#C9D6E6;font-size:15.5px;margin-top:4px">Ritmo de <b style="color:#fff">' + fmt(d.ritmo, 1) + ' escola/dia</b> nos últimos 14 dias.</div>' +
        (delta !== null ? '<span class="pill-l ' + (delta >= 0 ? 'up' : 'down') + '">' + (delta >= 0 ? '▲ +' : '▼ ') + fmt(delta * 100, 0) + ' p.p. ' + (delta >= 0 ? 'acima' : 'abaixo') + ' da meta</span>' : '') +
        (d.previsao ? '<span class="pill-l">Previsão ' + dataBR(d.previsao) + '</span>' : '') + '</div></div>' +

Views.escolas = () => {
  const D = App.data || {};
  const st = App._esc = App._esc || { busca: '', dre: '', periodo: 'mes' };
  const dres = (D.dres || []).map(d => d.id);
  const q = st.busca.toLowerCase();
  const lista = (D.escolas || []).filter(e => (!st.dre || e.dre === st.dre) && (!q || (e.nome + ' ' + e.logradouro + ' ' + e.cie + ' ' + e.bairro).toLowerCase().indexOf(q) >= 0))
    .sort((a, b) => a.nome.localeCompare(b.nome));
  const rotPor = {};
  (D.roteiro || []).forEach(r => { if (!rotPor[r.escolaId] || r.data >= rotPor[r.escolaId].data) rotPor[r.escolaId] = r; });
  return {
    header: Views.hdrApp(),
    body: '<div class="search">' + I('search', 20) + '<input class="inp" id="busca" placeholder="Buscar escola, endereço ou CIE" value="' + esc(st.busca) + '"><button class="fbtn" data-act="limparBusca" aria-label="Limpar">' + (st.busca ? I('x', 18) : I('filter', 18)) + '</button></div>' +
      '<div class="fchips">' + [['', 'Todas as DREs']].concat(dres.map(x => [x, x])).map(x => '<button class="chip dark' + (st.dre === x[0] ? ' on' : '') + '" data-act="escDre" data-v="' + esc(x[0]) + '">' + esc(x[1]) + '</button>').join('') + '</div>' +
      (st.busca ? '' : '<div class="segbar">' + [['hoje', 'Hoje'], ['semana', 'Semana'], ['mes', 'Mês'], ['contrato', 'Contrato']].map(x => '<button class="' + (st.periodo === x[0] ? 'on' : '') + '" data-act="escPer" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div><div id="painel">' + SKEL + '</div>') +
      '<div class="sec-t"><h2>' + (st.busca ? 'Resultados' : 'Escolas') + ' · ' + lista.length + '</h2></div>' +
      lista.map(e => Views.cartaoEscola(rotPor[e.id] || { escolaId: e.id, status: e.status, data: '' }, false)).join(''),
    nav: 'escolas',
    after() {
      const b = $('#busca');
      b.oninput = () => { st.busca = b.value; clearTimeout(b._t); b._t = setTimeout(() => { const p = b.selectionStart; App.rerender(); const n = $('#busca'); n.focus(); n.setSelectionRange(p, p); }, 250); };
      if (!st.busca) Dados.obter('painel:' + st.periodo + ':' + st.dre, 'painel', { periodo: st.periodo, dre: st.dre }, (d, c, e) => { encher('#painel', d ? Painel.html(d) : erroBox(e)); Graf.ligar(); });
    }
  };
};

/* ═════════════ Visualizador de fotos ═════════════ */
const Visor = {
  abrir(lista, i) {
    this.lista = lista; this.i = i;
    Sheet.opts = {};
    this.render();
  },
  async src(f, grande) {
    if (f.local) {
      const it = Sync.q.find(x => x.acao === 'uploadFoto' && x.payload.id === f.fid);
      if (it && grande) return it.payload.data;
    }
    const k = 'g:' + f.fileId;
    if (grande && f.fileId) {
      if (Thumbs.mem.get(k)) return Thumbs.mem.get(k);
      try { const r = await Api.run('thumbs', { ids: [f.fileId], tamanho: 1200 }); if (r[f.fileId]) { Thumbs.mem.set(k, r[f.fileId]); return r[f.fileId]; } } catch (e) { /* offline */ }
    }
    return Thumbs.mem.get(f.id) || Thumbs.mem.get(f.fid) || (f.fileId && Thumbs.mem.get('f:' + f.fileId)) || '';
  },
  async render() {
    const f = this.lista[this.i], n = this.lista.length;
    const enviada = f.st !== 'pend';
    const loc = f.lat && f.lng ? fmt(f.lat, 4) + ' / ' + fmt(f.lng, 4) : '—';
    // Foto em destaque: no celular em pé, os detalhes ficam recolhidos; deitado ou no computador, ao lado da foto.
    const aberto = !!this.detalhes;
    $('#layer').innerHTML = '<div class="pv"><div class="pv-top"><button class="back" data-act="sheetClose" aria-label="Fechar">' + I('left') + '</button><span class="t"><b>Foto ' + (this.i + 1) + ' de ' + n + '</b><small>' + esc(ROTULO_ETAPA[f.etapa] || '') + '</small></span>' +
      '<button class="back" data-act="visorMais" aria-label="Compartilhar">' + I('share', 20) + '</button></div>' +
      '<div class="pv-corpo"><div class="pv-foto"><div class="pv-img" id="pvImg"><img id="pvI" alt="">' +
        (n > 1 ? '<button class="pv-nav ant" data-act="visorIr" data-i="' + (this.i - 1) + '" aria-label="Foto anterior"' + (this.i ? '' : ' disabled') + '>' + I('left', 26) + '</button>' +
          '<button class="pv-nav prox" data-act="visorIr" data-i="' + (this.i + 1) + '" aria-label="Próxima foto"' + (this.i < n - 1 ? '' : ' disabled') + '>' + I('right', 26) + '</button>' : '') + '</div>' +
        (n > 1 ? '<div class="pv-strip">' + this.lista.map((x, j) => '<button class="' + (j === this.i ? 'on' : '') + '" data-act="visorIr" data-i="' + j + '" aria-label="Foto ' + (j + 1) + '"><img data-th="' + x.id + '"' + (x.fileId ? ' data-fid="' + x.fileId + '"' : '') + ' alt=""></button>').join('') + '</div>' : '') + '</div>' +
      '<div class="pv-info' + (aberto ? ' aberto' : '') + '">' +
        '<div class="row" style="align-items:flex-start"><span style="flex:1;min-width:0"><b style="font-size:19px">' + esc(f.rotulo || 'Foto') + '</b><div class="muted">' + esc(f.escola || '') + '</div></span><span class="badge ' + (enviada ? 'b-green">Enviada' : 'b-amber">Na fila') + '</span></div>' +
        '<textarea class="inp mt" id="pvLeg" placeholder="Legenda: o que a foto mostra" rows="1" style="min-height:48px">' + esc(f.legenda || '') + '</textarea>' +
        '<button class="pv-mais" data-act="visorDetalhes" aria-expanded="' + aberto + '">' + (aberto ? 'Ocultar detalhes' : 'Detalhes e ações') + ' <span>' + (aberto ? '▴' : '▾') + '</span></button>' +
        '<div class="pv-det"><div class="kv2"><div><small>Data e hora</small><b>' + (f.criadoEm ? dataBR(f.criadoEm, true) + ' · ' + hora(f.criadoEm) : '—') + '</b></div><div><small>Local</small><b>' + loc + '</b></div>' +
          '<div><small>Registrada por</small><b>' + esc(f.autor || (f.local ? ((App.data || {}).usuario || {}).nome : '') || '—') + '</b></div><div><small>Etapa</small><b>' + esc(ROTULO_ETAPA[f.etapa] || f.etapa || '—') + '</b></div></div>' +
          '<div class="grid2">' + (f.local ? '<button class="btn btn-out" data-act="visorRefazer">Refazer</button>' : '') + '<button class="btn btn-out" data-act="visorShare">Compartilhar</button>' +
            (f.local ? '<button class="btn btn-out-red" data-act="visorDel">Excluir</button>' : '') + '</div></div></div></div></div>';
    Thumbs.hydrate();
    const img = $('#pvI');
    img.src = await this.src(f, false);
    this.src(f, true).then(s => { if (s && $('#pvI') && this.lista[this.i] === f) $('#pvI').src = s; });
    const leg = $('#pvLeg');
    leg.onchange = () => this.legenda(f, leg.value);
    // Deslizar para trocar de foto
    let x0 = null;
    const area = $('#pvImg');
    area.addEventListener('pointerdown', e => { x0 = e.clientX; });
    area.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) this.ir(this.i + (dx < 0 ? 1 : -1)); });
    const on = $('.pv-strip button.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  },
  ir(i) { if (i >= 0 && i < this.lista.length) { this.i = i; this.render(); } },
  async legenda(f, txt) {
    f.legenda = txt;
    const V = App.V;
    if (f.local && V && V.fotos[f.fid]) {
      V.fotos[f.fid].legenda = txt; Vist.salvar();
      const it = Sync.q.find(x => x.acao === 'uploadFoto' && x.payload.id === f.fid && !x.running);
      if (it) { it.payload.legenda = txt; await IDB.put('outbox', it); toast('Legenda salva', 'ok', 1200); return; }
    }
    Sync.add('legenda', { id: f.fid, legenda: txt }, 'leg:' + f.fid);
    toast('Legenda salva', 'ok', 1200);
  }
};

      '<div class="grid2" style="grid-template-columns:1fr 1.4fr"><button class="btn btn-out btn-lg" data-act="sigLimparBig">Limpar</button><button class="btn btn-teal btn-lg" data-act="sigOk" data-k="' + p.k + '">Confirmar assinatura</button></div>' +
      '<p class="muted small" style="text-align:center;margin-top:14px">Dica: gire o aparelho para a horizontal para ter mais espaço.</p>',
    after() {
      Geo.get(6000).then(pos => { const g = $('#sigGeo'); if (g) g.textContent = pos ? 'Localização registrada' : 'Sem localização'; });
      const box = $('#sigBig'), cv = $('canvas', box);
      const dpr = window.devicePixelRatio || 1;
      const ajustar = () => { const b = box.getBoundingClientRect(); cv.width = b.width * dpr; cv.height = b.height * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.8; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1B2F8A'; cv._n = 0; };
      ajustar();
      const g = () => cv.getContext('2d');
      let des = false, last = null;
      const pt = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
      cv.addEventListener('pointerdown', e => { des = true; last = pt(e); cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', e => {
        if (!des) return;
        const q = pt(e), c = g();
        c.beginPath(); c.moveTo(last.x, last.y); c.quadraticCurveTo(last.x, last.y, (last.x + q.x) / 2, (last.y + q.y) / 2); c.lineTo(q.x, q.y); c.stroke();
        last = q; cv._n++;
      });
      ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { des = false; }));
      window.addEventListener('orientationchange', () => setTimeout(ajustar, 300), { once: true });
    }
  };
};

/* ═════════════ Retomar vistoria de onde parou ═════════════ */
async function iniciarVistoria(e, pos, base) {
  const V = Vist.novo(e, pos);
  let fotosCopiar = [];
  if (base) {
    Object.keys(base.etapas || {}).forEach(k => { if (V.d[k]) V.d[k] = Object.assign(V.d[k], base.etapas[k].dados || {}); });
    V.d.revisao.assResp = ''; V.d.revisao.assEmpresa = '';
    (base.fotos || []).forEach(f => {
      const id = uid();
      V.fotos[id] = { id: id, etapa: f.etapa, slot: f.slot, ref: f.ref, fileId: f.fileId, legenda: f.legenda, criadoEm: f.criadoEm, st: 'ok' };
      fotosCopiar.push({ id: id, de: f.id });
      const th = Thumbs.mem.get('f:' + f.fileId); if (th) Thumbs.mem.set(id, th);
    });
    V.retomadaDe = base.id;
  }
  App.V = V;
  Vist.salvar(true);
  await Sync.add('checkin', { id: V.id, escolaId: e.id, checkin: V.checkin, lat: V.lat, lng: V.lng, retomarDe: base ? base.id : '', fotosCopiar: fotosCopiar });
  // "init" só preenche o que o servidor ainda não tem: se um colega já abriu a escola, nada dele é sobrescrito.
  ETAPAS.forEach(x => { Vist.mudou(x.k, false, true); Vist.tocar(x.k, true); });
  const D = App.data;
  const rot = (D.roteiro || []).find(r => r.escolaId === e.id && r.status !== 'concluida');
  if (rot) rot.status = 'em_andamento';
  D.equipe.status = 'em_campo'; D.equipe.destinoEscolaId = '';
  LS.set('boot', D);
  vib(20);
  toast((base ? 'Retomada' : 'Check-in') + ' às ' + hora(V.checkin) + ' · ' + curto(e.nome), 'ok');
  if (base) {
    const prim = ETAPAS.find(x => x.k !== 'revisao' && Pend.etapa(x.k).length);
    V.etapa = prim ? prim.k : 'revisao';
  }
  Router.reset('home'); Router.go('etapa', { k: V.etapa || 'dados' });
}

  visorDetalhes() { Visor.detalhes = !Visor.detalhes; const i = $('.pv-info'); if (!i) return; i.classList.toggle('aberto', Visor.detalhes); const b = $('.pv-mais'); b.setAttribute('aria-expanded', Visor.detalhes); b.innerHTML = (Visor.detalhes ? 'Ocultar detalhes' : 'Detalhes e ações') + ' <span>' + (Visor.detalhes ? '▴' : '▾') + '</span>'; },
  async visorShare() {
    const f = Visor.lista[Visor.i];
    const src = await Visor.src(f, true);
    try {
      const blob = await (await fetch(src)).blob();
      const file = new File([blob], 'VistAR_' + (f.rotulo || 'foto').replace(/\W+/g, '_') + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: f.rotulo, text: (f.escola || '') + ' · ' + (f.legenda || f.rotulo || '') }); return; }
    } catch (e) { /* cai no download */ }
    baixarDataUrl(src, 'VistAR_foto.jpg');
  },
  visorMais() { Act.visorShare(); },
  async visorDel() {
    const f = Visor.lista[Visor.i];
    if (!(await confirmar({ titulo: 'Excluir esta foto?', sim: 'Excluir', perigo: true }))) { Visor.render(); return; }
    await Fotos.remover(f.fid);
    Visor.lista.splice(Visor.i, 1);
    toast('Foto excluída');
    if (!Visor.lista.length) { Sheet.close(true); App.rerender(); return; }
    Visor.i = Math.min(Visor.i, Visor.lista.length - 1); Visor.render(); App.rerender();
  },
  visorRefazer() {
    const f = Visor.lista[Visor.i];
    const V = App.V, of = V && V.fotos[f.fid];
    if (!of) return;
    Sheet.close(true);
    const alvo = { slot: of.slot, etapa: of.etapa, ref: of.ref, rotulo: f.rotulo, escola: V.d.dados.nome, sub: (ROTULO_ETAPA[of.etapa] || '') + ' · ' + f.rotulo, unico: true };
    alvo.onFoto = async img => { await Fotos.remover(of.id); await Fotos.adicionar(Object.assign({}, alvo, { onFoto: null }), img); };
    Camera.abrir(alvo);
  },
  camFechar() { Camera.fechar(); },
  camFoto() { Camera.foto(); },
  camSlot(el) { const o = Camera.alvo.opcoes[Number(el.dataset.i)]; Object.assign(Camera.alvo, o, { rotulo: o.rot, sub: (ROTULO_ETAPA[o.etapa] || '') + ' · ' + o.rot }); Camera.ui(); },
  async camVirar() { Camera.parar(); Camera.frente = !Camera.frente; const a = Camera.alvo; try { await Camera.aoVivo(); Camera.alvo = a; Camera.ui(); } catch (e) { Camera.fechar(); } },
  async camLuz(el) {
    const t = Camera.stream && Camera.stream.getVideoTracks()[0];
    try { Camera._luz = !Camera._luz; await t.applyConstraints({ advanced: [{ torch: Camera._luz }] }); el.style.color = Camera._luz ? '#F5C77A' : ''; }
    catch (e) { toast('Lanterna indisponível neste aparelho.', 'warn'); }
  },
  sigLimparBig() { const cv = $('#sigBig canvas'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); cv._n = 0; },
  async sigOk(el) {
    const cv = $('#sigBig canvas');
    if ((cv._n || 0) < 6) { toast('Faça a assinatura dentro do quadro.', 'warn'); return; }
    const dpr = window.devicePixelRatio || 1;
    const out = document.createElement('canvas');
    out.width = Math.min(900, cv.width / dpr); out.height = out.width * cv.height / cv.width;
    out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
    const k = el.dataset.k, pos = Geo.last;
    Form.set(k, out.toDataURL('image/png'));
    Form.set(k + 'Em', new Date().toISOString());
    Form.set(k + 'Geo', pos ? pos.lat + ',' + pos.lng : '');
    Vist.tocar('revisao', true);
    vib(20); toast('Assinatura registrada', 'ok');
    Router.back();
  },
  enviarAgora() { Sync.forcar = true; Sync.fails = 0; Sync.kick(); toast('Enviando fila…'); setTimeout(() => App.rerender(), 600); },
  fotCat(el) { App._fot.etapa = el.dataset.v; App.rerender(); },
  fotDrop(el) {
    const k = el.dataset.k, D = App.data || {};
    const ops = k === 'escolaId' ? (D.escolas || []).map(e => [e.id, e.nome]) : k === 'dre' ? (D.dres || []).map(d => [d.id, 'DRE ' + d.id])
      : k === 'periodo' ? [['semana', 'Últimos 7 dias'], ['mes', 'Últimos 30 dias']] : (App._equipesLista || []).map(e => [e.id, e.nome]);
    Sheet.open('<h3>Filtrar</h3><button class="opt" data-act="fotSet" data-k="' + k + '" data-v="">Todos</button>' + ops.map(o => '<button class="opt" data-act="fotSet" data-k="' + k + '" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>').join(''));
  },
  fotSet(el) { Sheet.close(true); App._fot[el.dataset.k] = el.dataset.v; App.rerender(); },
  fotFiltros() { Act.fotDrop({ dataset: { k: 'periodo' } }); },
  pendSit(el) { App._pend.sit = el.dataset.v; App.rerender(); },
  pendDrop(el) {
    const k = el.dataset.k, d = App._pendDados || { itens: [] };
    const ops = Array.from(new Set(d.itens.map(i => i[k]).filter(Boolean)));
    Sheet.open('<h3>' + (k === 'dre' ? 'DRE' : 'Equipe') + '</h3><button class="opt" data-act="pendSet" data-k="' + k + '" data-v="">Todas</button>' + ops.map(o => '<button class="opt" data-act="pendSet" data-k="' + k + '" data-v="' + esc(o) + '">' + esc(o) + '</button>').join(''));
  },
  pendSet(el) { Sheet.close(true); App._pend[el.dataset.k] = el.dataset.v; App.rerender(); },
  pendFiltros() { Act.pendDrop({ dataset: { k: 'dre' } }); },
  reagendar(el) {
    const id = el.dataset.id, e = App.escola(id) || {};
    const sup = App.supervisor();
    Sheet.open('<h3>Programar visita</h3><p class="muted" style="margin:2px 0 6px">' + esc(e.nome || '') + '</p>' +
      F.row('<div class="fld"><span class="lbl">Data</span><input class="inp" type="date" id="rgData" min="' + hojeISO() + '" value="' + somaD(hojeISO(), 1) + '"></div>', '<div class="fld"><span class="lbl">Hora</span><input class="inp" type="time" id="rgHora" value="08:30"></div>') +
      (sup ? '<span class="lbl">Equipe</span><select class="inp" id="rgEq">' + (App._equipesLista || [{ id: '', nome: '—' }]).map(q => '<option value="' + q.id + '">' + esc(q.nome) + '</option>').join('') + '</select>' : '') +
      '<span class="lbl">Observação</span><input class="inp" id="rgNota" placeholder="Ex.: confirmado com a diretora">' +
      '<label class="check mt" style="cursor:pointer"><input type="checkbox" id="rgConf" style="width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto"><span class="t">Confirmado com a unidade</span></label>' +
      '<button class="btn btn-teal mt" id="rgOk">' + I('calendar', 20) + ' Salvar data</button>', { focus: false });
    $('#rgOk').onclick = async () => {
      carregando($('#rgOk'), true);
      try {
        await Api.run('reagendar', { escolaId: id, data: $('#rgData').value, hora: $('#rgHora').value, nota: $('#rgNota').value, confirmado: $('#rgConf').checked, equipeId: $('#rgEq') ? $('#rgEq').value : '' });
        Sheet.close(true); toast('Visita programada para ' + dataBR($('#rgData') ? $('#rgData').value : hojeISO()), 'ok');
        Dados.limpar('pend'); Dados.limpar('prog'); Dados.limpar('esc:'); App.refresh(); App.rerender();
      } catch (e) { carregando($('#rgOk'), false); toast(e.net ? 'Sem conexão: reagendamento precisa de internet.' : e.message, 'err'); }
    };
  },
  async cobrar(el) {
    carregando(el, true);
    try {
      const r = await Api.run('cobrarDre', { escolaId: el.dataset.id });
      carregando(el, false);
      if (r.enviado) toast('E-mail enviado para ' + r.nome, 'ok');
      else if (r.tel && await confirmar({ titulo: 'DRE sem e-mail cadastrado', texto: 'Ligar para ' + esc(r.nome || 'o engenheiro da DRE') + ' (' + esc(r.tel) + ')?', sim: 'Ligar' })) abrirExterno('tel:' + r.tel.replace(/[^\d+]/g, ''));
      Dados.limpar('pend'); App.rerender();
    } catch (e) { carregando(el, false); toast(e.message, 'err'); }
  },
  async verRegistro(el) {
    Sheet.open('<h3>Registro da recusa</h3><div id="regBox"><div class="skel" style="height:120px"></div></div>');
    try {
      const r = await Api.run('registro', { escolaId: el.dataset.id });
      encher('#regBox', '<p><b>' + esc(r.motivo) + '</b><br><span class="muted small">' + dataBR(r.em, true) + ' · ' + hora(r.em) + (r.por ? ' · ' + esc(r.por) : '') + '</span></p>' +
        (r.quem ? '<div class="kh">Quem recusou</div><p style="margin:4px 0 12px">' + esc(r.quem) + '</p>' : '') + (r.descricao ? '<div class="kh">Relato</div><p style="margin:4px 0 12px">' + esc(r.descricao) + '</p>' : '') +
        (r.foto ? '<img src="' + r.foto + '" style="width:100%;border-radius:12px" alt="Registro">' : ''));
    } catch (e) { encher('#regBox', '<p class="muted">' + esc(e.message) + '</p>'); }
  },
  async retomar(el) {
    const id = el.dataset.id, e = App.escola(id);
    if (!e) return;
    if (App.V && App.V.status === 'em_andamento') { toast('Finalize ou cancele a vistoria em andamento antes.', 'warn'); return; }
    carregando(el, true, 'Carregando');
    let base = null;
    try { base = await Api.run('retomarDados', { escolaId: id }); } catch (x) { carregando(el, false); toast(x.net ? 'Retomar precisa de internet para trazer os dados anteriores.' : x.message, 'err', 4000); return; }
    carregando(el, false);
    Sheet.close(true);
    const pos = await Geo.get(6000);
    if (!(await confirmar({ titulo: 'Retomar ' + e.nome + '?', texto: base ? 'Os dados e fotos da visita anterior (' + esc(base.codigo) + ') serão carregados. Você completa só o que faltou; será criada uma nova versão.' : 'Não há visita anterior; será iniciada uma vistoria nova.', sim: 'Retomar' }))) return;
    iniciarVistoria(e, pos, base);
  },
  async reabrir(el) {
    Sheet.open('<h3>Reabrir para retorno</h3><p class="muted small">A escola volta para o roteiro como retorno. A versão atual fica guardada no histórico.</p><span class="lbl">Motivo</span><input class="inp" id="rbMot" placeholder="Ex.: medir o QDC do bloco B"><button class="btn btn-navy mt" id="rbOk">Reabrir</button>', { focus: true });
    $('#rbOk').onclick = async () => {
      carregando($('#rbOk'), true);
      try { await Api.run('reabrir', { vistoriaId: el.dataset.id, motivo: $('#rbMot').value }); Sheet.close(true); toast('Escola marcada para retorno', 'ok'); Dados.mem = {}; App.refresh(); App.rerender(); }
      catch (e) { carregando($('#rbOk'), false); toast(e.message, 'err'); }
    };
  },
  enviarCopiaDe(el) {
    App.route.params.vistoriaId = el.dataset.id; App.route.params.email = el.dataset.email;
    Act.enviarCopia();
  },
  async validar(el) {
    const d = el.dataset.d;
    let nota = '';
    if (d === 'correcao') {
      Sheet.open('<h3>Pedir correção</h3><p class="muted small">A equipe recebe a pendência e a escola volta ao roteiro como retorno.</p><textarea class="inp" id="vlNota" placeholder="O que precisa ser corrigido?"></textarea><button class="btn btn-red mt" id="vlOk">Enviar pedido</button>', { focus: true });
      $('#vlOk').onclick = async () => { nota = $('#vlNota').value; if (!nota) { toast('Descreva a correção.', 'warn'); return; } Sheet.close(true); await Act._validar(el.dataset.id, d, nota); };
      return;
    }
    await Act._validar(el.dataset.id, d, '');
  },
  async _validar(id, d, nota) {
    try { await Api.run('validar', { vistoriaId: id, decisao: d, nota: nota }); toast(d === 'aprovada' ? 'Vistoria aprovada' : 'Correção solicitada', 'ok'); Dados.mem = {}; App.rerender(); }
    catch (e) { toast(e.message, 'err'); }
  }
});
/* ═════════════ Equipe em várias escolas e dois técnicos na mesma escola ═════════════ */
const Equipe = {
  /** Vistorias abertas da equipe em que este técnico não está. */
  outras() {
    const D = App.data || {}, V = App.V;
    return (D.emAndamento || []).filter(x => !V || (x.id !== V.id && x.escolaId !== V.escolaId));
  },
  naEscola(escolaId) { return ((App.data || {}).emAndamento || []).find(x => x.escolaId === escolaId && (!App.V || x.id !== App.V.id)); },
  cartoes() {
    const l = Equipe.outras();
    if (!l.length) return '';
    return '<section class="card" style="border-left:6px solid var(--c-and)"><div class="kh">Sua equipe também está em</div>' + l.map(x => {
      const e = App.escola(x.escolaId) || {};
      return '<div class="doc-row"><span style="min-width:0"><b>' + esc(e.nome || x.codigo) + '</b><small>' + esc((x.participantes || []).join(' e ') || 'sem técnico no momento') + ' · desde ' + hora(x.checkin) + '</small></span>' +
        (App.V ? '' : '<button class="btn btn-out-teal btn-sm" style="margin-left:auto;width:auto" data-act="entrarVistoria" data-id="' + x.id + '">Entrar</button>') + '</div>';
    }).join('') + (App.V ? '' : '<p class="muted small" style="margin:8px 0 0">Entre para ajudar o colega na mesma escola. Cada um pode preencher etapas e ambientes diferentes, ao mesmo tempo.</p>') + '</section>';
  }
};

Views.home = (orig => function (p) {
  const out = orig(p);
  if (!App.data || !out.body) return out;
  const V = App.V && App.V.status === 'em_andamento' ? App.V : null;
  if (V && (V.participantes || []).length > 1) out.body = out.body.replace('<div class="counts">', '<div class="small" style="margin-top:6px;color:var(--teal-d);font-weight:700">' + I('users', 15) + ' Junto com ' + esc(V.participantes.filter(n => n !== ((App.data.usuario || {}).nome)).join(' e ')) + '</div><div class="counts">');
  out.body = out.body.replace('<div class="stats">', Equipe.cartoes() + '<div class="stats">');
  return out;
})(Views.home);

Views.etapa = (orig => Object.assign(function (p) {
  const out = orig(p);
  if (App.V && out.body) out.body += '<button class="btn mt" style="color:var(--muted);font-weight:600" data-act="sairVistoria">' + I('logout', 18) + ' Sair desta vistoria (continua aberta para a equipe)</button>';
  return out;
}, { onBack: orig.onBack }))(Views.etapa);

Object.assign(Act, {
  async checkinEscola(el) {
    if (el && el.dataset && el.dataset.retomar) return Act.retomar(el);
    const id = el.dataset.id;
    const e = App.escola(id);
    if (!e) return;
    const V = App.V && App.V.status === 'em_andamento' ? App.V : null;
    if (V && V.escolaId === id) return Act.continuar();
    if (V) {
      if (!(await confirmar({ titulo: 'Você está em ' + curto(V.d.dados.nome), texto: 'Para ir a outra escola, saia desta vistoria. Ela continua aberta para a equipe e nada do que você fez se perde.', sim: 'Sair e continuar' }))) return;
      await Act._sair();
    }
    Sheet.close(true);
    // Colega já está nesta escola? Entra na mesma vistoria.
    const ja = Equipe.naEscola(id);
    if (ja && navigator.onLine !== false) {
      if (await confirmar({ titulo: 'Sua equipe já está aqui', texto: esc((ja.participantes || []).join(' e ') || 'Um colega') + ' abriu a vistoria às ' + hora(ja.checkin) + '. Entrar na mesma vistoria para trabalharem juntos?', sim: 'Entrar' })) return Act.entrarVistoria({ dataset: { id: ja.id } });
      return;
    }
    const btn = el.tagName ? el : $('[data-act=checkin]');
    carregando(btn, true, 'Localizando');
    const pos = await Geo.get(7000);
    carregando(btn, false);
    const raio = ((App.data || {}).cfg || {}).raioCheckin || 400;
    if (pos && e.lat && e.lng) {
      const dist = Geo.dist(pos.lat, pos.lng, Number(e.lat), Number(e.lng));
      if (dist > raio && !(await confirmar({ titulo: 'Você está longe da escola', texto: 'O GPS indica <b>' + (dist > 1000 ? fmt(dist / 1000, 1) + ' km' : Math.round(dist) + ' m') + '</b> de distância da ' + esc(e.nome) + '. Fazer o check-in mesmo assim?', sim: 'Fazer check-in' }))) return;
    } else if (!pos && !(await confirmar({ titulo: 'Localização indisponível', texto: 'Não foi possível confirmar sua posição pelo GPS. Fazer o check-in mesmo assim?', sim: 'Fazer check-in' }))) return;
    iniciarVistoria(e, pos, null);
  },
  async entrarVistoria(el) {
    if (App.V && App.V.status === 'em_andamento') { toast('Saia da vistoria atual antes.', 'warn'); return; }
    if (el.tagName) carregando(el, true);
    try {
      const r = await Api.run('entrarVistoria', { vistoriaId: el.dataset.id });
      App.V = Vist.doServidor(r);
      Vist.salvar(true);
      vib(20); toast('Você entrou na vistoria · ' + curto((App.escola(r.escolaId) || {}).nome), 'ok');
      App.refresh();
      Router.reset('home'); Router.go('etapa', { k: 'dados' });
    } catch (e) { if (el.tagName) carregando(el, false); toast(e.net ? 'Entrar na vistoria do colega precisa de internet.' : e.message, 'err', 4000); }
  },
  async sairVistoria() {
    if (!(await confirmar({ titulo: 'Sair desta vistoria?', texto: 'Ela continua aberta para a sua equipe. Tudo o que você preencheu é enviado; quem ficar finaliza.', sim: 'Sair' }))) return;
    await Act._sair();
    toast('Você saiu da vistoria', 'ok');
    Router.reset('home');
  },
  async _sair() {
    const V = App.V;
    if (!V) return;
    ETAPAS.forEach(x => Vist.tocar(x.k, true));
    await Sync.add('sairVistoria', { vistoriaId: V.id });
    App.V = null; Vist.salvar(true);
    App.refresh();
  }
});
Views.etapa = (orig => Object.assign(function (p) { const out = orig(p); out.after = null; return out; }, { onBack: orig.onBack }))(Views.etapa);
</script>
