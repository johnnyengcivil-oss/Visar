<script>
'use strict';
/* ═══════════════════════ VistAR · gestão e administração ═══════════════════════
   Menu por perfil (lateral no computador), cadastros de escolas/DREs/empresas,
   equipes, usuários, perfis de acesso, personalização, extração de dados,
   consulta de vistorias e assistente de roteiro. */

const eu = () => ((App.data || {}).usuario || {});
/** Permissão do perfil (servidor antigo sem "perms": deduz pelo papel). */
App.pode = cap => {
  const u = eu();
  if (u.perms) return u.perms.indexOf(cap) >= 0;
  const base = ['campo.vistoriar', 'escolas.ver', 'programacao.ver', 'fotos.ver'];
  return base.indexOf(cap) >= 0 || (u.supervisor && cap !== 'config.editar' && cap !== 'perfis.gerenciar' && cap !== 'empresas.gerenciar');
};
App.escritorio = () => !App.pode('campo.vistoriar') && !App.pode('supervisao.painel');
const opcoes = (lista, sel, vazio) => (vazio !== undefined ? '<option value="">' + esc(vazio) + '</option>' : '') + lista.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(sel) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');
const campo = (id, rot, val, o) => '<div class="fld"><span class="lbl">' + rot + '</span><input class="inp" id="' + id + '" value="' + esc(val === undefined || val === null ? '' : val) + '"' + (o && o.type ? ' type="' + o.type + '"' : '') + (o && o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o && o.im ? ' inputmode="' + o.im + '"' : '') + '></div>';
const valor = id => { const el = $('#' + id); return el ? el.value.trim() : undefined; };

/* ───── Logo personalizável ───── */
function Logo(alto) {
  const l = ((App.data || {}).cfg || (App.boot || {}).cfg || {}).logo;
  return l ? '<img src="' + l + '" alt="Logo" style="height:' + (alto || 42) + 'px;max-width:140px;object-fit:contain">' : LOGO;
}

/* ═════════════ Seções do app conforme o perfil ═════════════ */
const Secoes = {
  /** Abas principais (barra inferior no celular). */
  principais() {
    if (App.supervisor()) return [['home', 'chart', 'Painel'], ['equipesSup', 'users', 'Equipes']].concat(App.pode('vistorias.validar') ? [['validar', 'shield', 'Validar']] : [['escolas', 'school', 'Escolas']]).concat([['pendencias', 'checksq', 'Pendências']]);
    if (App.escritorio()) return [['home', 'chart', 'Painel']].concat(App.verOrcamentos() ? [['orcamentos', 'money', 'Orçamentos']] : []).concat([['consulta', 'file', 'Vistorias']])
      .concat(App.verOrcamentos() ? [] : App.pode('extracao.usar') ? [['extracao', 'download', 'Extração']] : []).concat([['cadastro', 'school', 'Escolas']]);
    return [['home', 'home', 'Início'], ['escolas', 'school', 'Escolas'], ['fotos', 'image', 'Fotos'], ['pendencias', 'checksq', 'Pendências']];
  },
  /** Demais áreas (menu ☰ no celular e menu lateral no computador). */
  extras() {
    const p = App.pode, l = [];
    const add = (cond, r, ic, t, s, g) => { if (cond) l.push([r, ic, t, s, g]); };
    add(p('programacao.ver'), 'programacao', 'calendar', 'Programação', 'Dia, semana e mês', 'Operação');
    add(p('programacao.editar'), 'assistente', 'pin', 'Assistente de roteiro', 'Escolas próximas, ordem e horários', 'Operação');
    add(p('escolas.ver') && App.supervisor(), 'escolas', 'chart', 'Painel do contrato', 'Avanço por DRE e equipe', 'Operação');
    add(App.verOrcamentos(), 'orcamentos', 'money', 'Orçamentos', 'Atribuição, revisões, aprovação e valores', 'Orçamentos');
    add(p('vistorias.consultar'), 'consulta', 'file', 'Consulta de vistorias', 'Relatórios e versões', 'Dados');
    add(p('extracao.usar'), 'extracao', 'download', 'Extração de dados', 'Ambientes, pontos, pré-dimensionamento…', 'Dados');
    add(p('fotos.ver') && (App.supervisor() || App.escritorio()), 'fotos', 'image', 'Fotos', 'Galeria por escola', 'Dados');
    add(p('escolas.ver'), 'cadastro', 'school', 'Cadastros', 'Escolas, DREs' + (p('empresas.gerenciar') ? ' e empresas' : ''), 'Cadastros');
    add(p('equipes.editar'), 'equipesCad', 'users', 'Equipes', 'Membros, base e DREs', 'Cadastros');
    add(p('usuarios.gerenciar'), 'usuarios', 'user', 'Usuários e acessos', 'Cadastro e códigos de acesso', 'Cadastros');
    add(p('perfis.gerenciar'), 'perfis', 'shield', 'Perfis de acesso', 'Funções de cada perfil', 'Administração');
    add(p('config.editar'), 'personalizar', 'settings', 'Personalização', 'Logo, contrato e premissas', 'Administração');
    add(true, 'credencial', 'user', 'Credencial', 'Crachá, supervisor e DREs', 'Conta');
    add(true, 'configuracoes', 'settings', 'Configurações', 'Texto, tema, fotos, ajuda', 'Conta');
    add(true, 'falhas', 'alert', 'Itens com erro' + (Sync.nFalhas ? ' · ' + Sync.nFalhas : ''), 'Envios recusados', 'Conta');
    const principais = this.principais().map(x => x[0]);
    return l.filter(x => principais.indexOf(x[0]) < 0);
  }
};

Views.nav = function (sel) {
  const prin = Secoes.principais(), extras = Secoes.extras();
  const n = (App._sup || {}).aValidar || 0, pend = !App.supervisor() && !App.escritorio() ? Views.listaPendencias().length : 0;
  const u = eu();
  const botao = (x, extra) => '<button class="' + (sel === x[0] ? 'on' : '') + (extra ? ' lado-extra' : '') + '" data-act="' + (extra ? 'menuIr' : 'tab') + '" data-to="' + x[0] + '">' + I(x[1], 26, 1.8) + x[2] +
    (x[0] === 'validar' && n ? '<span class="dot">' + n + '</span>' : '') + (x[0] === 'pendencias' && pend ? '<span class="dot">' + pend + '</span>' : '') + '</button>';
  let grupo = '';
  return '<nav class="nav"><div class="nav-in">' +
    '<div class="lado-marca so-pc"><span class="logo">Vist<b>AR</b></span></div>' +
    prin.map(x => botao(x)).join('') +
    extras.map(x => (x[4] !== grupo ? '<span class="lado-grupo so-pc">' + esc(grupo = x[4]) + '</span>' : '') + botao(x, true)).join('') +
    (u.supervisor ? '<button class="lado-extra" data-act="modo">' + I('swap', 22) + (App.supervisor() ? 'Modo campo' : 'Voltar à supervisão') + '</button>' : '') +
    '<button class="lado-extra" data-act="sair">' + I('logout', 22) + 'Sair</button></div></nav>';
};

Views.menu = () => {
  const u = eu();
  const it = (act, ic, t, s, extra) => '<button class="opt" data-act="' + act + '"' + (extra || '') + '><span class="ic">' + I(ic, 20) + '</span><span>' + t + (s ? '<small>' + s + '</small>' : '') + '</span></button>';
  Sheet.open('<div class="row" style="margin-bottom:6px"><span class="avatar">' + esc(u.iniciais || '') + '</span><span><b>' + esc(u.nome || '') + '</b><div class="muted small">' + esc([u.perfilNome || u.cargo, u.empresaNome].filter(Boolean).join(' · ')) + '</div></span></div>' +
    (u.supervisor ? it('modo', 'swap', App.supervisor() ? 'Ir para o modo campo' : 'Voltar à supervisão', App.supervisor() ? 'Fazer vistorias com sua equipe' : 'Painel, equipes e validação') : '') +
    Secoes.extras().map(x => it('menuIr', x[1], x[2], x[3], ' data-to="' + x[0] + '"')).join('') + it('sair', 'logout', 'Sair da conta', ''));
};

/* Início do escritório (Orçamentos): o painel do contrato. */
Views.home = (orig => function (p) {
  if (App.data && App.escritorio()) { const v = Views.escolas(); v.nav = 'home'; return v; }
  return orig(p);
})(Views.home);

/* ═════════════ Cadastros: escolas, DREs e empresas ═════════════ */
const SIT_ROT = { concluida: ['b-green', 'Concluída'], andamento: ['b-blue', 'Em andamento'], agendada: ['b-amber', 'Agendada'], retorno: ['b-red', 'Retorno'], nao_iniciada: ['b-gray', 'Não iniciada'] };
Views.cadastro = () => {
  const st = App._cad = App._cad || { aba: 'escolas', busca: '', dre: '', sit: '', ativas: 'sim' };
  const abas = [['escolas', 'Escolas'], ['dres', 'DREs']].concat(App.pode('empresas.gerenciar') ? [['empresas', 'Empresas']] : []);
  return {
    header: Views.hdrNavy('Cadastros', st.aba === 'escolas' ? 'Escolas' : st.aba === 'dres' ? 'DREs' : 'Empresas do consórcio'),
    body: '<div class="segbar full">' + abas.map(a => '<button class="' + (st.aba === a[0] ? 'on' : '') + '" data-act="cadAba" data-v="' + a[0] + '">' + a[1] + '</button>').join('') + '</div><div id="cadBox" class="full">' + SKEL + '</div>',
    nav: App.escritorio() ? 'cadastro' : null,
    after() {
      if (st.aba === 'empresas') return Dados.obter('empresas', 'empresas', {}, (r, c, e) => encher('#cadBox', r ? Views.empresasHtml(r) : erroBox(e)), { semLS: true });
      Dados.obter('cadastro', 'cadastroEscolas', {}, (r, c, e) => { App._cadDados = r; if (!r) return encher('#cadBox', erroBox(e)); Views.cadRender(); }, { semLS: true });
    }
  };
};
Views.cadRender = () => {
  const r = App._cadDados, st = App._cad;
  if (!r || !$('#cadBox')) return;
  if (st.aba === 'dres') {
    encher('#cadBox', (r.podeDres ? '<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-navy btn-sm" data-act="dreForm">' + I('plus', 18) + ' Nova DRE</button></div>' : '') +
      '<div class="grade">' + r.dres.map(d => '<section class="card"><div class="card-h"><h3>' + esc(d.nome || d.id) + '</h3>' + (d.sigla ? '<span class="badge b-gray">' + esc(d.sigla) + '</span>' : '') + '</div>' +
        '<div class="muted small">' + esc(d.empresa || 'Sem empresa vinculada') + ' · ' + plural(r.escolas.filter(e => e.dre === d.id).length, 'escola') + '</div>' +
        (d.engenheiroNome ? '<div class="doc-row"><span><b>' + esc(d.engenheiroNome) + '</b><small>' + esc([d.engenheiroCargo, d.engenheiroTel, d.engenheiroEmail].filter(Boolean).join(' · ')) + '</small></span></div>' : '') +
        (r.podeDres ? '<button class="btn btn-out btn-sm mt" style="width:100%" data-act="dreForm" data-id="' + esc(d.id) + '">' + I('edit', 16) + ' Editar</button>' : '') + '</section>').join('') + '</div>');
    return;
  }
  const q = norm(st.busca);
  const l = r.escolas.filter(e => (!st.dre || e.dre === st.dre) && (!st.sit || e.situacao === st.sit) && (st.ativas === 'todas' || (st.ativas === 'sim') === e.ativo) &&
    (!q || norm([e.nome, e.cie, e.bairro, e.logradouro, e.distrito].join(' ')).indexOf(q) >= 0));
  const sit = e => { const s = SIT_ROT[e.situacao] || SIT_ROT.nao_iniciada; return '<span class="badge ' + s[0] + '">' + s[1] + '</span>'; };
  encher('#cadBox',
    '<div class="search">' + I('search', 20) + '<input class="inp" id="cadBusca" placeholder="Buscar por nome, código, bairro…" value="' + esc(st.busca) + '"></div>' +
    '<div class="fchips">' + [['', 'Todas as DREs']].concat(r.dres.map(d => [d.id, d.id])).map(x => '<button class="chip dark' + (st.dre === x[0] ? ' on' : '') + '" data-act="cadSet" data-k="dre" data-v="' + esc(x[0]) + '">' + esc(x[1]) + '</button>').join('') + '</div>' +
    '<div class="fchips">' + [['', 'Qualquer situação']].concat(Object.keys(SIT_ROT).map(k => [k, SIT_ROT[k][1]])).map(x => '<button class="chip' + (st.sit === x[0] ? ' on' : '') + '" data-act="cadSet" data-k="sit" data-v="' + x[0] + '">' + x[1] + '</button>').join('') +
      (r.podeEditar ? [['sim', 'Ativas'], ['nao', 'Inativas'], ['todas', 'Ativas e inativas']].map(x => '<button class="chip' + (st.ativas === x[0] ? ' on' : '') + '" data-act="cadSet" data-k="ativas" data-v="' + x[0] + '">' + x[1] + '</button>').join('') : '') + '</div>' +
    '<div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px"><b>' + plural(l.length, 'escola') + '</b><span class="row" style="gap:8px">' +
      (r.podeEditar ? '<button class="btn btn-out btn-sm" data-act="importar">' + I('download', 18) + ' Importar planilha</button><button class="btn btn-navy btn-sm" data-act="escolaForm">' + I('plus', 18) + ' Nova escola</button>' : '') + '</span></div>' +
    '<div class="tabela-wrap so-pc"><table class="tabela"><tr><th>Escola</th><th>Código</th><th>DRE</th><th>Endereço</th><th class="n">Ambientes</th><th class="n">Temp. máx.</th><th>Situação</th><th></th></tr>' +
      l.slice(0, 400).map(e => '<tr class="' + (e.ativo ? '' : 'inativa') + '"><td><b>' + esc(e.nome) + '</b>' + (e.ativo ? '' : '<br><span class="small c-red">Inativa' + (e.motivoInativacao ? ' · ' + esc(e.motivoInativacao) : '') + '</span>') + '</td><td>' + esc(e.cie || '') + '</td><td>' + esc(e.dre) + '</td>' +
        '<td>' + esc([e.logradouro, e.numero].filter(Boolean).join(', ')) + '<br><span class="muted small">' + esc(e.bairro || '') + '</span></td><td class="n">' + esc(e.ambientesPrevistos || '') + '</td><td class="n">' + (e.tempMax ? fmt(e.tempMax, 1) + '°' : '') + '</td><td>' + sit(e) + '</td>' +
        '<td style="white-space:nowrap"><button class="btn btn-out btn-sm" data-act="escolaAbrir" data-id="' + esc(e.id) + '">Ver</button> ' + (r.podeEditar ? '<button class="btn btn-out btn-sm" data-act="escolaForm" data-id="' + esc(e.id) + '">Editar</button>' : '') + '</td></tr>').join('') +
    '</table></div>' +
    '<div class="so-cel">' + l.slice(0, 200).map(e => '<button class="sch" data-act="' + (r.podeEditar ? 'escolaForm' : 'escolaAbrir') + '" data-id="' + esc(e.id) + '"' + (e.ativo ? '' : ' style="opacity:.6"') + '><span style="flex:1;min-width:0"><h4>' + esc(e.nome) + '</h4>' +
      '<div class="ad">' + esc([e.cie, e.dre, e.bairro].filter(Boolean).join(' · ')) + '</div><div class="tags">' + sit(e) + (e.ativo ? '' : '<span class="badge b-red">Inativa</span>') + (e.tempMax ? '<span class="tag b-gray">' + fmt(e.tempMax, 1) + '°C</span>' : '') + '</div></span><span class="chev">' + I('right') + '</span></button>').join('') + '</div>' +
    (l.length > 400 ? '<p class="muted small">Mostrando as primeiras 400. Refine a busca.</p>' : ''));
  const b = $('#cadBusca');
  if (b) b.oninput = () => { st.busca = b.value; clearTimeout(b._t); b._t = setTimeout(() => { const p = b.selectionStart; Views.cadRender(); const n = $('#cadBusca'); n.focus(); n.setSelectionRange(p, p); }, 200); };
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

Views.escolaForm = e => {
  const r = App._cadDados;
  e = e || { ativo: true };
  Sheet.open('<h3>' + (e.id ? 'Editar escola' : 'Nova escola') + '</h3>' +
    campo('esNome', 'Nome', e.nome, { ph: 'EMEF …' }) +
    F.row(campo('esCie', 'Código EOL/CIE', e.cie, { im: 'numeric' }), campo('esInep', 'Código INEP', e.inep, { im: 'numeric' })) +
    '<div class="grid2" style="align-items:end"><div class="fld"><span class="lbl">DRE</span><select class="inp" id="esDre">' + opcoes(r.dres.map(d => [d.id, d.nome || d.id]), e.dre, 'Escolha') + '</select></div>' + campo('esTipo', 'Tipo', e.tipoUnidade || 'EMEF') + '</div>' +
    campo('esLog', 'Logradouro', e.logradouro) + F.row(campo('esNum', 'Número', e.numero), campo('esCep', 'CEP', e.cep)) +
    F.row(campo('esBairro', 'Bairro', e.bairro), campo('esDistrito', 'Distrito', e.distrito)) +
    '<div class="grid3" style="align-items:end">' + campo('esLat', 'Latitude', e.lat, { im: 'decimal' }) + campo('esLng', 'Longitude', e.lng, { im: 'decimal' }) + '<button class="btn btn-out btn-sm" style="margin-bottom:2px" data-act="geocod">' + I('pin', 16) + ' Pelo endereço</button></div>' +
    F.row(campo('esDiretor', 'Diretor(a)', e.diretor), campo('esTel', 'Telefone', e.telefone, { type: 'tel' })) +
    F.row(campo('esEmail', 'E-mail', e.email, { type: 'email' }), campo('esAmb', 'Ambientes previstos', e.ambientesPrevistos, { im: 'numeric' })) +
    '<div class="fld"><span class="lbl">Observações</span><textarea class="inp" id="esObs">' + esc(e.obs || '') + '</textarea></div>' +
    '<button class="btn btn-navy mt" id="esOk">Salvar escola</button>' +
    (e.id ? '<button class="btn mt ' + (e.ativo ? 'btn-out-red' : 'btn-out-teal') + '" id="esAtiva">' + (e.ativo ? 'Inativar (tirar da lista de vistorias)' : 'Reativar escola') + '</button><button class="btn btn-out mt" data-act="escolaAbrir" data-id="' + esc(e.id) + '">Ver ficha da escola</button>' : ''));
  Act._escolaEd = e;
  $('#esOk').onclick = async () => {
    carregando($('#esOk'), true);
    try {
      await Api.run('salvarEscola', { escola: { id: e.id || '', nome: valor('esNome'), cie: valor('esCie'), inep: valor('esInep'), dre: valor('esDre'), tipoUnidade: valor('esTipo'), logradouro: valor('esLog'),
        numero: valor('esNum'), cep: valor('esCep'), bairro: valor('esBairro'), distrito: valor('esDistrito'), lat: valor('esLat'), lng: valor('esLng'), diretor: valor('esDiretor'),
        telefone: valor('esTel'), email: valor('esEmail'), ambientesPrevistos: valor('esAmb'), obs: valor('esObs') } });
      Sheet.close(true); toast('Escola salva', 'ok'); Dados.limpar('cadastro'); App.refresh(); App.rerender();
    } catch (x) { carregando($('#esOk'), false); toast(x.message, 'err', 4000); }
  };
  if ($('#esAtiva')) $('#esAtiva').onclick = () => {
    const enviar = async motivo => {
      try { await Api.run('ativarEscola', { id: e.id, ativo: !e.ativo, motivo: motivo }); Sheet.close(true); toast(e.ativo ? 'Escola inativada' : 'Escola reativada', 'ok'); Dados.limpar('cadastro'); App.refresh(); App.rerender(); }
      catch (x) { toast(x.message, 'err', 4000); }
    };
    if (!e.ativo) return enviar('');
    Sheet.open('<h3>Inativar ' + esc(e.nome) + '?</h3><p class="muted small">Ela sai da lista de vistorias, do roteiro e do painel. As vistorias já feitas continuam guardadas, e dá para reativar depois.</p>' +
      campo('esMotivo', 'Motivo', '', { ph: 'Ex.: fora do escopo do contrato, unidade fechada' }) + '<button class="btn btn-red mt" id="esInOk">Inativar escola</button>');
    $('#esInOk').onclick = () => enviar(valor('esMotivo'));
  };
};

Views.dreForm = d => {
  const r = App._cadDados || {};
  d = d || {};
  Sheet.open('<h3>' + (d.id ? 'Editar DRE' : 'Nova DRE') + '</h3>' +
    (d.id ? '<p class="muted small">Identificador: <b>' + esc(d.id) + '</b></p>' : campo('drId', 'Nome curto (identificador)', '', { ph: 'Ex.: Butantã' })) +
    F.row(campo('drNome', 'Nome completo', d.nome, { ph: 'DRE Butantã' }), campo('drSigla', 'Sigla', d.sigla, { ph: 'BT' })) +
    '<div class="fld"><span class="lbl">Empresa do consórcio responsável</span><select class="inp" id="drEmp">' + opcoes((r.empresas || []).map(x => [x.id, x.nome]), d.empresaId, 'Sem empresa') + '</select></div>' +
    F.row(campo('drEng', 'Engenheiro(a) da DRE', d.engenheiroNome), campo('drTel', 'Telefone', d.engenheiroTel, { type: 'tel' })) +
    campo('drMail', 'E-mail (recebe as cobranças)', d.engenheiroEmail, { type: 'email' }) +
    '<button class="btn btn-navy mt" id="drOk">Salvar DRE</button>');
  $('#drOk').onclick = async () => {
    try {
      await Api.run('salvarDre', { dre: { id: d.id || '', nomeCurto: valor('drId'), nome: valor('drNome'), sigla: valor('drSigla'), empresaId: valor('drEmp'), engenheiroNome: valor('drEng'),
        engenheiroCargo: d.engenheiroCargo || 'Engenheiro DRE', engenheiroTel: valor('drTel'), engenheiroEmail: valor('drMail') } });
      Sheet.close(true); toast('DRE salva', 'ok'); Dados.limpar('cadastro'); App.refresh(); App.rerender();
    } catch (x) { toast(x.message, 'err', 4000); }
  };
};

Views.empresasHtml = l => '<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="muted small">Cada empresa do consórcio tem suas DREs, seus usuários e uma pasta própria no Drive para fotos, relatórios e extrações.</span>' +
  '<button class="btn btn-navy btn-sm" data-act="empresaForm">' + I('plus', 18) + ' Nova empresa</button></div><div class="grade">' +
  (l.length ? l.map(e => '<section class="card"><div class="card-h"><h3>' + esc(e.nome) + '</h3>' + (e.sigla ? '<span class="badge b-teal">' + esc(e.sigla) + '</span>' : '') + '</div>' +
    '<div class="muted small">' + esc([e.cnpj ? 'CNPJ ' + e.cnpj : '', plural(e.usuarios, 'usuário'), e.emailGestao].filter(Boolean).join(' · ')) + '</div>' +
    '<div class="chips sm mt">' + (e.dres.length ? e.dres.map(d => '<span class="chip">' + esc(d) + '</span>').join('') : '<span class="muted small">Nenhuma DRE vinculada</span>') + '</div>' +
    '<div class="grid3 mt"><button class="btn btn-out btn-sm" style="width:100%" data-act="empresaForm" data-id="' + e.id + '">Editar</button>' +
    (e.pastaUrl ? '<button class="btn btn-out btn-sm" style="width:100%" data-act="abrirUrl" data-url="' + esc(e.pastaUrl) + '">Pasta</button>' : '<span></span>') +

/* ───── Importar planilha (Excel ou CSV) ───── */
const COLUNAS_IMPORT = {
  nome: ['nome', 'nome da unidade', 'unidade', 'escola', 'nome da escola'], cie: ['cie', 'cod. eol', 'cód. eol', 'codigo eol', 'código eol', 'eol', 'codigo', 'código', 'cod', 'código cie'],
  inep: ['inep', 'cod. inep', 'cód. inep'], tipoUnidade: ['tipo'], dre: ['dre', 'diretoria regional', 'diretoria'], logradouro: ['logradouro', 'endereco', 'endereço', 'rua'],
  numero: ['nº', 'n°', 'numero', 'número', 'num'], bairro: ['bairro'], cep: ['cep'], distrito: ['distrito'], subprefeitura: ['subprefeitura'], telefone: ['telefone', 'telefone 1', 'fone'],
  telefone2: ['telefone 2'], email: ['email', 'e-mail'], diretor: ['diretor', 'diretor(a)', 'diretora'], lat: ['latitude', 'lat'], lng: ['longitude', 'lng', 'long'],
  ambientesPrevistos: ['total de ambientes (qtd)', 'ambientes', 'total ambientes', 'ambientes previstos'], areaAmbientes: ['área total ambientes (m²)', 'area total ambientes (m2)', 'área total (m²)'],
  salas: ['salas de aula (qtd)', 'salas de aula'], areaSalas: ['área salas de aula (m²)'], tempMax: ['temp. máx. média 2016-2021 (°c)', 'temperatura', 'temp. máx. média (°c)'],
  ordemSme: ['ordem na lista sme', 'ordem', 'prioridade'], obsSme: ['observação sme', 'observação', 'observacao'], notas: ['notas'], padraoConstrutivo: ['padrão construtivo']
};
function mapearLinha(cab, linha) {
  const o = {};
  cab.forEach((c, i) => {
    const n = norm(c).trim();
    Object.keys(COLUNAS_IMPORT).forEach(k => { if (o[k] === undefined && COLUNAS_IMPORT[k].some(x => norm(x) === n)) o[k] = linha[i] === null || linha[i] === undefined ? '' : linha[i]; });
  });
  if (o.cie !== undefined) o.cie = String(o.cie).replace(/\.0$/, '');
  if (o.nome && o.tipoUnidade && norm(o.nome).indexOf(norm(o.tipoUnidade)) !== 0) o.nome = o.tipoUnidade + ' ' + o.nome;
  return o;
}
function carregarScript(src) {
  return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Não foi possível carregar o leitor de Excel (sem internet?). Salve como CSV e tente de novo.')); document.head.appendChild(s); });
}
Views.importar = () => {
  const r = App._cadDados || {};
  Sheet.open('<h3>Importar escolas de planilha</h3><p class="muted small">Excel (.xlsx) ou CSV. A primeira linha deve ter os nomes das colunas (ex.: DRE, Cód. EOL, Nome da Unidade, Logradouro, Nº, Bairro, CEP, Telefone, Latitude, Longitude). ' +
    'Escolas com o mesmo código são <b>atualizadas</b>; as novas são criadas. DREs que ainda não existem são criadas.</p>' +
    ((r.empresas || []).length ? '<span class="lbl">Empresa para as DREs novas</span><select class="inp" id="imEmp">' + opcoes(r.empresas.map(x => [x.id, x.nome]), '', 'Nenhuma (vincular depois)') + '</select>' : '') +
    '<label class="btn btn-out-teal mt" style="cursor:pointer">' + I('download', 18) + ' Escolher arquivo<input type="file" id="imArq" accept=".xlsx,.xls,.csv,.txt" class="hidden"></label><div id="imPrev" class="mt"></div>');
  $('#imArq').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    encher('#imPrev', '<div class="skel" style="height:80px"></div>');
    try {
      let linhas;
      if (/\.(xlsx|xls)$/i.test(f.name)) {
        await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        // Usa a aba que tiver mais linhas com "nome"/"unidade" no cabeçalho.
        const abas = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' })).filter(a => a.length);
        const pontua = a => { const i = a.findIndex(l => l.some(c => /nome|unidade|escola/i.test(String(c)))); return i < 0 ? -1 : a.length - i; };
        linhas = abas.sort((a, b) => pontua(b) - pontua(a))[0] || [];
      } else {
        const txt = await f.text();
        const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : txt.indexOf('\t') >= 0 ? '\t' : ',';
        linhas = txt.split(/\r?\n/).filter(String).map(l => l.split(sep).map(c => c.replace(/^"|"$/g, '')));
      }
      const iCab = linhas.findIndex(l => l.some(c => /nome|unidade|escola/i.test(String(c))));
      if (iCab < 0) throw new Error('Não encontrei a linha de cabeçalho (com "Nome" ou "Unidade").');
      const cab = linhas[iCab];
      const dados = linhas.slice(iCab + 1).map(l => mapearLinha(cab, l)).filter(o => o.nome);
      const reconhecidas = Object.keys(COLUNAS_IMPORT).filter(k => cab.some(c => COLUNAS_IMPORT[k].some(x => norm(x) === norm(c).trim())));
      App._import = dados;
      encher('#imPrev', '<div class="warn-box" style="margin:0;background:var(--teal-l);color:var(--teal-d)"><b>' + plural(dados.length, 'escola encontrada', 'escolas encontradas') + '</b> · colunas reconhecidas: ' + esc(reconhecidas.join(', ')) + '</div>' +
        '<div class="tabela-wrap mt" style="max-height:220px;overflow:auto"><table class="tabela"><tr><th>Nome</th><th>Código</th><th>DRE</th><th>Bairro</th></tr>' + dados.slice(0, 8).map(o => '<tr><td>' + esc(o.nome) + '</td><td>' + esc(o.cie || '') + '</td><td>' + esc(o.dre || '') + '</td><td>' + esc(o.bairro || '') + '</td></tr>').join('') + '</table></div>' +
        '<button class="btn btn-navy mt" id="imOk">Importar ' + dados.length + ' escolas</button>');
      $('#imOk').onclick = async () => {
        const b = $('#imOk'); carregando(b, true, 'Importando');
        const tot = { criadas: 0, atualizadas: 0, dresCriadas: 0, erros: [] };
        try {
          for (let i = 0; i < dados.length; i += 150) {
            const r2 = await Api.run('importarEscolas', { linhas: dados.slice(i, i + 150), empresaId: $('#imEmp') ? $('#imEmp').value : '' });
            ['criadas', 'atualizadas', 'dresCriadas'].forEach(k => { tot[k] += r2[k]; }); tot.erros = tot.erros.concat(r2.erros);
            b.innerHTML = '<span class="spin"></span>' + Math.min(i + 150, dados.length) + ' de ' + dados.length;
          }
          encher('#imPrev', '<div class="warn-box" style="margin:0;background:var(--green-l);color:var(--green)"><b>Importação concluída:</b> ' + tot.criadas + ' novas, ' + tot.atualizadas + ' atualizadas, ' + tot.dresCriadas + ' DREs criadas.</div>' +
            (tot.erros.length ? '<div class="warn-box">' + esc(tot.erros.slice(0, 15).join(' · ')) + (tot.erros.length > 15 ? '…' : '') + '</div>' : ''));
          Dados.limpar('cadastro'); App.refresh(); setTimeout(() => App.rerender(), 300);
        } catch (x) { carregando(b, false); toast(x.message, 'err', 5000); }
      };
    } catch (x) { encher('#imPrev', '<div class="warn-box" style="margin:0;background:var(--red-l);color:var(--red)">' + esc(x.message) + '</div>'); }
  };
};

/* ═════════════ Assistente de roteiro ═════════════ */
const kmEntre = (a, b) => a && b && a.lat && b.lat ? Geo.dist(a.lat, a.lng, b.lat, b.lng) / 1000 * 1.3 : 0;
const Roteiro = {
  /** Duração estimada da vistoria: 60 min + 4 min por ambiente previsto (máx. 5 h). */
  duracao: e => Math.min(300, Math.max(90, Math.round((60 + 4 * (Number(e.ambientes) || 15)) / 15) * 15)),
  minutosViagem: km => Math.max(5, Math.round(km / 22 * 60)),
  /** Vizinho mais próximo a partir do ponto de partida. */
  ordenar(lista, inicio) {
    const resto = lista.slice(), out = [];
    let atual = inicio || resto[0];
    while (resto.length) {
      resto.sort((a, b) => kmEntre(atual, a) - kmEntre(atual, b));
      atual = resto.shift(); out.push(atual);
    }
    return out;
  },
  /** Horários com deslocamento e almoço (12h–13h). */
  horarios(lista, inicioHHMM, partida) {
    let t = minutos(inicioHHMM) || 510, ant = partida;
    return lista.map((e, i) => {
      const km = kmEntre(ant, e), viagem = i || partida ? Roteiro.minutosViagem(km) : 0;
      t += viagem;
      if (t > 690 && t < 780) t = 780;
      const ini = t, fim = t + Roteiro.duracao(e);
      t = fim; ant = e;
      return { e: e, km: km, viagem: viagem, ini: hm(ini), fim: hm(fim) };
    });
  }
};

  const ultimo = A.sel.length ? r.escolas.find(e => e.id === A.sel[A.sel.length - 1]) : ref;
  cand.forEach(e => { e._km = kmEntre(ultimo, e); });
  cand.sort((a, b) => A.ordem === 'prioridade' ? (a.ordemSme || 999) - (b.ordemSme || 999) : A.ordem === 'calor' ? (b.tempMax || 0) - (a.tempMax || 0) : (a._km || 9e9) - (b._km || 9e9));
  const sel = A.sel.map(id => r.escolas.find(e => e.id === id)).filter(Boolean);
  const porDia = Math.max(1, Number(A.porDia) || 2);

  A.dias = diasCom;

/** Mapa esquemático: pontos numerados, trajeto e candidatos próximos em cinza. */
Views.asMapa = (sel, partida, cand) => {
  const todos = sel.concat(cand).concat(partida ? [partida] : []).filter(e => e.lat);
  if (!todos.length) return Views.mapaIlustrativo();
  const la = todos.map(e => e.lat), ln = todos.map(e => e.lng);
  const a0 = Math.min.apply(null, la), a1 = Math.max.apply(null, la), l0 = Math.min.apply(null, ln), l1 = Math.max.apply(null, ln);
  const W = 640, H = 360, pad = 30;
  const sx = Math.max(1e-6, l1 - l0), sy = Math.max(1e-6, a1 - a0);
  const k = Math.min((W - 2 * pad) / sx, (H - 2 * pad) / sy);
  const x = e => pad + (e.lng - l0) * k + ((W - 2 * pad) - sx * k) / 2, y = e => pad + (a1 - e.lat) * k + ((H - 2 * pad) - sy * k) / 2;
  const caminho = (partida ? [partida] : []).concat(sel).filter(e => e.lat);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '"><rect width="' + W + '" height="' + H + '" fill="#E8EEEA"/>' +
    '<g stroke="#fff" stroke-width="8" opacity=".8"><path d="M0 120H640M0 250H640M160 0V360M420 0V360"/></g>' +
    cand.filter(e => e.lat).map(e => '<circle cx="' + x(e) + '" cy="' + y(e) + '" r="6" fill="#94A3B8" stroke="#fff" stroke-width="2"><title>' + esc(e.nome) + '</title></circle>').join('') +
    (caminho.length > 1 ? '<polyline points="' + caminho.map(e => x(e) + ',' + y(e)).join(' ') + '" fill="none" stroke="#1F8F86" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>' : '') +
    (partida && partida.lat ? '<circle cx="' + x(partida) + '" cy="' + y(partida) + '" r="11" fill="#fff" stroke="#0F2140" stroke-width="5"><title>' + esc(partida.nome) + '</title></circle>' : '') +
    sel.filter(e => e.lat).map(e => '<g><circle cx="' + x(e) + '" cy="' + y(e) + '" r="13" fill="#0F2140" stroke="#fff" stroke-width="3"/><text x="' + x(e) + '" y="' + (y(e) + 5) + '" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" font-family="Inter,Arial">' + (sel.indexOf(e) + 1) + '</text><title>' + esc(e.nome) + '</title></g>').join('') + '</svg>';
};
/** Arrastar e soltar (mouse e toque) pela alça ☰. */
Views.asArrastar = () => {
  $$('[data-arrasta]').forEach(h => {
    h.onpointerdown = ev => {
      ev.preventDefault();
      const A = App._as, id = h.dataset.arrasta, item = h.closest('.rot-item');
      item.classList.add('arrastando');
      h.setPointerCapture(ev.pointerId);
      const mover = e2 => {
        const alvo = document.elementFromPoint(e2.clientX, e2.clientY);
        const outro = alvo && alvo.closest && alvo.closest('.rot-item');
        if (outro && outro.dataset.id !== id) {
          const de = A.sel.indexOf(id), para = A.sel.indexOf(outro.dataset.id);
          A.sel.splice(de, 1); A.sel.splice(para, 0, id);
          const r = outro.getBoundingClientRect();
          if (e2.clientY > r.top + r.height / 2) outro.after(item); else outro.before(item);
        }
      };
      const soltar = () => { h.onpointermove = null; h.onpointerup = null; vib(10); Views.asRender(); };
      h.onpointermove = mover; h.onpointerup = soltar; h.onpointercancel = soltar;
    };
  });
};

    l('Salas/labs/recursos (G1)', e.g1Qtd ? e.g1Qtd + ' · ' + fmt(e.g1Area) + ' m²' : '') + l('Biblioteca/auditório (G2)', e.g2Qtd ? e.g2Qtd + ' · ' + fmt(e.g2Area) + ' m²' : '') +
    l('Administrativo (G3)', e.g3Qtd ? e.g3Qtd + ' · ' + fmt(e.g3Area) + ' m²' : '') + l('Código INEP', e.inep) + l('Distrito', e.distrito) + l('Subprefeitura', e.subprefeitura) + '</div>' +
    (e.notas ? '<p class="muted small" style="margin:6px 0 0">' + esc(e.notas) + '</p>' : '') + '</section>';
};
Views.escola = (orig => function (p) {
  const out = orig(p);
  const after = out.after;
  out.body = out.body.replace('id="escBox"', 'id="escBox" class="grade full"');
  out.after = function () {
    after();
    const tenta = () => { const box = $('#escBox'); const r = Dados.mem['esc:' + p.id]; if (box && r && !$('#escSme')) { const c = Views.escolaSme(r.escola); if (c) box.insertAdjacentHTML('beforeend', c.replace('<section class="card">', '<section class="card" id="escSme">')); } };
    setTimeout(tenta, 50); setTimeout(tenta, 1500); setTimeout(tenta, 4000);
  };
  return out;
})(Views.escola);
</script>
