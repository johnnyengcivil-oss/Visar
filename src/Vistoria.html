<script>
'use strict';
/* ═══════════════════════════ VistAR · vistoria ═══════════════════════════ */

const ETAPAS = [
  { k: 'dados', n: 'Dados', t: 'Dados da escola' },
  { k: 'entrada', n: 'Entrada de energia', t: 'Entrada de energia' },
  { k: 'estrutura', n: 'Estrutura', t: 'Estrutura' },
  { k: 'eletrica', n: 'Elétrica', t: 'Elétrica' },
  { k: 'ambientes', n: 'Ambientes', t: 'Ambientes' },
  { k: 'equipamentos', n: 'Outros pontos', t: 'Equipamentos' },
  { k: 'revisao', n: 'Revisão', t: 'Revisão final' }
];
const ETAPA = k => ETAPAS.find(e => e.k === k) || ETAPAS[0];
const ROTULO_ETAPA = { dados: 'Dados', entrada: 'Entrada de energia', estrutura: 'Estrutura', eletrica: 'Elétrica', ambientes: 'Ambientes', equipamentos: 'Equipamentos', revisao: 'Revisão', geral: 'Fotos gerais', doc: 'Documentos', cancelamento: 'Cancelamento' };

const TIPOS_AMB = ['Sala de aula', 'Sala de leitura', 'Biblioteca', 'Sala de informática', 'Laboratório', 'Sala dos professores', 'Secretaria',
  'Diretoria', 'Coordenação', 'Auditório', 'Refeitório', 'Sala multiuso', 'Brinquedoteca', 'Sala de recursos', 'Enfermaria',
  'Corredor', 'Escada', 'Banheiro', 'Depósito', 'Cozinha', 'Vestiário', 'Outro'];
const TIPOS_EXT = ['Pátio coberto', 'Pátio descoberto', 'Quadra coberta', 'Quadra descoberta', 'Estacionamento', 'Playground', 'Entrada', 'Anexo', 'Edícula', 'Horta', 'Outro'];
const SETOR_PARA_EXT = { 'Entrada': 'Entrada', 'Estacionamento': 'Estacionamento', 'Pátio': 'Pátio coberto', 'Quadra coberta': 'Quadra coberta', 'Anexo': 'Anexo', 'Edícula': 'Edícula', 'Playground': 'Playground' };
const TUE_PADRAO = {
  'Sala de aula': ['Computador', 'Projetor', 'Ventilador'], 'Sala de informática': ['Computador', 'Projetor'], 'Sala de leitura': ['Computador', 'Ventilador'],
  'Biblioteca': ['Computador', 'Ventilador'], 'Secretaria': ['Computador', 'Impressora'], 'Diretoria': ['Computador'], 'Sala dos professores': ['Computador', 'Micro-ondas'],
  'Auditório': ['Projetor'], 'Refeitório': ['Ventilador'], 'Cozinha': ['Geladeira', 'Micro-ondas']
};
const BLOCO = i => String.fromCharCode(65 + Number(i || 0));
const PAV = p => Number(p) === 0 ? 'Térreo' : p + 'º';

/* ───── Estado da vistoria ───── */
const Vist = {
  novo(e, pos) {
    return {
      id: uid(), codigo: '', escolaId: e.id, status: 'em_andamento', checkin: new Date().toISOString(), srv: false,
      lat: pos ? pos.lat : '', lng: pos ? pos.lng : '', etapa: 'dados', ts: {}, fotos: {}, ui: { bloco: 0, pav: 0 },
      d: this.padrao(e)
    };
  },
  padrao(e) {
    e = e || {};
    return {
      dados: {
        nome: e.nome || '', cie: e.cie || '', dre: e.dre || '', etapaEnsino: e.etapaEnsino || '', logradouro: e.logradouro || '', numero: e.numero || '',
        cep: e.cep || '', bairro: e.bairro || '', complemento: e.complemento || '', imovel: e.imovel || 'Próprio', idadeAnos: e.idadeAnos || '',
        diretor: e.diretor || '', telefone: e.telefone || '', email: e.email || ''
      },
      entrada: { caboModo: 'diametro', cx1: {}, cx2: {}, cabos: {}, med: {}, cons: {}, consMT: {}, trafo: {} },
      estrutura: { nBlocos: 1, blocos: [{ pav: 1, fachadas: {} }], setores: [], norte: 0, cons: {} },
      eletrica: { blocos: [{ quadros: 1, cons: {} }] },
      ambientes: { itens: [], pavOk: {} },
      equipamentos: {
        itens: [['Bomba de recalque', 1], ['Elevador', 1], ['Plataforma elevatória', 1], ['Exaustor', 1]]
          .map(x => ({ id: uid(), nome: x[0], qtd: x[1], pot: '', un: 'CV', desc: false }))
      },
      revisao: { respNome: e.diretor || '', respCargo: e.diretor ? 'Diretor(a)' : '', respTel: e.telefone || '', respEmail: e.email || '' }
    };
  },
  doServidor(s) {
    const e = App.escola(s.escolaId) || { id: s.escolaId };
    const V = { id: s.id, codigo: s.codigo, escolaId: s.escolaId, status: s.status, checkin: s.checkin, srv: true, etapa: 'dados', ts: {}, fotos: {}, ui: { bloco: 0, pav: 0 }, d: this.padrao(e) };
    Object.keys(s.etapas || {}).forEach(k => { V.d[k] = Object.assign(V.d[k] || {}, s.etapas[k].dados || {}); V.ts[k] = s.etapas[k].ts; });
    (s.fotos || []).forEach(f => { V.fotos[f.id] = Object.assign({}, f, { st: 'ok' }); });
    return V;
  },
  /** Junta o que veio do servidor com o rascunho local (vence o mais recente por etapa). */
  mesclar(s) {
    const L = App.V;
    const pendente = id => Sync.has(i => i.payload && (i.payload.vistoriaId === id || i.payload.id === id));
    if (s) {
      if (!L || L.id !== s.id) {
        if (L && L.status !== 'cancelada' && pendente(L.id)) return;
        App.V = this.doServidor(s);
      } else {
        Object.keys(s.etapas || {}).forEach(k => {
          const lt = L.ts[k];
          const naFila = Sync.has(i => i.key === 'etapa:' + L.id + ':' + k);
          if (!naFila && (!lt || (s.etapas[k].ts && s.etapas[k].ts > lt))) { L.d[k] = Object.assign(L.d[k] || {}, s.etapas[k].dados || {}); L.ts[k] = s.etapas[k].ts; }
        });
        (s.fotos || []).forEach(f => { L.fotos[f.id] = Object.assign(L.fotos[f.id] || {}, f, { st: 'ok' }); });
        L.codigo = s.codigo; L.srv = true;
      }
    } else if (L && L.status === 'em_andamento' && L.srv && !pendente(L.id)) {
      App.V = null; // encerrada em outro aparelho
    }
    this.salvar(true);
  },
  salvar(ja) {
    clearTimeout(this._t);
    const f = () => { if (App.V) LS.set('v', App.V); else LS.del('v'); };
    if (ja) f(); else this._t = setTimeout(f, 250);
  },
  /** Marca a etapa como alterada: salva no aparelho e agenda o envio. */
  tocar(etapa, ja) {
    const V = App.V;
    if (!V || !V.d[etapa]) return;
    V.ts[etapa] = new Date().toISOString();
    this.salvar();
    clearTimeout((this._e = this._e || {})[etapa]);
    const envia = () => Sync.add('salvarEtapa', { vistoriaId: V.id, etapa: etapa, dados: V.d[etapa] }, 'etapa:' + V.id + ':' + etapa);
    if (ja) envia(); else this._e[etapa] = setTimeout(envia, 1800);
  },
  fotosDe(slot) {
    const V = App.V;
    if (!V) return [];
    return Object.values(V.fotos).filter(f => f.slot === slot && !f.del).sort((a, b) => a.criadoEm < b.criadoEm ? -1 : 1);
  },
  contagem() {
    const V = App.V;
    if (!V) return { fotos: 0, ambientes: 0, docs: 0 };
    const fotos = Object.values(V.fotos).filter(f => !f.del);
    return {
      fotos: fotos.length,
      docs: fotos.filter(f => f.etapa === 'doc').length,
      ambientes: (V.d.ambientes.itens || []).reduce((s, a) => s + (Number(a.qtd) || 1), 0)
    };
  }
};

Sync.on('checkin', (r, p) => {
  if (App.V && App.V.id === p.id) { App.V.codigo = r.codigo; App.V.srv = true; Vist.salvar(true); }
});
Sync.on('checkin:erro', (e, p) => {
  if (App.V && App.V.id === p.id) {
    toast('Check-in recusado: ' + e.message, 'err', 7000);
    Sync.q = Sync.q.filter(i => !(i.payload && i.payload.vistoriaId === p.id));
    App.V = null; Vist.salvar(true); Router.reset('home'); App.refresh();
  }
});
Sync.on('uploadFoto', (r, p) => {
  const V = App.V;
  if (V && V.fotos[p.id]) { V.fotos[p.id].fileId = r.fileId; V.fotos[p.id].st = 'ok'; Vist.salvar(); }
  $$('[data-st="' + p.id + '"]').forEach(el => el.classList.add('ok'));
});

/* ───── Fotos de vistoria ───── */
const Fotos = {
  async adicionar(alvo, img) {
    const V = App.V;
    if (!V) return;
    const id = uid();
    const pos = Geo.last;
    const f = { id: id, etapa: alvo.etapa, slot: alvo.slot, ref: alvo.ref || '', criadoEm: new Date().toISOString(), st: 'pend',
      legenda: alvo.rotulo || '', lat: pos ? pos.lat : '', lng: pos ? pos.lng : '' };
    V.fotos[id] = f;
    Thumbs.put(id, img.thumb);
    Vist.salvar(true);
    await Sync.add('uploadFoto', Object.assign({ vistoriaId: V.id, mime: 'image/jpeg', data: img.full, lat: pos ? pos.lat : '', lng: pos ? pos.lng : '' }, f));
    vib(12);
    if (alvo.toast !== false) toast('Foto salva · ' + (alvo.rotulo || ROTULO_ETAPA[alvo.etapa] || ''), 'ok', 1600);
    App.rerender();
  },
  async remover(id) {
    const V = App.V;
    const f = V && V.fotos[id];
    if (!f) return;
    const naFila = Sync.q.find(i => i.acao === 'uploadFoto' && i.payload.id === id && !i.running);
    if (naFila) { Sync.q = Sync.q.filter(i => i !== naFila); await IDB.del('outbox', naFila.id); Sync.render(); }
    else Sync.add('removerFoto', { id: id });
    delete V.fotos[id];
    Thumbs.drop(id);
    Vist.salvar(true);
  },
  /** Abre a câmera para um slot; se já houver foto, abre o visualizador. */
  /** Alvo da câmera: o item tocado + os demais itens do mesmo cartão (atalhos na câmera). */
  alvo(el) {
    const V = App.V;
    const etapa = el.dataset.etapa || el.dataset.slot.split('.')[0];
    const card = el.closest('.card');
    const opcoes = card ? $$('[data-act=foto]:not([data-add])', card).map(b => ({ slot: b.dataset.slot, rot: b.dataset.rot || 'Foto', etapa: b.dataset.etapa || etapa, ref: b.dataset.ref || '' })) : [];
    const bloco = /\.b(\d+)\./.exec(el.dataset.slot);
    const rot = el.dataset.rot || 'Foto';
    return {
      slot: el.dataset.slot, etapa: etapa, ref: el.dataset.ref || '', rotulo: rot, opcoes: opcoes.length > 1 ? opcoes : [],
      escola: V ? V.d.dados.nome : '', sub: (ROTULO_ETAPA[etapa] || '') + ' · ' + rot + (bloco ? ' · Bloco ' + BLOCO(bloco[1]) : ''),
      dica: { eletrica: 'Enquadre o quadro inteiro e a identificação dos circuitos', entrada: 'Enquadre a caixa inteira, o medidor e o disjuntor', dados: 'Fotos padrão, enquadrando o prédio inteiro', estrutura: 'Mostre a cobertura ou a área inteira', ambientes: 'Do canto da sala, mostrando janelas e teto', equipamentos: 'Chapa legível, sem reflexo' }[etapa]
    };
  },
  ver(id, lista) {
    const V = App.V;
    const f = V && V.fotos[id];
    const src = Thumbs.mem.get(id) || (f && f.fileId && Thumbs.mem.get('f:' + f.fileId)) || '';
    const idx = lista ? lista.indexOf(id) : -1;
    $('#layer').innerHTML = '<div class="viewer"><div class="top"><button class="back" data-act="sheetClose">' + I('x') + '</button>' +
      '<span>' + esc(f ? (ROTULO_ETAPA[f.etapa] || '') + ' · ' + hora(f.criadoEm) : '') + (lista && lista.length > 1 ? ' · ' + (idx + 1) + '/' + lista.length : '') + '</span>' +
      '<span class="badge ' + (f && f.st === 'ok' ? 'b-green">Enviada' : 'b-amber">Na fila') + '</span></div>' +
      '<img src="' + src + '" alt="">' +
      '<div class="bar">' + (lista && idx > 0 ? '<button class="btn btn-out btn-sm" style="width:auto" id="vwPrev">' + I('left') + '</button>' : '') +
      '<button class="btn btn-out-red" id="vwDel">' + I('trash', 20) + ' Excluir</button>' +
      '<button class="btn btn-teal" id="vwRep">' + I('camera', 20) + ' Refazer</button>' +
      (lista && idx >= 0 && idx < lista.length - 1 ? '<button class="btn btn-out btn-sm" style="width:auto" id="vwNext">' + I('right') + '</button>' : '') + '</div></div>';
    Sheet.opts = {};
    $('#vwDel').onclick = async () => { await this.remover(id); Sheet.close(true); toast('Foto excluída'); App.rerender(); };
    $('#vwRep').onclick = async () => {
      const alvo = { slot: f.slot, etapa: f.etapa, ref: f.ref, carimbo: curto(V.d.dados.nome) + (V.codigo ? ' · ' + V.codigo : '') };
      Sheet.close(true);
      alvo.onFoto = async img => { await this.remover(id); await this.adicionar(alvo, img); };
      Camera.abrir(alvo);
    };
    if ($('#vwPrev')) $('#vwPrev').onclick = () => this.ver(lista[idx - 1], lista);
    if ($('#vwNext')) $('#vwNext').onclick = () => this.ver(lista[idx + 1], lista);
  }
};

/* ───── Motor de formulário: caminhos "etapa.campo.sub" (ou "@campo" para o formulário aberto) ───── */
const Form = {
  raiz(path) { return path[0] === '@' ? [App, 'form.' + path.slice(1)] : [App.V ? App.V.d : {}, path]; },
  get(path) {
    const r = this.raiz(path);
    return r[1].split('.').reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), r[0]);
  },
  set(path, v) {
    const r = this.raiz(path);
    const ks = r[1].split('.');
    let o = r[0];
    ks.slice(0, -1).forEach((k, i) => {
      if (o[k] === null || o[k] === undefined || typeof o[k] !== 'object') o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[k];
    });
    o[ks[ks.length - 1]] = v;
    if (path[0] !== '@') Vist.tocar(path.split('.')[0]);
  },
  input(el) {
    this.set(el.dataset.k, el.type === 'checkbox' ? el.checked : el.value);
    Calc.refresh();
  },
  change(el) { if (el.dataset.rr) App.rerender(); }
};

Object.assign(Act, {
  pick(el) {
    vib();
    const k = el.dataset.k, v = el.dataset.v;
    if (el.dataset.m) {
      let a = (Form.get(k) || []).slice();
      if (v === 'Nenhuma') a = a.indexOf(v) >= 0 ? [] : [v];
      else { a = a.filter(x => x !== 'Nenhuma'); a = a.indexOf(v) >= 0 ? a.filter(x => x !== v) : a.concat(v); }
      Form.set(k, a);
    } else Form.set(k, Form.get(k) === v && !el.dataset.fix ? '' : v);
    App.rerender();
  },
  stp(el) {
    vib();
    const k = el.dataset.k, d = Number(el.dataset.d);
    const n = Math.min(Number(el.dataset.max || 99), Math.max(Number(el.dataset.min || 0), (Number(Form.get(k)) || 0) + d));
    Form.set(k, n);
    if (el.dataset.fn && Hooks[el.dataset.fn]) Hooks[el.dataset.fn](n);
    App.rerender();
  },
  chk(el) { vib(); Form.set(el.dataset.k, !Form.get(el.dataset.k)); App.rerender(); },
  foto(el) {
    const ids = Vist.fotosDe(el.dataset.slot).map(f => f.id);
    if (el.dataset.add || !ids.length) { vib(); Camera.abrir(Fotos.alvo(el)); }
    else Fotos.ver(ids[ids.length - 1], ids);
  },
  verFoto(el) { Fotos.ver(el.dataset.id, el.dataset.lista ? el.dataset.lista.split(',') : null); },
  bloco(el) { vib(); App.V.ui.bloco = Number(el.dataset.b); App.V.ui.pav = 0; Vist.salvar(); App.rerender(); },
  pav(el) { vib(); App.V.ui.pav = Number(el.dataset.p); Vist.salvar(); App.rerender(); },
  girar() { vib(); const n = ((Number(Form.get('estrutura.norte')) || 0) + 45) % 360; Form.set('estrutura.norte', n); App.rerender(); },
  etapaIr(el) { vib(); Vist.tocar(App.route.params.k, true); Router.go('etapa', { k: el.dataset.to }, { replace: true }); },
  etapaProx() {
    const k = App.route.params.k;
    const i = ETAPAS.findIndex(e => e.k === k);
    Vist.tocar(k, true);
    vib(12);
    App.V.etapa = ETAPAS[Math.min(i + 1, ETAPAS.length - 1)].k;
    Vist.salvar();
    const p = Pend.etapa(k).length;
    if (p) toast(ETAPA(k).t + ' salva · ' + plural(p, 'pendência'), 'warn', 1800); else toast(ETAPA(k).t + ' completa', 'ok', 1400);
    Router.go('etapa', { k: App.V.etapa }, { replace: true });
  },
  etapaAnt() {
    const k = App.route.params.k;
    const i = ETAPAS.findIndex(e => e.k === k);
    Vist.tocar(k, true);
    if (i <= 0) return Router.back();
    Router.go('etapa', { k: ETAPAS[i - 1].k }, { replace: true });
  },
  editar(el) { const k = el.dataset.k; App.V.ui['ed_' + k] = !App.V.ui['ed_' + k]; App.rerender(); },
  // Ambientes
  ambNovo(el) {
    const V = App.V;
    const ext = !!el.dataset.ext;
    const tipo = el.dataset.tipo || (ext ? 'Pátio coberto' : 'Sala de aula');
    App.form = Amb.novo(tipo, ext, V.ui.bloco, V.ui.pav);
    App.form._novo = true;
    Router.go('ambiente');
  },
  ambEditar(el) {
    const a = App.V.d.ambientes.itens.find(x => x.id === el.dataset.id);
    if (!a) return;
    App.form = JSON.parse(JSON.stringify(a));
    Router.go('ambiente');
  },
  ambTipo(el) {
    const t = el.value;
    App.form.tipo = t;
    if (!App.form._tocouTue) App.form.tue = (TUE_PADRAO[t] || []).map(n => ({ id: uid(), nome: n, qtd: '' }));
    App.rerender();
  },
  ambSalvar() {
    const a = App.form;
    if (!a) return;
    if (!num(a.c) || !num(a.l)) { toast('Informe comprimento e largura.', 'warn'); return; }
    const it = App.V.d.ambientes.itens;
    const i = it.findIndex(x => x.id === a.id);
    const limpo = JSON.parse(JSON.stringify(a));
    delete limpo._novo; delete limpo._tocouTue;
    if (i >= 0) it[i] = limpo; else it.push(limpo);
    Vist.tocar('ambientes', true);
    vib(14);
    toast((a.externo ? 'Área externa' : 'Ambiente') + ' salvo', 'ok', 1400);
    App.form = null;
    Router.back();
  },
  async ambExcluir() {
    const a = App.form;
    if (!(await confirmar({ titulo: 'Excluir ' + (a.nome || a.tipo) + '?', texto: 'As fotos deste ambiente também serão excluídas.', sim: 'Excluir', perigo: true }))) return;
    App.V.d.ambientes.itens = App.V.d.ambientes.itens.filter(x => x.id !== a.id);
    Object.values(App.V.fotos).filter(f => f.ref === a.id).forEach(f => Fotos.remover(f.id));
    Vist.tocar('ambientes', true);
    App.form = null;
    Router.back();
  },
  pavConcluir() {
    const V = App.V;
    const key = V.ui.bloco + '-' + V.ui.pav;
    V.d.ambientes.pavOk[key] = !V.d.ambientes.pavOk[key];
    Vist.tocar('ambientes');
    if (V.d.ambientes.pavOk[key]) {
      const pavs = Number(((V.d.estrutura.blocos || [])[V.ui.bloco] || {}).pav) || 1;
      if (V.ui.pav < pavs - 1) V.ui.pav++;
      toast('Pavimento concluído', 'ok', 1200);
    }
    App.rerender();
  },
  addLum() { App.form.lum = (App.form.lum || []).concat({ id: uid(), nome: '', lamp: 1, qtd: '' }); App.rerender(); },
  addTue() { App.form._tocouTue = true; App.form.tue = (App.form.tue || []).concat({ id: uid(), nome: '', qtd: '' }); App.rerender(); },
  rmLinha(el) {
    const lista = el.dataset.l;
    App.form[lista] = (App.form[lista] || []).filter(x => x.id !== el.dataset.id);
    if (lista === 'tue') App.form._tocouTue = true;
    App.rerender();
  },
  // Equipamentos
  eqAdd() {
    Sheet.open('<h3>Adicionar equipamento</h3><p class="muted small">Equipamentos com carga relevante fora dos ambientes.</p>' +
      ['Bomba de incêndio', 'Bomba de recalque', 'Elevador', 'Plataforma elevatória', 'Exaustor', 'Câmara fria', 'Forno elétrico', 'Chuveiro elétrico', 'Aquecedor', 'Outro']
        .map(n => '<button class="opt" data-act="eqAddTipo" data-n="' + n + '"><span class="ic">' + I('plus', 20) + '</span>' + n + '</button>').join(''));
  },
  eqAddTipo(el) {
    const n = el.dataset.n;
    App.V.d.equipamentos.itens.push({ id: uid(), nome: n === 'Outro' ? '' : n, qtd: 1, pot: '', un: n === 'Chuveiro elétrico' || n === 'Forno elétrico' ? 'W' : 'CV', desc: false });
    Vist.tocar('equipamentos');
    Sheet.close(true);
    App.rerender();
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50);
  },
  async eqRm(el) {
    const it = App.V.d.equipamentos.itens.find(x => x.id === el.dataset.id);
    if (!(await confirmar({ titulo: 'Remover ' + (it.nome || 'equipamento') + '?', texto: 'Use quando o equipamento não existe na unidade.', sim: 'Remover', perigo: true }))) return;
    App.V.d.equipamentos.itens = App.V.d.equipamentos.itens.filter(x => x.id !== el.dataset.id);
    Vist.tocar('equipamentos');
    App.rerender();
  },
  sigLimpar(el) { Form.set(el.dataset.k, ''); App.rerender(); },
  // Fluxos principais
  quickFoto() {
    const V = App.V;
    if (!V) return;
    const opts = [
      ['geral', 'geral.foto', 'Foto geral', 'Qualquer registro da vistoria', 'camera'],

/* ───── Assinatura (canvas com pointer events) ───── */
function iniciarAssinaturas() {
  $$('.sig canvas').forEach(cv => {
    const box = cv.parentElement;
    const k = box.dataset.sig;
    const dpr = window.devicePixelRatio || 1;
    const r = box.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1B2F8A';
    let des = false, tracos = 0, last = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
    cv.addEventListener('pointerdown', e => { des = true; last = pt(e); cv.setPointerCapture(e.pointerId); const ph = $('.ph-t', box); if (ph) ph.remove(); });
    cv.addEventListener('pointermove', e => {
      if (!des) return;
      const p = pt(e);
      g.beginPath(); g.moveTo(last.x, last.y);
      g.quadraticCurveTo(last.x, last.y, (last.x + p.x) / 2, (last.y + p.y) / 2);
      g.lineTo(p.x, p.y); g.stroke();
      last = p; tracos++;
    });
    const fim = () => {
      if (!des) return;
      des = false;
      if (tracos < 4) return;
      // Recorta e salva com fundo transparente (vai para o PDF).
      const out = document.createElement('canvas');
      out.width = cv.width / dpr; out.height = cv.height / dpr;
      out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
      Form.set(k, out.toDataURL('image/png'));
      Vist.tocar('revisao', true);
      clearTimeout(cv._t);
      cv._t = setTimeout(() => App.rerender(), 900);
    };
    cv.addEventListener('pointerup', fim);
    cv.addEventListener('pointercancel', fim);
  });
}

/* ───── Pendências (regras por etapa) ───── */
const Pend = {
  vazio(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length); },
  campos(lista) { return lista.filter(x => this.vazio(Form.get(x[0]))).map(x => x[1]); },
  fotos(lista) { return lista.filter(x => !Vist.fotosDe(x[0]).length).map(x => 'foto: ' + x[1]); },
  etapa(k) {
    const V = App.V;
    if (!V) return [];
    const d = V.d;
    const nb = Number(d.estrutura.nBlocos) || 1;
    switch (k) {
      case 'dados':
        return this.campos([['dados.nome', 'nome da escola'], ['dados.logradouro', 'endereço']])
          .concat(this.fotos([['dados.placa', 'placa da escola'], ['dados.frontal', 'fachada frontal']]));
      case 'entrada': {
        const e = d.entrada;
        if (!e.padrao) return ['padrão de entrada (BT/MT)'];
        const conservacao = (obj, itens) => itens.filter(i => !(obj || {})[i]).length ? ['estado de conservação'] : [];
        if (e.padrao === 'BT') {
          return this.campos([['entrada.tipoEntrada', 'tipo de entrada'], ['entrada.tensao', 'tensão nominal'], ['entrada.cx1.tipo', 'tipo da caixa de medição'],
            ['entrada.cx2.disjuntor', 'disjuntor geral'], ['entrada.aterr', 'aterramento'], ['entrada.cabos.fase', 'cabo fase'], ['entrada.med.rs', 'medição de tensão']])
            .concat(this.fotos([['entrada.medidor', 'medidor'], ['entrada.quadro', 'quadro geral'], ['entrada.aterramento', 'aterramento']]))
            .concat(conservacao(e.cons, ['tampa', 'lacre', 'visor', 'limpeza', 'fundo']));
        }
        return this.campos([['entrada.cabine', 'tipo da cabine'], ['entrada.tensaoMT', 'tensão nominal'], ['entrada.trafo.kva', 'potência do transformador'],
          ['entrada.aterr', 'aterramento']])
          .concat(this.fotos([['entrada.cabine', 'cabine ou poste'], ['entrada.medidor', 'medidor'], ['entrada.trafo', 'placa do transformador']]))
          .concat(conservacao(e.consMT, ['porta', 'lacre', 'isoladores', 'limpeza', 'base']));
      }
      case 'estrutura': {
        let out = [];
        for (let b = 0; b < nb; b++) {
          const pre = nb > 1 ? 'Bloco ' + BLOCO(b) + ': ' : '';
          out = out.concat(this.campos([['estrutura.blocos.' + b + '.cobTipo', 'tipo de cobertura'], ['estrutura.blocos.' + b + '.cobEstado', 'estado da cobertura'],
            ['estrutura.blocos.' + b + '.paredes', 'tipo de parede']]).map(x => pre + x));
          const fa = ((d.estrutura.blocos || [])[b] || {}).fachadas || {};
          if (['N', 'S', 'L', 'O'].some(x => !fa[x])) out.push(pre + 'orientação das fachadas');
          out = out.concat(this.fotos([['estrutura.b' + b + '.cobertura', 'cobertura']]).map(x => pre + x));
        }
        return out.concat(this.campos([['estrutura.vrfLocal', 'local das condensadoras']]))
          .concat(this.fotos([['estrutura.solo', 'solo ou pátio'], ['estrutura.base', 'base da condensadora']]));
      }
      case 'eletrica': {
        let out = [];
        for (let b = 0; b < nb; b++) {
          const pre = nb > 1 ? 'Bloco ' + BLOCO(b) + ': ' : '';
          const p = 'eletrica.blocos.' + b + '.';
          out = out.concat(this.campos([[p + 'tipo', 'tipo de quadro'], [p + 'tensao', 'tensão do quadro'], [p + 'estado', 'estado do quadro'],
            [p + 'circuito', 'circuito dedicado'], [p + 'pontoForca', 'ponto de força'], [p + 'aterr', 'aterramento do quadro']]).map(x => pre + x));
          out = out.concat(this.fotos([['eletrica.b' + b + '.quadro', 'quadro'], ['eletrica.b' + b + '.disjuntores', 'disjuntores'], ['eletrica.b' + b + '.aterr', 'aterramento do quadro']]).map(x => pre + x));
        }
        return out;
      }
      case 'ambientes': {
        const out = [];
        for (let b = 0; b < nb; b++) {
          const pavs = Number(((d.estrutura.blocos || [])[b] || {}).pav) || 1;
          for (let p = 0; p < pavs; p++) if (!Amb.lista(b, p).length) out.push('Bloco ' + BLOCO(b) + ' · ' + PAV(p) + (p ? ' pavimento' : '') + ' sem ambientes');
        }
        const it = d.ambientes.itens || [];
        const semMed = it.filter(a => !Amb.area(a)).length;
        const semFoto = it.filter(a => Amb.semFoto(a)).length;
        if (semMed) out.push(plural(semMed, 'ambiente') + ' sem medidas');
        if (semFoto) out.push(plural(semFoto, 'ambiente') + ' sem fotos');
        return out;
      }
      case 'equipamentos':
        return (d.equipamentos.itens || []).filter(x => x.desc || !num(x.pot)).map(x => 'potência ' + (x.desc ? 'inacessível' : 'não informada') + ': ' + (x.nome || 'equipamento'));
      case 'revisao':
        return this.campos([['revisao.respNome', 'nome do responsável'], ['revisao.assResp', 'assinatura do responsável'], ['revisao.assEmpresa', 'assinatura da empresa']]);
      default: return [];
    }
  },
  todas() {
    return ETAPAS.filter(e => e.k !== 'revisao').reduce((a, e) => a.concat(this.etapa(e.k).map(x => ({ etapa: e.k, descricao: x }))), []);
  }
};

    const areaPav = lista.reduce((s, a) => s + Amb.area(a) * (Number(a.qtd) || 1), 0);

    const ext = Amb.externos();
    const setores = (d.estrutura.setores || []).map(s => SETOR_PARA_EXT[s]).filter(Boolean).filter(t => !ext.some(a => a.tipo === t));
    return F.card('', F.lbl('Bloco') + '<div class="chips">' + Array.from({ length: nb }, (x, i) => '<button class="chip' + (b === i ? ' on' : '') + '" data-act="bloco" data-b="' + i + '">Bloco ' + BLOCO(i) + '</button>').join('') + '</div>' +
        F.lbl('Pavimento') + '<div class="pav-tabs">' + Array.from({ length: pavs }, (x, i) => {
          const st = ok[b + '-' + i] ? 'ok' : Amb.lista(b, i).length ? 'and' : 'pend';
          return '<button class="' + st + (p === i ? ' on' : '') + '" data-act="pav" data-p="' + i + '">' + PAV(i) + (st === 'ok' ? ' ✓' : p === i ? '<br><small>em andamento</small>' : st === 'pend' ? ' · pendente' : '') + '</button>';
        }).join('') + '</div>') +
      '<section class="card"><div class="pav-head"><span><b>Bloco ' + BLOCO(b) + ' · ' + (p === 0 ? 'Térreo' : PAV(p) + ' pavimento') + '</b><small>Ambientes deste pavimento</small></span><span class="badge">' + totalUn + ' un.</span></div>' +
        (lista.length ? lista.map(a => Amb.linha(a)).join('') + '<div class="tot"><span>Área do pavimento</span><b>' + fmt(areaPav, areaPav % 1 ? 1 : 0) + ' m²</b></div>'
          : '<div class="empty" style="padding:24px 10px">Nenhum ambiente neste pavimento ainda.</div>') +
        '<button class="btn btn-dash" data-act="ambNovo">' + I('plus', 20) + ' Adicionar tipo neste pavimento</button>' +
        (lista.length ? '<button class="btn ' + (ok[b + '-' + p] ? 'btn-out' : 'btn-out-teal') + ' mt" data-act="pavConcluir">' + (ok[b + '-' + p] ? 'Reabrir pavimento' : I('check', 20) + ' Concluir pavimento') + '</button>' : '') +
      '</section>' +
      F.card('Áreas externas', '<p class="muted small" style="margin:-6px 0 6px">Não são por pavimento. Informe por setor da escola.</p>' +
        ext.map(a => Amb.linha(a)).join('') +
        (setores.length ? '<div class="chips sm mt">' + setores.map(t => '<button class="chip" data-act="ambNovo" data-ext="1" data-tipo="' + esc(t) + '">+ ' + esc(t) + '</button>').join('') + '</div>' : '') +
        '<button class="btn btn-dash mt" data-act="ambNovo" data-ext="1">' + I('plus', 20) + ' Adicionar área externa</button>');
  },

  equipamentos() {
    const itens = App.V.d.equipamentos.itens || [];
    return F.card('Equipamentos com carga', itens.map((x, i) => {
      const P = 'equipamentos.itens.' + i + '.';
      const fs = Vist.fotosDe('equipamentos.' + x.id + '.chapa');
      const last = fs[fs.length - 1];
      return '<div class="equip"><div class="equip-h"><input data-k="' + P + 'nome" value="' + esc(x.nome) + '" placeholder="Nome do equipamento">' +
        F.stepper(P + 'qtd', '', { min: 1, max: 50, sm: true }) +
        '<button class="icon-btn" style="color:var(--muted);width:34px;height:34px;margin:0" data-act="eqRm" data-id="' + x.id + '" aria-label="Remover">' + I('x', 18) + '</button></div>' +
        '<div class="cols"><div><span class="lbl" style="margin-top:0">Potência nominal</span>' +
        (x.desc ? '<div class="pot" style="color:var(--muted-2)">—</div>' :
          '<input class="pot" data-k="' + P + 'pot" value="' + esc(x.pot) + '" inputmode="decimal" placeholder="Ex.: 3">' +
          '<div class="seg mt" style="gap:6px">' + ['W', 'CV'].map(u => '<button class="chip' + (x.un === u ? ' on' : '') + '" data-act="pick" data-fix="1" data-k="' + P + 'un" data-v="' + u + '">' + u + '</button>').join('') + '</div>' +
          '<div class="small c-teal mt" data-calc="pot" data-arg="' + x.id + '"></div>') + '</div>' +
        '<div><span class="lbl" style="margin-top:0">Chapa de identificação</span><button class="chapa" data-act="foto" data-slot="equipamentos.' + x.id + '.chapa" data-etapa="equipamentos" data-rot="Chapa · ' + esc(x.nome) + '">' +
        (last ? '<img data-th="' + last.id + '"' + (last.fileId ? ' data-fid="' + last.fileId + '"' : '') + ' alt="">' : '<span class="row" style="gap:6px">' + I('camera', 22) + ' Foto</span>') + '</button></div></div>' +
        '<div class="mt">' + F.check(P + 'desc', '<span style="font-weight:600;color:var(--muted)">Desconhecido / inacessível</span>') + '</div></div>';
    }).join('') + '<button class="btn btn-out-teal" data-act="eqAdd">' + I('plus', 20) + ' Adicionar equipamento</button>');
  },

  revisao() {
    const V = App.V;
    const c = Vist.contagem();
    const ext = Amb.externos().reduce((s, a) => s + (Number(a.qtd) || 1), 0);
    const st = k => {
      const p = Pend.etapa(k);
      if (k === 'equipamentos' && (V.d.equipamentos.itens || []).some(x => x.desc)) return '<span class="badge b-red" style="background:none">Atenção</span>';
      if (k === 'ambientes') { const sf = (V.d.ambientes.itens || []).filter(a => Amb.semFoto(a)).length; if (sf) return '<span class="badge b-amber">' + sf + ' sem fotos</span>'; }
      return p.length ? '<span class="badge b-amber">' + plural(p.length, 'pendência') + '</span>' : '<span class="badge b-green" style="background:none">Completo</span>';
    };
    const e = V.d.entrada, es = V.d.estrutura;
    const sub = {
      dados: 'Identificação e endereço',
      entrada: e.padrao === 'MT' ? 'Padrão MT' + (e.trafo && e.trafo.kva ? ' · ' + e.trafo.kva + ' kVA' : '') : e.padrao === 'BT' ? 'Padrão BT, caixas 1 e 2' : 'Não iniciada',
      estrutura: plural(Number(es.nBlocos) || 1, 'bloco') + ((es.setores || []).length ? ' · setores externos' : ''),
      eletrica: (V.d.eletrica.blocos || []).reduce((s, b) => s + (Number(b.quadros) || 0), 0) + ' quadros',
      ambientes: (c.ambientes - ext) + ' internos · ' + ext + ' externos',
      equipamentos: plural((V.d.equipamentos.itens || []).length, 'item', 'itens') + ((V.d.equipamentos.itens || []).filter(x => x.desc).length ? ' · ' + (V.d.equipamentos.itens || []).filter(x => x.desc).length + ' inacessível' : '')
    };
    const pend = Pend.todas();
    const r = V.d.revisao;
    const ass = (k) => r[k] ? '<span class="badge b-green">Assinado</span>' : '<span class="badge b-amber">Não assinado</span>';
    return F.card('Resumo da vistoria', ETAPAS.filter(x => x.k !== 'revisao').map(x =>
        '<button class="sum-row" data-act="etapaIr" data-to="' + x.k + '"><span><b>' + x.t + '</b><small>' + esc(sub[x.k]) + '</small></span>' + st(x.k) + '</button>').join('') +
      (pend.length ? '<div class="warn-box"><b>Antes de finalizar:</b> ' + esc(pend.slice(0, 4).map(p => p.descricao).join('; ')) + (pend.length > 4 ? ' e mais ' + (pend.length - 4) : '') +
        '. Você pode finalizar assim, mas essas pendências ficarão registradas.</div>' : '')) +
      F.card('Responsável pelo acompanhamento', F.text('revisao.respNome', 'Nome', { ph: 'Nome completo' }) + F.text('revisao.respCargo', 'Cargo', { ph: 'Ex.: Diretora' }) +
        F.row(F.text('revisao.respRF', 'RF', { ph: 'Ex.: 1234567', im: 'numeric' }), F.text('revisao.respTel', 'Telefone', { ph: '(11) 00000-0000', type: 'tel', im: 'tel' })) +
        F.text('revisao.respEmail', 'E-mail', { ph: 'email@escola.sp.gov.br', type: 'email', im: 'email' }) +
        '<div class="row mt" style="justify-content:space-between"><span class="lbl" style="margin:0">Assinatura</span>' + ass('assResp') + '</div><div class="mt">' + F.sig('revisao.assResp') + '</div>') +
      F.card('Responsável pela empresa', '<div class="row" style="justify-content:space-between"><span class="lbl" style="margin:0">Assinatura</span>' + ass('assEmpresa') + '</div><div class="mt">' + F.sig('revisao.assEmpresa') + '</div>') +
      F.card('Prioridades da unidade', '<p class="muted small" style="margin:-6px 0 0">Uma por linha, na ordem pedida pela unidade. Se ficar em branco, o relatório sugere a partir dos ambientes.</p>' +
        F.area('revisao.prioridades', '', 'Ex.: Adequação do ar-condicionado nas salas de aula 1 e 2')) +
      F.card('Observações gerais', F.area('revisao.obsGerais', '', 'Ex.: escola em funcionamento, acesso só pela portaria, retorno para medir o quadro')) +
      F.card('Relatórios', '<button class="btn btn-out-teal" data-act="go" data-to="relatorio" data-p=\'{"tipo":"completo"}\'>' + I('file', 20) + ' Visualizar relatório completo</button>' +
        '<button class="btn btn-out mt" data-act="go" data-to="relatorio" data-p=\'{"tipo":"vistoria"}\'>Visualizar relatório de vistoria</button>' +
        '<div class="ph-hint">Os relatórios ficam disponíveis para visualização. A assinatura libera a versão final.</div>',
        { badge: r.assResp && r.assEmpresa ? '<span class="badge b-green">Assinado</span>' : '<span class="badge b-amber">Não assinado</span>' });
  }
};
</script>
