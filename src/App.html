const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 20);
const num = v => { const n = parseFloat(String(v === null || v === undefined ? '' : v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmt = (n, c) => (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: c || 0, maximumFractionDigits: c || 0 });
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) { /* sem vibração */ } };
const hora = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';

};

/* ───── Armazenamento local ───── */
const LS = (() => {
  const mem = {};
  return {
    get(k, d) { try { const v = localStorage.getItem('vistar.' + k); return v === null ? (k in mem ? mem[k] : (d === undefined ? null : d)) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : (d === undefined ? null : d); } },
    set(k, v) { mem[k] = v; try { localStorage.setItem('vistar.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { delete mem[k]; try { localStorage.removeItem('vistar.' + k); } catch (e) { /* ignora */ } }
  };
})();

/** IndexedDB com fallback em memória (fila offline e miniaturas). */
const IDB = (() => {
  let dbp = null;
  const mem = { outbox: new Map(), thumbs: new Map() };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('sem IndexedDB'));
      const r = indexedDB.open('vistar', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('outbox', { keyPath: 'id' }); r.result.createObjectStore('thumbs', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(() => null);
    return dbp;
  }
  async function tx(store, mode, fn, memFn) {
    const db = await open();
    if (!db) return memFn(mem[store]);
    return new Promise((res) => {
      let out;
      try {
        const t = db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        if (req) req.onsuccess = () => { out = req.result; };
        t.oncomplete = () => res(out);
        t.onerror = t.onabort = () => res(memFn(mem[store]));
      } catch (e) { res(memFn(mem[store])); }
    });
  }
  return {
    put: (s, v) => tx(s, 'readwrite', o => o.put(v), m => m.set(v.id, v)),
    get: (s, k) => tx(s, 'readonly', o => o.get(k), m => m.get(k)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k), m => m.delete(k)),
    all: s => tx(s, 'readonly', o => o.getAll(), m => Array.from(m.values())),
    clear: s => tx(s, 'readwrite', o => o.clear(), m => m.clear())
  };
})();

/* ───── Chamada ao servidor (google.script.run) ───── */
const Api = {
  run(acao, payload) {
    return new Promise((res, rej) => {
      const ok = r => {
        if (r && r.ok) return res(r.data);
        const e = new Error((r && r.error) || 'Erro no servidor');
        e.code = r && r.code; e.biz = true; rej(e);
      };
      const fail = err => { const e = new Error((err && err.message) || 'Sem conexão com o servidor'); e.net = true; rej(e); };
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(fail).api(acao, App.token, payload || {});
      } else if (window.MockApi) {
        window.MockApi(acao, App.token, payload || {}).then(ok, fail);
      } else fail(new Error('Servidor indisponível'));
    });
  }
};

/* ───── Fila offline: tudo que altera dados passa por aqui ───── */
const Sync = {
  q: [], busy: false, fails: 0, handlers: {}, waiters: [],
  async init() {
    this.q = ((await IDB.all('outbox')) || []).sort((a, b) => a.seq - b.seq);
    this.q.forEach(i => { i.running = false; });
    window.addEventListener('online', () => { this.fails = 0; this.kick(); App.renderNet(); });
    window.addEventListener('offline', () => { this.render(); App.renderNet(); });
    setInterval(() => this.kick(), 20000);
  },
  on(acao, fn) { this.handlers[acao] = fn; },
  async add(acao, payload, key) {
    if (key) {
      const ex = this.q.find(i => i.key === key && !i.running);
      if (ex) { ex.payload = payload; await IDB.put('outbox', ex); this.kickSoon(); return ex; }
    }
    const it = { id: uid(), seq: Date.now() + Math.random(), acao: acao, payload: payload, key: key || '', tries: 0 };
    this.q.push(it);
    await IDB.put('outbox', it);
    this.render();
    this.kickSoon();
    return it;
  },
  has(pred) { return this.q.some(pred); },
  kickSoon(ms) { clearTimeout(this._t); this._t = setTimeout(() => this.kick(), ms === undefined ? 800 : ms); },
  async kick() {
    if (this.busy || !this.q.length || !App.token) { this.done(); return; }
    if (navigator.onLine === false) { this.render(); return; }
    this.busy = true; this.render();
    while (this.q.length) {
      const it = this.q[0];
      it.running = true;
      try {
        const r = await Api.run(it.acao, it.payload);
        this.q.shift(); await IDB.del('outbox', it.id); this.fails = 0;
        const h = this.handlers[it.acao];
        if (h) { try { h(r, it.payload); } catch (e) { console.error(e); } }
      } catch (e) {
        it.running = false;
        if (e.code === 'AUTH') { this.busy = false; this.render(); App.authLost(); return; }
        if (e.biz) {
          it.tries++;
          if (it.tries >= 3) {
            this.q.shift(); await IDB.del('outbox', it.id);
            toast('Não sincronizado: ' + e.message, 'err', 6000);
            const h = this.handlers[it.acao + ':erro'];
            if (h) { try { h(e, it.payload); } catch (x) { console.error(x); } }
          } else { await IDB.put('outbox', it); await new Promise(r => setTimeout(r, 1500)); }
        } else { this.fails++; break; }
      }
      this.render();
    }
    this.busy = false; this.render(); this.done();
    if (this.q.length && this.fails) this.kickSoon(Math.min(60000, 2000 * Math.pow(2, this.fails)));
  },
  done() { if (!this.q.length) { const w = this.waiters; this.waiters = []; w.forEach(f => f()); } },
  /** Espera a fila esvaziar (para ações que precisam do servidor em dia). */
  flush(ms) {
    return new Promise((res, rej) => {
      if (!this.q.length) return res();
      const t = setTimeout(() => rej(new Error(navigator.onLine === false ? 'Sem conexão. Os dados continuam salvos no aparelho.' : 'A sincronização está demorando. Tente de novo em instantes.')), ms || 90000);
      this.waiters.push(() => { clearTimeout(t); res(); });
      this.fails = 0; this.kick();
    });
  },
  render() {
    const n = this.q.length;
    const off = navigator.onLine === false;
    $$('[data-sync]').forEach(el => {
      el.classList.toggle('hidden', !n && !off);
      el.className = 'sync' + (off ? ' off' : '') + (this.busy ? ' run' : '') + (this.fails > 2 ? ' err' : '') + (!n && !off ? ' hidden' : '');
      el.innerHTML = '<i></i>' + (off ? 'Offline' + (n ? ' · ' + n : '') : this.busy ? 'Enviando ' + n : n + ' na fila');
    });
  }
};

/* ───── Toast, folhas inferiores e confirmação ───── */
function toast(msg, tipo, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || '');
  el.innerHTML = (tipo === 'ok' ? I('check', 18) : tipo === 'err' ? I('alert', 18) : '') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms || 2600);
}

function carregando(btn, on, txt) {
  if (!btn) return;
  if (on) { btn._html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (txt ? esc(txt) : ''); }
  else { btn.disabled = false; if (btn._html) btn.innerHTML = btn._html; }
}

/* ───── Geolocalização ───── */
const Geo = {
  last: null,
  get(ms) {
    return new Promise(res => {
      if (!navigator.geolocation) return res(this.last);
      if (this.last && Date.now() - this.last.t < 90000) return res(this.last);
      let fim = false;
      const t = setTimeout(() => { if (!fim) { fim = true; res(this.last); } }, ms || 8000);
      try {
        navigator.geolocation.getCurrentPosition(p => {
          if (fim) return; fim = true; clearTimeout(t);
          this.last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
          res(this.last);
        }, () => { if (!fim) { fim = true; clearTimeout(t); res(this.last); } }, { enableHighAccuracy: true, maximumAge: 60000, timeout: ms || 8000 });
      } catch (e) { fim = true; clearTimeout(t); res(this.last); }
    });
  },
  dist(a, b, c, d) {
    const R = 6371000, r = x => x * Math.PI / 180;
    const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
};

/* ───── Miniaturas em memória + IndexedDB + servidor ───── */
const Thumbs = {
  mem: new Map(),
  async load() { ((await IDB.all('thumbs')) || []).forEach(t => this.mem.set(t.id, t.src)); },
  put(id, src) { this.mem.set(id, src); IDB.put('thumbs', { id: id, src: src }); },
  async drop(id) { this.mem.delete(id); await IDB.del('thumbs', id); },
  hydrate() {
    const falta = new Map();
    $$('img[data-th]').forEach(img => {
      const id = img.dataset.th, fid = img.dataset.fid;
      const src = this.mem.get(id) || (fid && this.mem.get('f:' + fid));
      if (src) { if (img.src !== src) img.src = src; img.classList.remove('hidden'); }
      else if (fid) falta.set(fid, id);
    });
    if (!falta.size || this._busy || navigator.onLine === false) return;
    this._busy = true;
    const ids = Array.from(falta.keys()).slice(0, 30);
    Api.run('thumbs', { ids: ids, tamanho: 360 }).then(r => {
      Object.keys(r || {}).forEach(fid => {
        this.put('f:' + fid, r[fid]);
        const fotoId = falta.get(fid);
        if (fotoId) this.mem.set(fotoId, r[fid]);
      });
      this._busy = false;
      this.hydrate();
    }).catch(() => { this._busy = false; });
  }
};

/* ───── Câmera: compressão, carimbo de data/escola e envio em fila ───── */
const Camera = {
  alvo: null,
  abrir(alvo, galeria) {
    this.alvo = alvo;
    const inp = galeria ? $('#gal') : $('#cam');
    inp.value = '';
    inp.click();
  },
  async arquivos(files) {
    const alvo = this.alvo; this.alvo = null;
    if (!alvo || !files || !files.length) return;
    for (const f of Array.from(files)) {
      try {
        const img = await this.processar(f, alvo.carimbo);
        if (alvo.onFoto) await alvo.onFoto(img); else await Fotos.adicionar(alvo, img);
      } catch (e) { console.error(e); toast('Não foi possível ler a foto.', 'err'); }
    }
  },
  carregar(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = url;
    });
  },
  async processar(file, carimbo) {
    let src = null;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { src = await this.carregar(file); }
    const W = src.width, H = src.height;
    const desenhar = (max, q, stamp) => {
      const s = Math.min(1, max / Math.max(W, H));
      const c = document.createElement('canvas');
      c.width = Math.round(W * s); c.height = Math.round(H * s);
      const g = c.getContext('2d');
      g.drawImage(src, 0, 0, c.width, c.height);
      if (stamp) {
        const fs = Math.max(14, Math.round(c.width / 48));
        g.font = '600 ' + fs + 'px Inter, Arial, sans-serif';
        const txt = stamp;
        const w = g.measureText(txt).width + fs;
        g.fillStyle = 'rgba(15,33,64,.72)';
        g.fillRect(0, c.height - fs * 1.9, Math.min(c.width, w), fs * 1.9);
        g.fillStyle = '#fff';
        g.fillText(txt, fs / 2, c.height - fs * 0.62);
      }
      return c.toDataURL('image/jpeg', q);
    };
    const stamp = carimbo === false ? '' : [new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }), carimbo || ''].filter(Boolean).join(' · ');
    return { full: desenhar(1600, 0.78, stamp), thumb: desenhar(360, 0.62, '') };
  }
};

/* ───── Utilidades de navegação externa ───── */
function abrirExterno(url) {
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
}
function linkMaps(e, origem) {
  const dest = e.lat && e.lng ? e.lat + ',' + e.lng : encodeURIComponent([e.logradouro, e.numero, e.bairro, 'São Paulo - SP'].filter(Boolean).join(', '));
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest + (origem ? '&origin=' + origem.lat + ',' + origem.lng : '');
}
function linkWaze(e) {
  return e.lat && e.lng ? 'https://waze.com/ul?ll=' + e.lat + ',' + e.lng + '&navigate=yes'
    : 'https://waze.com/ul?q=' + encodeURIComponent([e.logradouro, e.numero, 'São Paulo'].join(' ')) + '&navigate=yes';
}
function baixarBase64(b64, nome, mime) {
  try {
    const bin = atob(b64); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: mime || 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return true;
  } catch (e) { return false; }
}

const Act = {

  go(el) { vib(); Router.go(el.dataset.to, el.dataset.p ? JSON.parse(el.dataset.p) : {}); },

  back() { vib(); Router.back(); },
  tel(el) { abrirExterno('tel:' + String(el.dataset.tel).replace(/[^\d+]/g, '')); },
  maps(el) { const e = App.escola(el.dataset.id); if (e) abrirExterno(linkMaps(e, Geo.last)); },
  waze(el) { const e = App.escola(el.dataset.id); if (e) abrirExterno(linkWaze(e)); },
  retry() { App.refresh(); }
};

/* ───── Roteador (integra o histórico do navegador via google.script.history) ───── */
const Router = {
  stack: [],
  hist() { return window.google && google.script && google.script.history; },
  go(name, params, opts) {
    const o = opts || {};
    const r = { name: name, params: params || {} };
    if (o.replace && this.stack.length) this.stack[this.stack.length - 1] = r; else this.stack.push(r);
    App.route = r;
    App.render({ anim: 'in', top: true });
    const h = this.hist();
    if (h) { try { h[o.replace ? 'replace' : 'push']({ n: this.stack.length }, {}, name); } catch (e) { /* ignora */ } }
  },
  back() {
    if (Sheet.opts !== null && $('#layer').innerHTML) { Sheet.close(); return; }
    const cur = this.stack[this.stack.length - 1];
    const view = cur && Views[cur.name];
    if (view && view.onBack && view.onBack(cur.params) === false) return;
    if (this.stack.length > 1) {
      this.stack.pop();
      App.route = this.stack[this.stack.length - 1];
      App.render({ anim: 'back', top: true });
    } else if (cur && cur.name !== 'home') this.reset('home');
  },
  reset(name, params) {
    this.stack = [{ name: name, params: params || {} }];
    App.route = this.stack[0];
    App.render({ anim: 'in', top: true });
    const h = this.hist();
    if (h) { try { h.replace({ n: 1 }, {}, name); } catch (e) { /* ignora */ } }
  }
};

/* ───── App ───── */
const App = {
  boot: window.__BOOT__ || { cfg: {} },
  token: null, data: null, V: null, route: null, form: null, final: null,

  async start() {
    this.token = LS.get('token');
    if (!this.token && this.boot.sso && !LS.get('saiu')) { this.token = this.boot.sso.token; LS.set('token', this.token); }
    this.bind();
    await Promise.all([Sync.init(), Thumbs.load()]);
    this.data = LS.get('boot');
    this.V = LS.get('v');
    this.final = LS.get('final');
    if (!this.token) { Router.reset('login'); return; }
    Router.reset(!this.data ? 'loading' : this.V && this.V.status === 'finalizando' ? 'finalizada' : 'home');
    this.refresh();
    Sync.kickSoon(1500);
    setInterval(() => this.tick(), 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - (this._lastRefresh || 0) > 60000) this.refresh();
    });
  },

  bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const fn = Act[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el, e); }
    });
    document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.k !== undefined) Form.input(e.target); });
    document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.k !== undefined) Form.change(e.target); });
    $('#cam').addEventListener('change', e => Camera.arquivos(e.target.files));
    $('#gal').addEventListener('change', e => Camera.arquivos(e.target.files));
    const h = Router.hist();
    if (h) {
      try {
        h.setChangeHandler(ev => {
          const n = (ev && ev.state && ev.state.n) || 1;
          if (n < Router.stack.length) Router.back();
        });
      } catch (e) { /* ignora */ }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) Sheet.close(); });
  },

  async refresh() {
    this._lastRefresh = Date.now();
    try {
      const d = await Api.run('bootstrap');
      this.aplicarBoot(d);
    } catch (e) {
      if (e.code === 'AUTH') return this.authLost();
      if (!this.data) { this.erroCarga = e.message; if (this.route && this.route.name === 'loading') this.rerender(); }
    }
  },

  aplicarBoot(d) {
    this.data = d;
    LS.set('boot', d);
    Vist.mesclar(d.vistoriaAtiva);
    const r = this.route && this.route.name;
    if (r === 'loading') Router.reset('home');
    else if (['home', 'escolas', 'pendencias', 'credencial', 'fotos'].indexOf(r) >= 0 && !this.editando()) this.rerender();
  },

  editando() { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); },

  escola(id) { return ((this.data && this.data.escolas) || []).find(e => e.id === id) || null; },
  dre(id) { return ((this.data && this.data.dres) || []).find(d => d.id === id) || null; },

  authLost() {
    this.token = null; LS.del('token');
    toast('Sua sessão expirou. Entre novamente — nada do que foi coletado se perdeu.', 'warn', 5000);
    Router.reset('login');
  },

  sair() {
    const temFila = Sync.q.length;
    return confirmar({
      titulo: 'Sair da conta?',
      texto: temFila ? '<b style="color:var(--red)">Ainda há ' + plural(temFila, 'item', 'itens') + ' não sincronizados.</b> Eles ficam guardados neste aparelho e serão enviados quando alguém entrar novamente.' : 'Você precisará entrar novamente neste aparelho.',
      sim: 'Sair', perigo: true
    }).then(ok => {
      if (!ok) return;
      this.token = null; LS.del('token'); LS.del('boot'); LS.set('saiu', true);
      this.data = null;
      Router.reset('login');
    });
  },

  render(opts) {
    const o = opts || {};
    const r = this.route || { name: 'home', params: {} };
    const view = Views[r.name] || Views.home;
    let out;
    try { out = view(r.params) || {}; } catch (e) {
      console.error(e);
      out = { header: Views.hdrSimples('Ops'), body: '<div class="card"><b>Algo deu errado nesta tela.</b><p class="muted">' + esc(e.message) + '</p><button class="btn btn-navy" data-act="tab" data-to="home">Voltar ao início</button></div>' };
    }
    $('#hdr').innerHTML = out.header || '';
    const main = $('#main');
    main.className = 'main' + (out.foot ? ' has-foot' : '') + (out.flush ? ' flush' : '');
    if (out.flush) main.style.padding = '0'; else main.style.padding = '';
    main.innerHTML = '<div class="view' + (o.anim === 'back' ? ' back-anim' : o.anim ? '' : '" style="animation:none') + '">' + (out.body || '') + '</div>';
    $('#foot').innerHTML = (out.foot ? '<div class="foot"><div class="foot-in' + (out.footOne ? ' one' : '') + '">' + out.foot + '</div></div>' : '') +
      (out.nav ? Views.nav(out.nav) : '') + (out.fab || '');
    if (o.top) window.scrollTo(0, 0);
    if (out.after) { try { out.after(); } catch (e) { console.error(e); } }
    Thumbs.hydrate();
    Calc.refresh();
    Sync.render();
    this.renderNet();
  },

  rerender() {
    const y = window.scrollY;
    this.render({});
    window.scrollTo(0, y);
  },

  renderNet() {
    let bar = $('#offbar');
    const off = navigator.onLine === false;
    if (off && !bar && this.route && this.route.name !== 'login') {
      bar = document.createElement('div'); bar.id = 'offbar'; bar.className = 'offline-bar';
      bar.textContent = 'Sem internet · tudo é salvo no aparelho e enviado depois';
      $('#hdr').appendChild(bar);
    } else if (!off && bar) bar.remove();
  },

  tick() {
    $$('[data-since]').forEach(el => { el.textContent = duracao(el.dataset.since); });
    $$('[data-clock]').forEach(el => { el.textContent = hora(new Date().toISOString()); });
  }
};
</script>
