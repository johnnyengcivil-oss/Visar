/* ───── Pendências (regras por etapa) ───── */
const Pend = {
  vazio(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length); },
  campos(lista) { return lista.filter(x => this.vazio(Form.get(x[0]))).map(x => x[1]); },
  fotos(lista) { return lista.filter(x => !Vist.fotosDe(x[0]).length).map(x => 'foto: ' + x[1]); },
  etapa(k) {
    const V = App.V;
    if (!V) return [];
    const d = V.d;
    const nb = Number(d.estrutura.nBlocos) || 1;
    switch (k) {
      case 'dados':
        return this.campos([['dados.nome', 'nome da escola'], ['dados.logradouro', 'endereço']])
          .concat(this.fotos([['dados.placa', 'placa da escola'], ['dados.frontal', 'fachada frontal']]));
      case 'entrada': {
        const e = d.entrada;
        if (!e.padrao) return ['padrão de entrada (BT/MT)'];
        const conservacao = (obj, itens) => itens.filter(i => !(obj || {})[i]).length ? ['estado de conservação'] : [];
        if (e.padrao === 'BT') {
          return this.campos([['entrada.tipoEntrada', 'tipo de entrada'], ['entrada.tensao', 'tensão nominal'], ['entrada.fases', 'fornecimento (mono, bi ou trifásico)'], ['entrada.cx1.tipo', 'tipo da caixa de medição'],
            ['entrada.cx2.disjuntor', 'disjuntor geral'], ['entrada.aterr', 'aterramento'], ['entrada.cabos.fase', 'cabo fase'], ['entrada.med.rs', 'medição de tensão']])
            .concat(this.fotos([['entrada.medidor', 'medidor'], ['entrada.quadro', 'quadro geral'], ['entrada.aterramento', 'aterramento']]))
            .concat(conservacao(e.cons, ['tampa', 'lacre', 'visor', 'limpeza', 'fundo']));
        }
        return this.campos([['entrada.cabine', 'tipo da cabine'], ['entrada.tensaoMT', 'tensão nominal'], ['entrada.trafo.kva', 'potência do transformador'],
          ['entrada.aterr', 'aterramento']])
          .concat(this.fotos([['entrada.cabine', 'cabine ou poste'], ['entrada.medidor', 'medidor'], ['entrada.trafo', 'placa do transformador']]))
          .concat(conservacao(e.consMT, ['porta', 'lacre', 'isoladores', 'limpeza', 'base']));
      }
      case 'estrutura': {
        let out = [];
        for (let b = 0; b < nb; b++) {
          const pre = nb > 1 ? NB(b) + ': ' : '';
          out = out.concat(this.campos([['estrutura.blocos.' + b + '.cobTipo', 'tipo de cobertura'], ['estrutura.blocos.' + b + '.cobEstado', 'estado da cobertura'],
            ['estrutura.blocos.' + b + '.paredes', 'tipo de parede']]).map(x => pre + x));
          const fa = ((d.estrutura.blocos || [])[b] || {}).fachadas || {};
          if (['N', 'S', 'L', 'O'].some(x => !fa[x])) out.push(pre + 'orientação das fachadas');
          out = out.concat(this.fotos([['estrutura.b' + b + '.cobertura', 'cobertura']]).map(x => pre + x));
        }
        return out.concat(this.campos([['estrutura.vrfLocal', 'local das condensadoras']]))
          .concat(this.fotos([['estrutura.solo', 'solo ou pátio'], ['estrutura.base', 'base da condensadora']]));
      }
      case 'eletrica': {
        let out = [];
        for (let b = 0; b < nb; b++) {
          const pre = nb > 1 ? NB(b) + ': ' : '';
          const p = 'eletrica.blocos.' + b + '.';
          out = out.concat(this.campos([[p + 'tipo', 'tipo de quadro'], [p + 'tensao', 'tensão do quadro'], [p + 'estado', 'estado do quadro'],
            [p + 'circuito', 'circuito dedicado'], [p + 'pontoForca', 'ponto de força'], [p + 'aterr', 'aterramento do quadro']]).map(x => pre + x));
          out = out.concat(this.fotos([['eletrica.b' + b + '.quadro', 'quadro'], ['eletrica.b' + b + '.disjuntores', 'disjuntores'], ['eletrica.b' + b + '.aterr', 'aterramento do quadro']]).map(x => pre + x));
        }
        return out;
      }
      case 'ambientes': {
        const out = [];
        for (let b = 0; b < nb; b++) {
          const pavs = Number(((d.estrutura.blocos || [])[b] || {}).pav) || 1;
          for (let p = 0; p < pavs; p++) if (!Amb.lista(b, p).length) out.push(NB(b) + ' · ' + PAV(p) + (p ? ' pavimento' : '') + ' sem ambientes');
        }
        const it = d.ambientes.itens || [];
        const semMed = it.filter(a => !Amb.area(a)).length;
        const semFoto = it.filter(a => Amb.semFoto(a)).length;
        if (semMed) out.push(plural(semMed, 'ambiente') + ' sem medidas');
        if (semFoto) out.push(plural(semFoto, 'ambiente') + ' sem fotos');
        return out;
      }
      case 'equipamentos':
        return (d.equipamentos.itens || []).filter(x => x.desc || !num(x.pot)).map(x => 'potência ' + (x.desc ? 'inacessível' : 'não informada') + ': ' + (x.nome || 'equipamento'));
      case 'revisao':
        return this.campos([['revisao.respNome', 'nome do responsável'], ['revisao.assResp', 'assinatura do responsável'], ['revisao.assEmpresa', 'assinatura da empresa']]);
      default: return [];
    }
  },
  todas() {
    return ETAPAS.filter(e => e.k !== 'revisao').reduce((a, e) => a.concat(this.etapa(e.k).map(x => ({ etapa: e.k, descricao: x }))), []);
  }
};

  ambientes() {

        (lista.length ? lista.map(a => Amb.linha(a)).join('') + '<div class="tot"><span>Área do pavimento</span><b>' + fmt(areaPav, areaPav % 1 ? 1 : 0) + ' m²</b></div>'

        (lista.length ? '<button class="btn ' + (ok[b + '-' + p] ? 'btn-out' : 'btn-out-teal') + ' mt" data-act="pavConcluir">' + (ok[b + '-' + p] ? 'Reabrir pavimento' : I('check', 20) + ' Concluir pavimento') + '</button>' : '') +
      '</section>' +
      F.card('Áreas externas', '<p class="muted small" style="margin:-6px 0 6px">Não são por pavimento. Informe por setor da escola.</p>' +

  equipamentos() {

        '<div class="cols"><div><span class="lbl" style="margin-top:0">Potência nominal</span>' +
        (x.desc ? '<div class="pot" style="color:var(--muted-2)">—</div>' :

  revisao() {
    const V = App.V;
    const c = Vist.contagem();
    const ext = Amb.externos().reduce((s, a) => s + (Number(a.qtd) || 1), 0);
    const st = k => {
      const p = Pend.etapa(k);
      if (k === 'equipamentos' && (V.d.equipamentos.itens || []).some(x => x.desc)) return '<span class="badge b-red" style="background:none">Atenção</span>';

      return p.length ? '<span class="badge b-amber">' + plural(p.length, 'pendência') + '</span>' : '<span class="badge b-green" style="background:none">Completo</span>';

      dados: 'Identificação e endereço',

        '. Você pode finalizar assim, mas essas pendências ficarão registradas.</div>' : '')) +
      F.card('Responsável pelo acompanhamento', F.text('revisao.respNome', 'Nome', { ph: 'Nome completo' }) + F.text('revisao.respCargo', 'Cargo', { ph: 'Ex.: Diretora' }) +
        F.row(F.text('revisao.respRF', 'RF', { ph: 'Ex.: 1234567', im: 'numeric' }), F.text('revisao.respTel', 'Telefone', { ph: '(11) 00000-0000', type: 'tel', im: 'tel' })) +
        F.text('revisao.respEmail', 'E-mail', { ph: 'email@escola.sp.gov.br', type: 'email', im: 'email' }) +
        '<div class="row mt" style="justify-content:space-between"><span class="lbl" style="margin:0">Assinatura</span>' + ass('assResp') + '</div><div class="mt">' + F.sig('revisao.assResp') + '</div>') +
      F.card('Responsável pela empresa', '<div class="row" style="justify-content:space-between"><span class="lbl" style="margin:0">Assinatura</span>' + ass('assEmpresa') + '</div><div class="mt">' + F.sig('revisao.assEmpresa') + '</div>') +
      F.card('Prioridades da unidade', '<p class="muted small" style="margin:-6px 0 0">Uma por linha, na ordem pedida pela unidade. Se ficar em branco, o relatório sugere a partir dos ambientes.</p>' +
        F.area('revisao.prioridades', '', 'Ex.: Adequação do ar-condicionado nas salas de aula 1 e 2')) +
      F.card('Observações gerais', F.area('revisao.obsGerais', '', 'Ex.: escola em funcionamento, acesso só pela portaria, retorno para medir o quadro')) +
      F.card('Relatórios', '<button class="btn btn-out-teal" data-act="go" data-to="relatorio" data-p=\'{"tipo":"completo"}\'>' + I('file', 20) + ' Visualizar relatório completo</button>' +
        '<button class="btn btn-out mt" data-act="go" data-to="relatorio" data-p=\'{"tipo":"vistoria"}\'>Visualizar relatório de vistoria</button>' +
        '<div class="ph-hint">Os relatórios ficam disponíveis para visualização. A assinatura libera a versão final.</div>',
        { badge: r.assResp && r.assEmpresa ? '<span class="badge b-green">Assinado</span>' : '<span class="badge b-amber">Não assinado</span>' });
  }
};

  <script>
'use strict';

    return '<nav class="nav"><div class="nav-in">' + it.map(x => '<button class="' + (sel === x[0] ? 'on' : '') + '" data-act="tab" data-to="' + x[0] + '">' + I(x[1], 26, 1.8) + x[2] +

      '<rect y="150" width="400" height="40" fill="#B5DAD5"/><path d="M50 62 200 14 350 62Z" fill="#1F8F86"/><rect x="60" y="62" width="280" height="96" fill="#fff"/>' +
      '<rect x="186" y="34" width="28" height="10" fill="#B5DAD5"/><rect x="88" y="80" width="26" height="22" fill="#9ED3CE"/><rect x="128" y="80" width="26" height="22" fill="#9ED3CE"/>' +
      '<rect x="246" y="80" width="26" height="22" fill="#9ED3CE"/><rect x="286" y="80" width="26" height="22" fill="#9ED3CE"/><rect x="176" y="106" width="48" height="52" fill="#17325C"/></svg>';
  },
  tagRoteiro(r, i) {
    const hoje = hojeISO();
    if (r.status === 'retorno') return '<span class="tag b-red">Retorno pendente</span>';
    if (r.status === 'em_andamento') return '<span class="tag b-teal">Em andamento</span>';

    if (r.data === hoje) return '<span class="tag b-teal">' + (i ? 'Próxima' : 'Agendada') + (r.hora ? ' · ' + r.hora : '') + '</span>';
    return '<span class="tag b-amber">Agendada ' + dataBR(r.data) + '</span>';
  },
  roteiro() {
    const D = App.data || {};
    const hoje = hojeISO();
    const V = App.V && App.V.status === 'em_andamento' ? App.V : null;
    const ativoId = V ? V.escolaId : null;
    const ord = r => r.status === 'em_andamento' ? 0 : r.data === hoje && r.status === 'agendada' ? 1 : r.status === 'retorno' ? 2 : r.data > hoje ? 3 : 9;
    return (D.roteiro || []).filter(r => ord(r) < 9 && r.escolaId !== ativoId)
      .sort((a, b) => ord(a) - ord(b) || String(a.data).localeCompare(b.data) || String(a.hora).localeCompare(b.hora));

  cartaoEscola(r, proxima) {

      '<div class="ad">' + esc([e.logradouro && (e.logradouro.replace(/^Rua\s/, 'R. ') + (e.numero ? ', ' + e.numero : '')), 'DRE ' + e.dre].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="tags">' + Views.tagRoteiro(r, proxima) + (r.status === 'retorno' && r.nota ? '<span class="tag b-gray">' + esc(r.nota) + '</span>' : '<span class="tag b-gray">' + (amb || 0) + ' ambientes</span>') + '</div></span>' +
      '<span class="chev">' + I('right') + '</span></button>';

  stats() {
    const s = (App.data || {}).stats || {};

      '<button data-act="tab" data-to="pendencias"><b class="c-red">' + (s.pendentes || 0) + '</b><span>Pendentes</span></button></div>';

  listaPendencias() {
    const D = App.data || {};

        '<div class="kick">Vistoria em andamento' + (V.codigo ? ' · ' + esc(V.codigo) : '') + '</div><h2>' + esc(V.d.dados.nome || e.nome) + '</h2>' +

        '<div class="counts"><div><b>' + c.fotos + '</b><span>fotos adicionadas</span></div><div><b>' + c.ambientes + '</b><span>ambientes adicionados</span></div><div><b>' + c.docs + '</b><span>documentos adicionados</span></div></div>' +
        (pend.length ? '<div class="alert-t">' + plural(pend.length, 'pendência aberta', 'pendências abertas') + ' · ' + esc(pend[0].descricao) + '</div>' : '<div class="alert-t" style="color:var(--green)">Nenhuma pendência aberta</div>') +
        '<button class="btn btn-navy btn-lg" data-act="continuar">' + I('arrow') + ' Continuar vistoria</button></div></section>';

        const ia = rot.findIndex(r => r.escolaId === a.id), ib = rot.findIndex(r => r.escolaId === b.id);
        return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.nome.localeCompare(b.nome);
      });
      topo = '<section class="card accent-gray"><h2 style="margin:0;font-size:24px">Iniciar vistoria</h2><p class="muted" style="margin:4px 0 14px">Escolha a escola e faça o check-in para começar.</p>' +
        '<span class="lbl">Escola</span><select class="inp" id="selEscola">' + escolas.map(e => '<option value="' + e.id + '"' + (e.id === sel ? ' selected' : '') + '>' + esc(e.nome) + '</option>').join('') + '</select>' +
        '<button class="btn btn-teal btn-lg mt" data-act="checkin">' + I('check') + ' Fazer check-in</button></section>';
    }
    const rot = Views.roteiro();
    let primeiroHoje = true;

      header: Views.hdrApp(),
      body: topo + Views.stats() +
        '<div class="sec-t"><h2>Roteiro de hoje · ' + dataBR(hojeISO()) + '</h2><button class="btn btn-navy btn-sm" style="border-radius:99px;width:auto" data-act="go" data-to="programacao">' + I('calendar', 18) + ' Programação</button></div>' +
        (rot.length ? rot.map(r => {
          const prox = r.data === hojeISO() && r.status === 'agendada' && primeiroHoje && (V || (D.equipe || {}).status === 'em_transito');
          if (r.data === hojeISO() && r.status === 'agendada') primeiroHoje = false;
          return Views.cartaoEscola(r, prox);
        }).join('') : '<div class="empty">' + I('school', 36) + '<div>Nenhuma escola no roteiro.</div></div>'),
      nav: 'home', fab: fab,
      after() {
        const s = $('#selEscola');
        if (s) s.onchange = () => { App._escolaSel = s.value; };

  cartaoTransito(e, eq) {
    return '<section class="card accent-amber"><div class="row" style="align-items:flex-start"><span class="avatar" style="width:24px;height:24px;background:var(--amber-l);margin-top:6px"><i style="width:12px;height:12px;border-radius:50%;background:var(--amber);display:block"></i></span>' +
      '<span style="flex:1"><b style="font-size:19px">Equipe em trânsito</b><div class="muted small">' + esc(eq.nome) + (eq.statusDesde ? ' · saiu às ' + hora(eq.statusDesde) : '') + '</div></span><span class="badge b-amber">Em trânsito</span></div>' +
      '<div id="rotaTransito" class="mt"><div class="map">' + Views.mapaIlustrativo() + '<span class="lbl-m">Calculando rota…</span></div></div>' +
      '<div class="eta" style="grid-template-columns:1.4fr 1fr;text-align:left"><div><small>DESTINO</small><b>' + esc(semPrefixo(e.nome)) + '</b></div><div style="padding-left:14px"><small>CHEGADA PREVISTA</small><b data-eta>--:--</b></div></div>' +
      '<div class="navapps"><button class="btn btn-out-teal" data-act="maps" data-id="' + e.id + '"><span class="gdot"></span>Google Maps</button><button class="btn btn-out-teal" data-act="waze" data-id="' + e.id + '"><span class="wdot"></span>Waze</button></div>' +

  /** Rota com o serviço Maps do Apps Script; cai no mapa ilustrativo se faltar GPS/rede. */
  async carregarRota(escolaId, sel) {
    const alvo = $(sel);
    if (!alvo) return;
    const pos = await Geo.get(6000);
    const k = 'rota:' + escolaId;
    let r = App._rotas && App._rotas[k];
    if (!r || Date.now() - r._t > 180000) {
      try {
        r = await Api.run('rota', { escolaId: escolaId, lat: pos && pos.lat, lng: pos && pos.lng, salvarEta: true });
        r._t = Date.now();
        (App._rotas = App._rotas || {})[k] = r;
      } catch (e) { r = null; }
    }
    const box = $(sel);
    if (!box) return;
    box.innerHTML = '<div class="map">' + (r && r.mapa ? '<img src="' + r.mapa + '" alt="Mapa da rota">' : Views.mapaIlustrativo()) +
      '<span class="lbl-m">' + (r && r.mapa ? 'Google Maps' : 'Mapa ilustrativo') + '</span></div>' +
      (box.dataset.full && r && r.min ? '<div class="eta"><div><small>Tempo previsto</small><b>' + r.min + ' min</b></div><div><small>Distância</small><b>' + fmt(r.km, 1) + ' km</b></div><div><small>Chegada prevista</small><b>' + hora(r.chegada) + '</b></div></div>' : '');
    $$('[data-eta]').forEach(el => { el.textContent = r && r.chegada ? hora(r.chegada) : '--:--'; });
  },

  /* ───── Escolas ───── */
  escolas() {
    const D = App.data || {};
    const f = App._filtroEsc || 'todas';
    const q = (App._buscaEsc || '').toLowerCase();
    const rotPor = {};
    (D.roteiro || []).forEach(r => { if (!rotPor[r.escolaId] || r.data >= rotPor[r.escolaId].data) rotPor[r.escolaId] = r; });
    const lista = (D.escolas || []).filter(e => {
      const st = (rotPor[e.id] || {}).status || e.status;
      if (f === 'hoje' && !(rotPor[e.id] && rotPor[e.id].data === hojeISO())) return false;
      if (f === 'pendentes' && st !== 'retorno') return false;
      if (f === 'concluidas' && st !== 'concluida') return false;
      if (f === 'aguardando' && st !== 'agendada') return false;
      return !q || (e.nome + ' ' + e.dre + ' ' + e.bairro + ' ' + e.cie).toLowerCase().indexOf(q) >= 0;
    }).sort((a, b) => a.nome.localeCompare(b.nome));
    const fil = [['todas', 'Todas'], ['hoje', 'Hoje'], ['aguardando', 'Aguardando'], ['pendentes', 'Pendentes'], ['concluidas', 'Concluídas']];
    return {
      header: Views.hdrApp(),
      body: '<div class="search">' + I('search', 20) + '<input class="inp" id="busca" placeholder="Buscar escola, DRE, bairro ou CIE" value="' + esc(App._buscaEsc || '') + '"></div>' +
        '<div class="chips sm" style="margin-bottom:14px">' + fil.map(x => '<button class="chip' + (f === x[0] ? ' on' : '') + '" data-act="filtroEsc" data-f="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
        '<div id="listaEsc">' + (lista.length ? lista.map(e => Views.cartaoEscola(rotPor[e.id] || { escolaId: e.id, status: e.status, data: '' }, false)).join('') : '<div class="empty">Nenhuma escola encontrada.</div>') + '</div>',
      nav: 'escolas',
      after() {
        const b = $('#busca');
        b.oninput = () => {
          App._buscaEsc = b.value;
          clearTimeout(b._t);
          b._t = setTimeout(() => { const pos = b.selectionStart; App.rerender(); const nb = $('#busca'); nb.focus(); nb.setSelectionRange(pos, pos); }, 200);
        };
      }
    };
  },

  /* ───── Etapas da vistoria ───── */
  etapa(p) {
    const V = App.V;
    if (!V || V.status !== 'em_andamento') { setTimeout(() => Router.reset('home'), 0); return { body: '' }; }
    const k = p.k || V.etapa || 'dados';
    const i = ETAPAS.findIndex(e => e.k === k);
    const et = ETAPAS[i];
    const total = ETAPAS.length - 1;
    V.etapa = k;
    const prev = ETAPAS[i - 1], next = ETAPAS[i + 1];
    const progresso = '<div class="prog">' + ETAPAS.map((e, j) => '<button class="' + (j < i ? 'done' : j === i ? 'cur' : '') + '" data-act="etapaIr" data-to="' + e.k + '" aria-label="' + e.t + '"></button>').join('') + '</div>' +
      '<div class="prog-lbl"><span>' + (prev ? prev.n : '') + '</span><b>' + et.n + '</b><span>' + (next ? next.n : 'Check-out') + '</span></div>';
    const header = '<header class="whdr"><div class="whdr-row"><button class="back" data-act="back" aria-label="Voltar ao início">' + I('left') + '</button>' +
      '<span style="min-width:0;flex:1"><div class="kicker">' + (k === 'revisao' ? 'Vistoria · revisão final' : 'Vistoria · etapa ' + (i + 1) + ' de ' + total) + '</div><div class="ttl">' + esc(V.d.dados.nome) + '</div></span>' +
      '<span class="sync hidden" data-sync></span></div>' + progresso + '</header>';
    const body = Etapas[k]() + '<button class="btn btn-out-red mt" data-act="go" data-to="cancelar">Cancelar vistoria</button>';

      (k === 'revisao' ? '<button class="btn btn-navy" data-act="finalizar">Finalizar vistoria</button>' :
        '<button class="btn btn-navy" data-act="etapaProx">' + (next && next.k === 'revisao' ? 'Revisar e finalizar' : 'Salvar e continuar') + '</button>');
    return { header: header, body: body, foot: foot, after: k === 'revisao' ? iniciarAssinaturas : null };
  },

    const f = App.form;

      ['Não houve tempo para finalizar', 'A equipe volta para completar as etapas'], ['Aguardando autorização da DRE', 'Falta liberação para alguma área'],

          (f.motivo === 'Outro motivo' ? F.text('@outro', '', { ph: 'Descreva o motivo' }) : '')) +

            '<div class="mt"></div><button class="ph-wide' + (foto ? ' has' : '') + '" data-act="foto" data-slot="cancelamento.registro" data-etapa="cancelamento" data-rot="Registro">' +
            (foto ? '<img data-th="' + foto.id + '" alt="">' : I('camera', 28)) + '<span><b>Foto do registro</b><small>' + (foto ? 'Foto anexada · toque para ver' : 'Opcional · ex.: portão fechado, ofício') + '</small></span></button>') : '') +

          (f.recusa ? F.text('@quem', 'Quem recusou', { ph: 'Nome e cargo' }) + F.area('@desc', 'Descreva o que foi dito', 'Resumo da recusa, com as palavras da pessoa') +
            '<div class="mt"></div>' + '<button class="ph-wide' + (foto ? ' has' : '') + '" data-act="foto" data-slot="cancelamento.registro" data-etapa="cancelamento" data-rot="Registro">' +
            (foto ? '<img data-th="' + foto.id + '" alt="">' : I('camera', 28)) + '<span><b>Foto do registro</b><small>' + (foto ? 'Foto anexada · toque para ver' : 'Opcional · ex.: documento ou ofício de recusa') + '</small></span></button>' : ''))) +

  /* ───── Visualizador de relatório ───── */
  relatorio(p) {
    const V = App.V;
    const vid = p.vistoriaId || (V && V.id);
    const completo = p.tipo === 'completo';
    const cache = App._rel && App._rel[vid + p.tipo];
    return {
      header: Views.hdrNavy(completo ? 'Relatório completo' : 'Relatório de vistoria', (V && V.d.dados.nome) || (App.escola(p.escolaId) || {}).nome || '',
        '<span id="relSt">' + (cache ? (cache.assinado ? '<span class="badge b-green" style="font-size:14px;padding:6px 12px">' + I('check', 16, 3) + ' Assinado</span>' : '<span class="badge b-amber" style="font-size:14px;padding:6px 12px">Preliminar</span>') : '') + '</span>'),
      flush: true,
      body: '<div class="rel-meta" id="relMeta">' + (cache ? Views.relMeta(cache, completo) : '<span>Gerando prévia…</span>') + '</div>' +
        '<div class="rel-stage" id="relStage"><div class="skel" style="position:absolute;inset:24px;border-radius:4px"></div></div>',
      footOne: true,
      foot: '<div id="relActs">' + (completo ? '<button class="btn btn-teal btn-lg" data-act="pdf" data-tipo="completo">' + I('download') + ' Baixar arquivo PDF</button>' :
        '<button class="btn btn-out btn-lg" data-act="pdf" data-tipo="vistoria">' + I('download') + ' Baixar PDF</button>' +
        '<button class="btn btn-teal btn-lg mt" data-act="enviarCopia">' + I('mail') + ' Enviar cópia para a unidade</button>') +
        '<div class="small muted mt" id="relInfo" style="text-align:center"></div></div>',
      async after() {
        if (!vid) return;
        const set = r => {
          const st = $('#relStage');
          if (!st) return;
          $('#relMeta').innerHTML = Views.relMeta(r, completo);
          $('#relSt').innerHTML = r.assinado ? '<span class="badge b-green" style="font-size:14px;padding:6px 12px">' + I('check', 16, 3) + ' Assinado</span>' : '<span class="badge b-amber" style="font-size:14px;padding:6px 12px">Preliminar</span>';
          st.innerHTML = '<iframe id="relFrame" title="Relatório"></iframe>' +
            '<div class="zoom"><button data-act="zoom" data-d="-1" aria-label="Diminuir">–</button><span id="zv">100%</span><button data-act="zoom" data-d="1" aria-label="Aumentar">+</button></div>' +
            (completo ? '<div class="pgpill" id="pgpill">Página 1 / ' + r.paginas + ' · deslize →</div>' : '');
          const fr = $('#relFrame');
          fr.srcdoc = r.html;
          fr.onload = () => {
            App._zoom = 1;
            Views.relZoom(0);
            const doc = fr.contentDocument;
            if (completo && doc) {
              doc.body.addEventListener('scroll', () => {
                const pg = doc.querySelector('.pg');
                const w = pg ? pg.getBoundingClientRect().width + 14 * App._zoom : 1;
                const n = Math.min(r.paginas, Math.round(doc.body.scrollLeft / w) + 1);
                const pill = $('#pgpill'); if (pill) pill.textContent = 'Página ' + n + ' / ' + r.paginas + (n < r.paginas ? ' · deslize →' : '');
              }, { passive: true });
            }
          };
        };
        if (cache) set(cache);
        try {
          await Sync.flush(45000);
          const r = await Api.run('relatorio', { vistoriaId: vid, tipo: p.tipo });
          (App._rel = App._rel || {})[vid + p.tipo] = r;
          if (App.route && App.route.name === 'relatorio') set(r);
        } catch (e) {
          const st = $('#relStage');
          if (st && !cache) st.innerHTML = '<div class="empty" style="color:#43536B">' + I('cloud', 40) + '<div><b>Prévia indisponível</b></div><div class="small">' + esc(e.message) + '</div><button class="btn btn-navy btn-sm mt" data-act="relRetry">Tentar de novo</button></div>';
        }
      }
    };
  },
  relMeta(r, completo) {
    return '<span>Gerado em <b>' + esc(r.geradoEm) + '</b></span><span>' + (completo ? '<b>' + r.paginas + ' páginas</b>' : 'Folha <b>01/01</b>') + ' · PDF</span>';
  },
  relZoom(d) {
    const fr = $('#relFrame');
    if (!fr || !fr.contentDocument) return;
    const base = Math.min(1, (fr.clientWidth - 24) / 794);
    App._zoom = Math.max(0.5, Math.min(2.5, (App._zoom || 1) + d * 0.25));
    const z = base * App._zoom;
    const doc = fr.contentDocument;
    doc.documentElement.style.zoom = z;
    doc.body.style.padding = '12px';
    $('#zv').textContent = Math.round(App._zoom * 100) + '%';
  },

  /* ───── Vistoria finalizada ───── */
  finalizada() {
    const F0 = App.final || {};
    const L = App.finalLocal || LS.get('finalLocal') || {};
    const pronto = !!App.final;
    const e = App.escola(F0.escolaId || L.escolaId) || {};
    const eq = (App.data || {}).equipe || {};
    const res = F0.resumo && F0.resumo.fotos !== undefined ? F0.resumo : (L.resumo || {});
    const d = F0.docs || {};
    const prox = F0.proxima ? App.escola(F0.proxima.escolaId) : null;
    const espera = '<span class="badge b-amber">' + (navigator.onLine === false ? 'Na fila' : 'Gerando…') + '</span>';
    const docRow = (t, s, badge) => '<div class="doc-row"><span><b>' + t + '</b><small>' + s + '</small></span>' + badge + '</div>';
    return {
      flush: true,
      body: '<div class="done-h"><div class="ok">' + I('check', 46, 3) + '</div><h1>Vistoria finalizada</h1><p>' + esc(e.nome || '') + ' · DRE ' + esc(e.dre || '') + '</p>' +
        '<small>Check-out registrado em ' + dataBR(F0.checkout || L.checkout, true) + '</small></div>' +
        '<div style="padding:0 16px 40px"><section class="card times"><div><small>CHECK-IN</small><b>' + hora(F0.checkin || L.checkin) + '</b></div><div><small>CHECK-OUT</small><b>' + hora(F0.checkout || L.checkout) + '</b></div><div><small>DURAÇÃO</small><b>' + duracao(F0.checkin || L.checkin, F0.checkout || L.checkout) + '</b></div></section>' +
        '<section class="card accent-amber row"><span style="flex:1"><b style="font-size:17px">Status da equipe atualizado</b><div class="muted small">' + esc(eq.nome || '') + ' · ' + esc((eq.membros || []).map(m => m.split(' ')[0]).join(' e ')) + '</div></span>' +
          (pronto ? '<span class="badge ' + (F0.equipeStatus === 'em_transito' ? 'b-amber">Em trânsito' : 'b-green">Disponível') + '</span>' : espera) + '</section>' +
        '<section class="card"><div class="counts" style="margin:0"><div><b>' + (res.ambientes || 0) + '</b><span>ambientes</span></div><div><b>' + (res.fotos || 0) + '</b><span>fotos</span></div><div><b class="c-amber">' + (res.pendencias || 0) + '</b><span>pendências</span></div></div></section>' +
        '<section class="card"><div class="lbl" style="font-weight:700;letter-spacing:.6px;margin:0 0 4px">ENVIO E DOCUMENTOS</div>' +
          docRow('Relatório de vistoria', pronto ? (F0.assinado ? 'Assinado por ' + esc(F0.assinantes.join(' e ')) : 'Versão preliminar · sem assinaturas') : 'Aguardando servidor',
            pronto ? (d.vistoria && d.vistoria.erro ? '<span class="badge b-red">Erro</span>' : F0.assinado ? '<span class="badge b-green">Assinado</span>' : '<span class="badge b-amber">Gerado</span>') : espera) +
          docRow('Relatório completo', pronto && d.completo && !d.completo.erro ? d.completo.paginas + ' páginas · PDF ' + d.completo.tamanho : 'PDF com fotos e pré-dimensionamento',
            pronto ? (d.completo && d.completo.erro ? '<span class="badge b-red">Erro</span>' : '<span class="badge b-green">Gerado</span>') : espera) +
          docRow('Cópia para a unidade', pronto ? (F0.copia.enviada ? 'Enviada às ' + hora(F0.copia.em) + ' para ' + esc(F0.copia.para) : F0.copia.erro ? esc(F0.copia.erro) : 'Não enviada · envie pela tela do relatório') : 'Envio automático após assinatura',
            pronto ? (F0.copia.enviada ? '<span class="badge b-green">Enviado</span>' : '<span class="badge b-gray">Pendente</span>') : espera) +
          docRow('Sincronização', Sync.q.length ? plural(Sync.q.length, 'item', 'itens') + ' na fila' : 'Dados e fotos no servidor', Sync.q.length ? '<span class="badge b-amber">' + (navigator.onLine === false ? 'Offline' : 'Enviando') + '</span>' : '<span class="badge b-green">OK</span>') +
        '</section>' +
        (prox ? '<section class="next-card"><div class="kick">Próxima escola do roteiro · hoje às ' + esc(F0.proxima.hora || '') + '</div><h3 style="margin:4px 0 2px;font-size:20px">' + esc(prox.nome) + '</h3>' +
          '<div class="muted">' + esc([prox.logradouro, prox.numero].filter(Boolean).join(', ') + ' · DRE ' + prox.dre) + '</div>' +
          '<div id="rotaFinal" data-full="1" class="mt"><div class="map">' + Views.mapaIlustrativo() + '<span class="lbl-m">Calculando rota…</span></div></div>' +
          '<div class="small muted" style="text-align:center;font-weight:700;margin:6px 0 8px">Abrir rota no aplicativo</div>' +
          '<div class="navapps"><button class="btn btn-out-teal" data-act="maps" data-id="' + prox.id + '"><span class="gdot"></span>Google Maps</button><button class="btn btn-out-teal" data-act="waze" data-id="' + prox.id + '"><span class="wdot"></span>Waze</button></div>' +
          '<p class="muted small" style="text-align:center;margin:10px 0 0">O check-in é feito ao chegar na unidade.</p></section>' : '') +
        (pronto ? '<button class="btn btn-out btn-lg" data-act="verRelatorios">Ver relatórios</button>' : '') +
        '<button class="btn btn-out btn-lg mt" data-act="tab" data-to="home">' + I('left') + ' Voltar ao início</button></div>',
      after() { if (prox) Views.carregarRota(prox.id, '#rotaFinal'); }
    };
  }
};

/* ───── Ações das telas ───── */
Object.assign(Act, {
  continuar() { Sheet.close(true); const V = App.V; if (V) Router.go('etapa', { k: V.etapa || 'dados' }); },
  irEtapa(el) { Router.go('etapa', { k: el.dataset.to }); },
  escolaAbrir(el) { Views.escolaSheet(el.dataset.id); },
  filtroEsc(el) { App._filtroEsc = el.dataset.f; App.rerender(); },
  relRetry() { App.rerender(); },
  zoom(el) { Views.relZoom(Number(el.dataset.d)); },

  async checkinEscola(el) {

    Sheet.close(true);
    const btn = el.tagName ? el : $('[data-act=checkin]');
    carregando(btn, true, 'Localizando');

    carregando(btn, false);
    const raio = ((App.data || {}).cfg || {}).raioCheckin || 400;
    if (pos && e.lat && e.lng) {

    const V = Vist.novo(e, pos);
    App.V = V;
    Vist.salvar(true);
    await Sync.add('checkin', { id: V.id, escolaId: e.id, checkin: V.checkin, lat: V.lat, lng: V.lng });
    ETAPAS.forEach(x => { Vist.mudou(x.k, false, true); Vist.tocar(x.k, true); });
    const D = App.data;
    const rot = (D.roteiro || []).find(r => r.escolaId === e.id && r.status !== 'concluida');

    if (!(await confirmar({ titulo: 'Marcar como resolvida?', sim: 'Resolvida' }))) return;

    D.pendencias = (D.pendencias || []).filter(p => p.id !== el.dataset.id);

  sair() { App.sair(); },
  senha() {

      '<button class="btn btn-navy mt" type="submit">Salvar nova senha</button></form>', { focus: true });
    $('#fSenha').onsubmit = async ev => {
      ev.preventDefault();
      const f = ev.target;
      if (f.nova.value !== f.rep.value) { toast('As senhas não conferem.', 'warn'); return; }
      const b = $('button', f);

      toast('PDF gerado · ' + r.tamanho, 'ok');

  enviarCopia() {

  verRelatorios() {

  abrirRel(el) {

});

Views.etapa.onBack = () => { if (App.V) Vist.tocar(App.route.params.k || App.V.etapa, true); };
Views.ambiente.onBack = () => {
  const a = App.form;
  if (a && a._novo) Object.values(App.V.fotos).filter(f => f.ref === a.id).forEach(f => Fotos.remover(f.id));
  App.form = null;
};
Views.cancelar.onBack = () => { App.form = null; };

/* Resultado da finalização (chega pela fila, mesmo se o envio ocorreu depois, offline). */
Sync.on('finalizar', r => {
  App.final = r; LS.set('final', r);
  if (App.V && App.V.id === r.id) { App.V = null; Vist.salvar(true); }
  LS.del('finalLocal');
  const D = App.data;
  if (D) {
    const rot = (D.roteiro || []).find(x => x.escolaId === r.escolaId && x.status !== 'concluida');
    if (rot) rot.status = 'concluida';
    D.stats.concluidas++; D.stats.aguardando = Math.max(0, D.stats.aguardando - 1);
    D.equipe.status = r.equipeStatus; D.equipe.destinoEscolaId = r.proxima ? r.proxima.escolaId : ''; D.equipe.statusDesde = new Date().toISOString();
    LS.set('boot', D);
  }
  if (App.route && App.route.name === 'finalizada') App.rerender();
  else toast('Vistoria sincronizada e relatórios gerados', 'ok');
  App.refresh();
});
Sync.on('finalizar:erro', e => { if (App.V) { App.V.status = 'em_andamento'; Vist.salvar(true); } toast('Não foi possível finalizar: ' + e.message, 'err', 6000); Router.reset('home'); });
Sync.on('cancelar', () => App.refresh());

  <script>
'use strict';
/* ═══════════════════════ VistAR · telas complementares ═══════════════════════
   Login, primeiro acesso, configurações, programação, painel de escolas,
   detalhe de escola e de vistoria, pendências de retorno, galeria de fotos,
   visualizador de fotos e assinatura em tela cheia. */

const ST_ESC = {
  concluida: ['Concluídas', 'var(--c-ok)'], andamento: ['Em andamento', 'var(--c-and)'], agendada: ['Agendadas', 'var(--c-ag)'],
  retorno: ['Retorno pendente', 'var(--c-ret)'], nao_iniciada: ['Não iniciadas', 'var(--c-ni)']
};
const SITUACAO = {
  retorno_solicitado: ['Retorno solicitado', 'var(--amber)', 'b-amber'], nao_concluida: ['Não concluída no dia', 'var(--teal)', 'b-teal'],
  sem_acesso: ['Sem acesso', '#8A9AB0', 'b-gray'], recusa: ['Recusa da direção', 'var(--red)', 'b-red'],
  aguardando_autorizacao: ['Aguardando autorização', 'var(--c-and)', 'b-blue'], area_interditada: ['Área interditada', 'var(--amber)', 'b-amber'],
  pendencias: ['Pendências da vistoria', 'var(--amber)', 'b-amber'], outro: ['Retorno', '#8A9AB0', 'b-gray']
};
const pct = (x, c) => fmt((x || 0) * 100, c || 0) + '%';
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const dISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dDe = iso => new Date(iso + 'T12:00:00');
const somaD = (iso, n) => { const d = dDe(iso); d.setDate(d.getDate() + n); return dISO(d); };
const minutos = h => { const m = String(h || '').match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : null; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const durTxt = m => Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');

/** Busca no servidor com cache (memória + aparelho): mostra o que tem e atualiza. */
const Dados = {
  mem: {},
  obter(chave, acao, payload, render, opts) {
    const c = this.mem[chave] || (opts && opts.semLS ? null : LS.get('c:' + chave));
    if (c) render(c, true);
    return Api.run(acao, payload).then(d => {
      this.mem[chave] = d;
      if (!(opts && opts.semLS)) LS.set('c:' + chave, d);
      render(d, false);
      return d;
    }).catch(e => { if (e.code === 'AUTH') return App.authLost(); if (!c) render(null, false, e); });
  },
  limpar(prefixo) { Object.keys(this.mem).forEach(k => { if (k.indexOf(prefixo) === 0) delete this.mem[k]; }); }
};
function encher(sel, html) { const el = $(sel); if (el) { el.innerHTML = html; Thumbs.hydrate(); } return el; }
function erroBox(e) { return '<div class="empty">' + I('cloud', 36) + '<div><b>Sem dados por enquanto</b></div><div class="small">' + esc(e ? e.message : 'Conecte-se à internet para carregar.') + '</div><button class="btn btn-out btn-sm mt" data-act="rerender">' + I('refresh', 16) + ' Tentar de novo</button></div>'; }
const SKEL = '<div class="skel" style="height:180px;margin-bottom:14px"></div><div class="skel" style="height:120px;margin-bottom:14px"></div><div class="skel" style="height:120px"></div>';

/* ═════════════ Biometria (trava local do aparelho via WebAuthn) e lembretes ═════════════ */
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Bio = {
  async disponivel() {
    try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; }
  },
  async ativar() {
    const u = (App.data || {}).usuario || {};
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'VistAR' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: u.email || u.matricula || 'vistar', displayName: u.nome || 'VistAR' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    LS.set('bioId', b64(cred.rawId));
  },
  async desbloquear() {
    const id = LS.get('bioId');
    if (!id) return true;
    try {
      await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ type: 'public-key', id: deB64(id) }], userVerification: 'required', timeout: 60000 } });
      return true;
    } catch (e) { return false; }
  }
};

const Lembretes = {
  timers: [],
  agendar() {
    this.timers.forEach(clearTimeout); this.timers = [];
    if (!Prefs.get('lembrete') || !window.Notification || Notification.permission !== 'granted') return;
    const D = App.data || {};
    const hoje = hojeISO();
    (D.roteiro || []).filter(r => r.data === hoje && r.status === 'agendada' && r.hora).forEach(r => {
      const quando = dDe(hoje); const m = minutos(r.hora);
      quando.setHours(Math.floor(m / 60), m % 60 - 30, 0, 0);
      const ms = quando - Date.now();
      if (ms > 0 && ms < 18 * 3600e3) this.timers.push(setTimeout(() => {
        try { new Notification('Visita em 30 min', { body: ((App.escola(r.escolaId) || {}).nome || '') + ' às ' + r.hora }); } catch (e) { toast('Visita em 30 min · ' + ((App.escola(r.escolaId) || {}).nome || '')); }
      }, ms));
    });
  }
};

      '<span class="lbl">Senha</span><div class="in-ic">' + I('lock', 20) + '<input class="inp" name="senha" type="password" autocomplete="current-password" required><button type="button" class="eye" data-act="olho" aria-label="Mostrar senha">' + I('eye', 20) + '</button></div>' +
      '<div class="row mt" style="justify-content:space-between"><button type="button" class="check on" id="manter" data-act="manterCon" style="width:auto;padding:0"><span class="box">' + I('check', 16, 3) + '</span><span style="font-weight:500">Manter conectado</span></button>' +

    after() {

        } catch (e) { carregando(btn, false); toast(e.net ? 'Sem conexão. O primeiro acesso precisa de internet.' : e.message, 'err', 4000); }
      };
    }

};

  return {

/* ═════════════ Painel de escolas (aba Escolas e supervisão) ═════════════ */
const Graf = {
  donut(cont, total) {
    const ordem = ['concluida', 'andamento', 'agendada', 'retorno', 'nao_iniciada'];
    const R = 52, C = 2 * Math.PI * R, gap = 3;
    let off = 0;
    const arcos = ordem.filter(k => cont[k]).map(k => {
      const len = cont[k] / (total || 1) * C;
      const a = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + ST_ESC[k][1] + '" stroke-width="18" stroke-dasharray="' + Math.max(0, len - gap) + ' ' + (C - Math.max(0, len - gap)) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"><title>' + ST_ESC[k][0] + ': ' + cont[k] + '</title></circle>';
      off += len; return a;
    }).join('');
    return '<svg viewBox="0 0 140 140" role="img" aria-label="Situação das escolas">' + arcos + '<text x="70" y="70" text-anchor="middle" fill="#fff" font-size="27" font-weight="800" font-family="Inter,Arial">' + pct((cont.concluida || 0) / (total || 1)) + '</text>' +
      '<text x="70" y="90" text-anchor="middle" fill="#C9D6E6" font-size="11" font-family="Inter,Arial">concluído</text></svg>';
  },
  /** Acumulado (%) x meta: uma escala só; barras diárias ficam num gráfico separado abaixo. */
  evolucao(serie) {
    if (!serie.length) return '';
    const W = 340, H = 130, padL = 30, padB = 18, w = W - padL - 6, h = H - padB - 8;
    const x = i => padL + (serie.length === 1 ? w / 2 : i * w / (serie.length - 1));
    const y = v => 8 + h - v * h;
    const max = Math.max(0.25, Math.ceil(Math.max.apply(null, serie.map(s => Math.max(s.pct, s.meta || 0))) * 4) / 4);
    const yy = v => y(v / max);
    const linha = serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yy(s.pct).toFixed(1)).join(' ');
    const meta = serie[0].meta !== null ? serie.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yy(s.meta).toFixed(1)).join(' ') : '';
    const grid = [0, 0.5, 1].map(f => '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="' + yy(max * f) + '" y2="' + yy(max * f) + '" stroke="var(--line)"/><text x="' + (padL - 6) + '" y="' + (yy(max * f) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + Math.round(max * f * 100) + '%</text>').join('');
    const ticks = serie.map((s, i) => i % Math.ceil(serie.length / 7) === 0 || i === serie.length - 1 ? '<text x="' + x(i) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + Number(s.d.slice(8)) + '</text>' : '').join('');
    const last = serie[serie.length - 1];
    const barW = Math.max(3, w / serie.length - 4), mx = Math.max(1, Math.max.apply(null, serie.map(s => s.n)));
    const bars = serie.map((s, i) => s.n ? '<rect x="' + (x(i) - barW / 2) + '" y="' + (44 - s.n / mx * 36) + '" width="' + barW + '" height="' + (s.n / mx * 36) + '" rx="3" fill="var(--teal)"/>' : '').join('');
    const hits = serie.map((s, i) => '<rect class="hit" data-i="' + i + '" x="' + (x(i) - w / serie.length / 2) + '" y="0" width="' + (w / serie.length) + '" height="' + H + '" fill="transparent"/>').join('');
    return '<div class="chart" data-serie="' + esc(JSON.stringify(serie)) + '"><svg viewBox="0 0 ' + W + ' ' + H + '">' + grid + ticks +
        (meta ? '<path d="' + meta + '" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 4"/>' : '') +
        '<path d="' + linha + '" fill="none" stroke="var(--navy)" stroke-width="2.4" style="stroke:var(--ink)"/>' +
        '<circle cx="' + x(serie.length - 1) + '" cy="' + yy(last.pct) + '" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>' +
        '<text x="' + (x(serie.length - 1) - 8) + '" y="' + (yy(last.pct) - 10) + '" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">' + pct(last.pct) + '</text>' + hits + '</svg>' +
      '<div class="small muted" style="margin:10px 0 2px;font-weight:600">Concluídas por dia</div><svg viewBox="0 0 ' + W + ' 48">' + bars + '<line x1="' + padL + '" x2="' + (W - 6) + '" y1="44" y2="44" stroke="var(--line)"/></svg><div class="tip"></div></div>';
  },
  ligar() {
    $$('.chart[data-serie]').forEach(ch => {
      const serie = JSON.parse(ch.dataset.serie);
      const tip = $('.tip', ch);
      $$('.hit', ch).forEach(r => {
        const mostra = () => {
          const s = serie[r.dataset.i];
          const b = r.getBoundingClientRect(), c = ch.getBoundingClientRect();
          tip.innerHTML = '<b>' + dataBR(s.d) + '</b> · ' + s.n + ' concluída(s)<br>Acumulado ' + pct(s.pct) + (s.meta !== null ? ' · meta ' + pct(s.meta) : '');
          tip.style.left = (b.left - c.left + b.width / 2) + 'px'; tip.style.top = '30px'; tip.style.display = 'block';
        };
        r.addEventListener('pointerenter', mostra); r.addEventListener('pointerdown', mostra);
        r.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
      });
    });
  },
  mapa(pontos, alt) {
    if (!pontos.length) return '<div class="empty small">Escolas sem coordenadas. Use o menu VistAR › Geocodificar escolas na planilha.</div>';
    const la = pontos.map(p => p.lat), ln = pontos.map(p => p.lng);
    const mnA = Math.min.apply(null, la), mxA = Math.max.apply(null, la), mnL = Math.min.apply(null, ln), mxL = Math.max.apply(null, ln);
    const px = p => 6 + (mxL === mnL ? 0.5 : (p.lng - mnL) / (mxL - mnL)) * 88, py = p => 8 + (mxA === mnA ? 0.5 : (mxA - p.lat) / (mxA - mnA)) * 80;
    return '<div class="mapdots"' + (alt ? ' style="aspect-ratio:auto;height:' + alt + 'px"' : '') + '>' + Views.mapaIlustrativo().replace(/<path d="M112[^>]*\/>|<circle[^>]*\/>|<path d="M478[^>]*\/>|<text[^>]*>[^<]*<\/text>/g, '') +
      pontos.map(p => '<button style="left:' + px(p) + '%;top:' + py(p) + '%;background:' + (ST_ESC[p.st] || ST_ESC.nao_iniciada)[1] + '" data-act="' + (p.act || 'escolaAbrir') + '" data-id="' + p.id + '" title="' + esc(p.nome) + '" aria-label="' + esc(p.nome) + '"></button>').join('') +
      '<span class="lbl-m" style="position:absolute;right:8px;bottom:8px;background:var(--card);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px">Mapa ilustrativo</span></div>';
  },
  legenda(ks) { return '<div class="leg">' + (ks || Object.keys(ST_ESC)).map(k => '<span><i style="background:' + ST_ESC[k][1] + '"></i>' + ST_ESC[k][0].replace(/s$/, '').replace('Concluída', 'Concluída') + '</span>').join('') + '</div>'; }
};

    const v = (n, s) => n === null || n === undefined ? '' : '<small class="' + (n >= 0 ? 'up' : 'down') + '">' + (n >= 0 ? '▲ ' : '▼ ') + Math.abs(n) + '% ' + s + '</small>';

      '<div class="grid3" style="margin-bottom:14px">' +
        '<div class="card kpi-mini" style="margin:0;padding:12px"><div class="kh">Ambientes</div><b>' + fmt(d.kpis.ambientes) + '</b>' + v(d.kpis.ambientesVar, per) + '</div>' +
        '<div class="card kpi-mini" style="margin:0;padding:12px"><div class="kh">Fotos</div><b>' + fmt(d.kpis.fotos) + '</b>' + v(d.kpis.fotosVar, per) + '</div>' +
        '<div class="card kpi-mini" style="margin:0;padding:12px"><div class="kh">Assinados</div><b>' + d.kpis.assinados + '</b><small class="up">' + pct(d.kpis.assinadosPct) + ' das concluídas</small></div></div>' +

        d.porDre.map(x => { const r = x.concluidas / (x.total || 1); return '<div class="hbar"><div class="t"><span>DRE ' + esc(x.dre) + '</span><span><b style="color:' + corDre(r) + '">' + pct(r) + '</b><small>' + x.concluidas + ' de ' + x.total + '</small></span></div><div class="tr"><i style="width:' + r * 100 + '%;background:' + corDre(r) + '"></i></div></div>'; }).join('') + '</section>' +
      '<section class="card"><h3 style="margin:0">Situação das escolas</h3><div class="muted small">' + d.total + ' unidades' + (d.dre ? ' da DRE ' + esc(d.dre) : ' do contrato') + '</div>' +
        '<div class="stack">' + ['concluida', 'andamento', 'agendada', 'retorno', 'nao_iniciada'].filter(k => c[k]).map(k => '<div style="flex:' + c[k] + ';background:' + ST_ESC[k][1] + '" title="' + ST_ESC[k][0] + ': ' + c[k] + '">' + (c[k] / t >= 0.1 ? pct(c[k] / t) : '') + '</div>').join('') + '</div>' +

};

Views.escolas = () => {

      '<div class="sec-t"><h2>' + (st.busca ? 'Resultados' : 'Escolas') + ' · ' + lista.length + '</h2></div>' +

/* ═════════════ Visualizador de fotos ═════════════ */
const Visor = {
  abrir(lista, i) {
    this.lista = lista; this.i = i;
    Sheet.opts = {};
    this.render();
  },
  async src(f, grande) {
    if (f.local) {
      const it = Sync.q.find(x => x.acao === 'uploadFoto' && x.payload.id === f.fid);
      if (it && grande) return it.payload.data;
    }
    const k = 'g:' + f.fileId;
    if (grande && f.fileId) {
      if (Thumbs.mem.get(k)) return Thumbs.mem.get(k);
      try { const r = await Api.run('thumbs', { ids: [f.fileId], tamanho: 1200 }); if (r[f.fileId]) { Thumbs.mem.set(k, r[f.fileId]); return r[f.fileId]; } } catch (e) { /* offline */ }
    }
    return Thumbs.mem.get(f.id) || Thumbs.mem.get(f.fid) || (f.fileId && Thumbs.mem.get('f:' + f.fileId)) || '';
  },
  async render() {
    const f = this.lista[this.i], n = this.lista.length;

      '<div class="grid2" style="grid-template-columns:1fr 1.4fr"><button class="btn btn-out btn-lg" data-act="sigLimparBig">Limpar</button><button class="btn btn-teal btn-lg" data-act="sigOk" data-k="' + p.k + '">Confirmar assinatura</button></div>' +
      '<p class="muted small" style="text-align:center;margin-top:14px">Dica: gire o aparelho para a horizontal para ter mais espaço.</p>',
    after() {
      Geo.get(6000).then(pos => { const g = $('#sigGeo'); if (g) g.textContent = pos ? 'Localização registrada' : 'Sem localização'; });
      const box = $('#sigBig'), cv = $('canvas', box);
      const dpr = window.devicePixelRatio || 1;
      const ajustar = () => { const b = box.getBoundingClientRect(); cv.width = b.width * dpr; cv.height = b.height * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.8; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1B2F8A'; cv._n = 0; };
      ajustar();
      const g = () => cv.getContext('2d');
      let des = false, last = null;
      const pt = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
      cv.addEventListener('pointerdown', e => { des = true; last = pt(e); cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', e => {
        if (!des) return;
        const q = pt(e), c = g();
        c.beginPath(); c.moveTo(last.x, last.y); c.quadraticCurveTo(last.x, last.y, (last.x + q.x) / 2, (last.y + q.y) / 2); c.lineTo(q.x, q.y); c.stroke();
        last = q; cv._n++;
      });
      ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { des = false; }));
      window.addEventListener('orientationchange', () => setTimeout(ajustar, 300), { once: true });
    }
  };
};

/* ═════════════ Retomar vistoria de onde parou ═════════════ */
async function iniciarVistoria(e, pos, base) {
  const V = Vist.novo(e, pos);
  let fotosCopiar = [];
  if (base) {
    Object.keys(base.etapas || {}).forEach(k => { if (V.d[k]) V.d[k] = Object.assign(V.d[k], base.etapas[k].dados || {}); });
    V.d.revisao.assResp = ''; V.d.revisao.assEmpresa = '';
    (base.fotos || []).forEach(f => {
      const id = uid();
      V.fotos[id] = { id: id, etapa: f.etapa, slot: f.slot, ref: f.ref, fileId: f.fileId, legenda: f.legenda, criadoEm: f.criadoEm, st: 'ok' };
      fotosCopiar.push({ id: id, de: f.id });
      const th = Thumbs.mem.get('f:' + f.fileId); if (th) Thumbs.mem.set(id, th);
    });
    V.retomadaDe = base.id;
  }
  App.V = V;
  Vist.salvar(true);
  await Sync.add('checkin', { id: V.id, escolaId: e.id, checkin: V.checkin, lat: V.lat, lng: V.lng, retomarDe: base ? base.id : '', fotosCopiar: fotosCopiar });
  // "init" só preenche o que o servidor ainda não tem: se um colega já abriu a escola, nada dele é sobrescrito.
  ETAPAS.forEach(x => { Vist.mudou(x.k, false, true); Vist.tocar(x.k, true); });
  const D = App.data;
  const rot = (D.roteiro || []).find(r => r.escolaId === e.id && r.status !== 'concluida');
  if (rot) rot.status = 'em_andamento';
  D.equipe.status = 'em_campo'; D.equipe.destinoEscolaId = '';
  LS.set('boot', D);
  vib(20);
  toast((base ? 'Retomada' : 'Check-in') + ' às ' + hora(V.checkin) + ' · ' + curto(e.nome), 'ok');
  if (base) {
    const prim = ETAPAS.find(x => x.k !== 'revisao' && Pend.etapa(x.k).length);
    V.etapa = prim ? prim.k : 'revisao';
  }
  Router.reset('home'); Router.go('etapa', { k: V.etapa || 'dados' });
}

const ST_EQ = {
  em_campo: ['Em campo', 'b-blue', 'andamento'], em_transito: ['Em trânsito', 'b-amber', 'agendada'],
  disponivel: ['Disponível', 'b-green', 'concluida'], pausa: ['Pausa', 'b-gray', 'nao_iniciada']
};
const PERFIS = [['tecnico', 'Técnico de campo'], ['supervisor', 'Supervisor'], ['coordenacao', 'Coordenação'], ['admin', 'Administrador']];
const haQuanto = iso => {
  if (!iso) return 'sem sinal';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'agora' : m < 60 ? 'há ' + m + ' min' : m < 1440 ? 'há ' + Math.floor(m / 60) + ' h' : 'há ' + Math.floor(m / 1440) + ' d';
};

Views.nav = (orig => function (sel) {
  if (!App.supervisor()) return orig(sel);
  const n = (App._sup || {}).aValidar || 0;
  const it = [['home', 'chart', 'Painel'], ['equipesSup', 'users', 'Equipes'], ['validar', 'shield', 'Validar'], ['pendencias', 'checksq', 'Pendências']];
  return '<nav class="nav"><div class="nav-in">' + it.map(x => '<button class="' + (sel === x[0] ? 'on' : '') + '" data-act="tab" data-to="' + x[0] + '">' + I(x[1], 26, 1.8) + x[2] +
    (x[0] === 'validar' && n ? '<span class="dot">' + n + '</span>' : '') + '</button>').join('') + '</div></nav>';
})(Views.nav);

Views.home = (orig => function (p) {
  if (App.data && App.supervisor()) return Views.painelSup(p);
  return orig(p);
})(Views.home);

  const s = ST_EQ[eq.status] || ST_EQ.pausa;
  const atuais = eq.atuais || (eq.atual ? [eq.atual] : []);
  return '<section class="eq-card ' + esc(eq.status) + '"><div class="row" style="align-items:flex-start"><span style="flex:1;min-width:0"><b style="font-size:17px">' + esc(eq.nome) + '</b><div class="muted small">' + esc(eq.membros.join(' e ')) + '</div></span><span class="badge ' + s[1] + '">' + s[0] + '</span></div>' +
    (atuais.length ? atuais.map(a => '<button class="sum-row" style="border:0;padding:10px 0 4px" data-act="go" data-to="vistoria" data-p=\'' + JSON.stringify({ id: a.id }) + '\'><span><b>' + esc(a.escola) + '</b><small>' +
        (a.participantes && a.participantes.length ? esc(a.participantes.join(' e ')) + ' · ' : '') + 'check-in ' + hora(a.checkin) + ' · ' + duracao(a.checkin) + ' em campo · ' + plural(a.fotos, 'foto') + '</small></span><span style="margin-left:auto;color:var(--muted)">' + I('right') + '</span></button>').join('')
      : eq.status === 'em_transito' && eq.destino ? '<div class="small" style="margin-top:8px">A caminho de <b>' + esc(eq.destino) + '</b>' + (eq.eta ? ' · chegada ' + hora(eq.eta) : '') + '</div>' : '') +
    '<div class="row small muted" style="margin-top:8px;gap:14px;flex-wrap:wrap"><span>' + I('checksq', 15) + ' hoje ' + eq.hoje.concluidas + '/' + eq.hoje.total + '</span><span>' + I('cloud', 15) + ' ' + haQuanto(eq.vistoEm) + '</span>' +
      (eq.fila ? '<span class="c-amber" style="font-weight:700">' + eq.fila + ' na fila</span>' : '') + '</div>' +
    (completo ? '<div class="grid2 mt"><button class="btn btn-out btn-sm" style="width:100%" data-act="go" data-to="programacao" data-p=\'' + JSON.stringify({ modo: 'dia', equipeId: eq.id }) + '\'>' + I('calendar', 16) + ' Programação</button>' +
      (eq.lat && eq.lng ? '<button class="btn btn-out btn-sm" style="width:100%" data-act="eqMapa" data-lat="' + eq.lat + '" data-lng="' + eq.lng + '">' + I('pin', 16) + ' Localização</button>' : '<span></span>') + '</div>' : '') + '</section>';

Views.equipesSup = () => ({
  header: Views.hdrApp(),
  body: '<div id="eqBox">' + SKEL + '</div>',
  nav: 'equipesSup',
  after() {
    Dados.obter('sup:equipes', 'equipes', {}, (r, c, e) => {
      if (!r) return encher('#eqBox', erroBox(e));
      App._sup = r;
      // Um ponto por técnico (quando a equipe se divide em escolas diferentes); senão, a posição da equipe.
      const pts = [];
      r.equipes.forEach(x => {
        const ps = (x.pessoas || []).filter(q => q.lat && q.lng);
        if (ps.length) ps.forEach(q => pts.push({ id: x.id, nome: q.nome + ' · ' + x.nome + (q.escola ? ' · ' + q.escola : ''), lat: Number(q.lat), lng: Number(q.lng), st: q.escola ? 'andamento' : (ST_EQ[x.status] || ST_EQ.pausa)[2], act: 'eqFoco' }));
        else if (x.lat && x.lng) pts.push({ id: x.id, nome: x.nome, lat: Number(x.lat), lng: Number(x.lng), st: (ST_EQ[x.status] || ST_EQ.pausa)[2], act: 'eqFoco' });
      });
      encher('#eqBox', '<section class="card"><div class="card-h"><h3>Onde estão as equipes</h3><span class="muted small">posição do último sinal</span></div>' +
          (pts.length ? Graf.mapa(pts, 220) : '<div class="empty small">Nenhuma equipe enviou localização ainda. A posição chega quando o app está aberto, a cada 5 minutos.</div>') +
          '<div class="leg">' + Object.keys(ST_EQ).map(k => '<span><i style="background:' + ST_ESC[ST_EQ[k][2]][1] + '"></i>' + ST_EQ[k][0] + '</span>').join('') + '</div></section>' +
        r.equipes.map(eq => '<div id="eq-' + eq.id + '">' + Views.eqCard(eq, true) + '</div>').join(''));
    });
  }
});

  const eq = id => (r.equipes.find(e => e.id === id) || {}).nome || 'Sem equipe';
  const l = r.usuarios.filter(x => !q || (x.nome + ' ' + x.email + ' ' + x.matricula).toLowerCase().indexOf(q) >= 0);
  encher('#uBox', '<div class="muted small" style="margin:0 4px 10px">' + plural(l.length, 'usuário') + ' · ' + r.usuarios.filter(x => x.codigoPendente && !x.ativado).length + ' aguardando primeiro acesso</div>' +

    F.row('<div class="fld"><span class="lbl">Perfil</span><select class="inp" id="usPerfil">' + PERFIS.map(p => '<option value="' + p[0] + '"' + (x.perfil === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select></div>',
      '<div class="fld"><span class="lbl">Equipe</span><select class="inp" id="usEq"><option value="">Sem equipe</option>' + r.equipes.map(e => '<option value="' + e.id + '"' + (x.equipeId === e.id ? ' selected' : '') + '>' + esc(e.nome) + '</option>').join('') + '</select></div>') +
    '<span class="lbl">DREs autorizadas</span><div class="chips" id="usDres">' + (r.dres || []).map(d => '<button class="chip' + (dres.indexOf(d) >= 0 ? ' on' : '') + '" data-v="' + esc(d) + '" onclick="this.classList.toggle(\'on\')">' + esc(d) + '</button>').join('') + '</div>' +
    (x.id ? '<label class="check mt" style="cursor:pointer"><input type="checkbox" id="usAtivo"' + (x.ativo ? ' checked' : '') + ' style="width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto"><span class="t">Acesso ativo</span></label>' : '') +
    '<button class="btn btn-navy mt" id="usOk">' + (x.id ? 'Salvar' : 'Criar e enviar código') + '</button>' +
    (x.id ? '<button class="btn btn-out mt" id="usCod">' + I('lock', 18) + ' ' + (x.ativado ? 'Redefinir acesso (novo código)' : 'Reenviar código de acesso') + '</button>' : '') +
    '<p class="muted small" style="margin-top:10px">O usuário entra em <b>Primeiro acesso</b> com a matrícula ou e-mail e o código de 6 dígitos (válido por 72 h) e cria a própria senha.</p>');
  $('#usOk').onclick = async () => {
    const b = $('#usOk'); carregando(b, true);
    try {
      const res = await Api.run('salvarUsuario', {
        id: x.id || '', nome: $('#usNome').value.trim(), matricula: $('#usMat').value.trim(), email: $('#usEmail').value.trim(), rg: $('#usRg').value.trim(),
        cargo: $('#usCargo').value.trim(), telefone: $('#usTel').value.trim(), perfil: $('#usPerfil').value, equipeId: $('#usEq').value,
        dres: $$('#usDres .chip.on').map(c => c.dataset.v), ativo: $('#usAtivo') ? $('#usAtivo').checked : true
      });
      const nome = $('#usNome').value.trim();
      Sheet.close(true);
      Dados.limpar('usuarios'); App.rerender();
      if (res.codigo) Views.mostrarCodigo(nome, res.codigo); else toast('Usuário salvo', 'ok');
    } catch (e) { carregando(b, false); toast(e.message, 'err', 4000); }
  };
  if ($('#usCod')) $('#usCod').onclick = async () => {
    if (x.ativado && !(await confirmar({ titulo: 'Redefinir o acesso de ' + x.nome + '?', texto: 'A senha atual deixa de valer e o usuário cria outra com o novo código.', sim: 'Redefinir', perigo: true }))) return;
    try { const r2 = await Api.run('novoCodigo', { id: x.id, bloquearSenha: !!x.ativado }); Dados.limpar('usuarios'); App.rerender(); Views.mostrarCodigo(x.nome, r2.codigo); }
    catch (e) { toast(e.message, 'err'); }
  };
};
Views.mostrarCodigo = (nome, cod) => {

    '<div style="font-size:40px;font-weight:800;letter-spacing:10px;text-align:center;margin:16px 0;color:var(--navy)">' + esc(cod) + '</div>' +

};

Views.formVisita = (x, p) => {
  const D = App.data || {};
  x = x || { data: (p && p.ref) || somaD(hojeISO(), 1), hora: '08:30', tipo: 'visita', equipeId: (p && p.equipeId) || ((App._equipesLista || [])[0] || {}).id };
  const eqs = App._equipesLista || [];
  Sheet.open('<h3>' + (x.id ? 'Editar visita' : 'Nova visita') + '</h3>' +
    '<span class="lbl">Tipo</span><div class="seg" id="vsTipo">' + [['visita', 'Vistoria'], ['retorno', 'Retorno'], ['escritorio', 'Escritório']].map(t => '<button class="chip' + (x.tipo === t[0] ? ' on' : '') + '" data-v="' + t[0] + '" onclick="$$(\'#vsTipo .chip\').forEach(c=>c.classList.remove(\'on\'));this.classList.add(\'on\');$(\'#vsEscBox\').classList.toggle(\'hidden\',this.dataset.v===\'escritorio\')">' + t[1] + '</button>').join('') + '</div>' +
    '<div id="vsEscBox" class="' + (x.tipo === 'escritorio' ? 'hidden' : '') + '"><span class="lbl">Escola</span><select class="inp" id="vsEsc">' + (D.escolas || []).slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(e => '<option value="' + e.id + '"' + (x.escolaId === e.id ? ' selected' : '') + '>' + esc(e.nome) + ' · ' + esc(e.dre) + '</option>').join('') + '</select></div>' +
    '<span class="lbl">Equipe</span><select class="inp" id="vsEq">' + eqs.map(e => '<option value="' + e.id + '"' + (x.equipeId === e.id ? ' selected' : '') + '>' + esc(e.nome) + '</option>').join('') + '</select>' +
    '<div class="grid3" style="align-items:end"><div><span class="lbl">Data</span><input class="inp" type="date" id="vsData" value="' + esc(x.data) + '"></div><div><span class="lbl">Início</span><input class="inp" type="time" id="vsHora" value="' + esc(x.hora || '') + '"></div><div><span class="lbl">Fim</span><input class="inp" type="time" id="vsFim" value="' + esc(x.horaFim || '') + '"></div></div>' +
    '<span class="lbl">Observação</span><input class="inp" id="vsNota" value="' + esc(x.nota || '') + '" placeholder="Ex.: diretora confirmou presença">' +
    '<label class="check mt" style="cursor:pointer"><input type="checkbox" id="vsConf"' + (x.confirmado ? ' checked' : '') + ' style="width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto"><span class="t">Confirmado com a unidade</span></label>' +
    '<button class="btn btn-navy mt" id="vsOk">Salvar visita</button>' + (x.id ? '<button class="btn btn-out-red mt" id="vsDel">Excluir</button>' : ''));
  $('#vsOk').onclick = async () => {
    carregando($('#vsOk'), true);
    try {
      await Api.run('salvarVisita', { id: x.id || '', tipo: ($('#vsTipo .chip.on') || {}).dataset.v, escolaId: $('#vsEsc').value, equipeId: $('#vsEq').value, data: $('#vsData').value,
        hora: $('#vsHora').value, horaFim: $('#vsFim').value, nota: $('#vsNota').value, confirmado: $('#vsConf').checked });
      Sheet.close(true); toast('Visita salva', 'ok'); Dados.limpar('prog'); App.refresh(); App.rerender();
    } catch (e) { carregando($('#vsOk'), false); toast(e.message, 'err', 4000); }
  };
  if ($('#vsDel')) $('#vsDel').onclick = async () => {
    try { await Api.run('excluirVisita', { id: x.id }); Sheet.close(true); toast('Visita excluída'); Dados.limpar('prog'); App.rerender(); } catch (e) { toast(e.message, 'err'); }
  };
};

Object.assign(Act, {
  valF(el) { App._valF = el.dataset.v; App.rerender(); },
  usuarioNovo() { Views.formUsuario(null); },
  usuarioEditar(el) { Views.formUsuario((App._usr.usuarios || []).find(u => u.id === el.dataset.id)); },
  visitaNova(el) { Views.formVisita(null, JSON.parse(el.dataset.p || '{}')); },
  visitaEditar(el) {
    const k = Object.keys(Dados.mem).filter(x => x.indexOf('prog:') === 0);
    let it = null;
    k.forEach(x => { it = it || (Dados.mem[x].itens || []).find(i => i.id === el.dataset.visita); });
    if (!it) return Router.go('escola', { id: el.dataset.id });
    if (it.status === 'concluida' || it.status === 'em_andamento') return Router.go('escola', { id: it.escolaId });
    Views.formVisita(it);
  },
  eqFoco(el) { const c = $('#eq-' + el.dataset.id); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  eqMapa(el) { abrirExterno('https://www.google.com/maps/search/?api=1&query=' + el.dataset.lat + ',' + el.dataset.lng); }
});
</script>

  <script>App.start();</script>
</body>
